<div class="right_data_all">
  <form class="form_set" [formGroup]="registercompainForm">
    <div class="row">
      <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12">
        <mat-form-field appearance="outline">
          <mat-label>Please Enter your system serial Number</mat-label>
          <input type="text" matInput formControlName="serial_no" (input)="convertToUppercase($event)">
        </mat-form-field>
      </div>

      <div class="add_button" align="end">
        <button class="backBtn" type="button" (click)="continue()">Continue</button>
      </div>
    </div>
  </form>
</div>
