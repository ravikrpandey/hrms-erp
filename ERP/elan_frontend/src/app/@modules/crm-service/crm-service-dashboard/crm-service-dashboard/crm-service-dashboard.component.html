<div class="dashboard-container">
  <div class="log-title-and-cards">
    <div class="log-section">
      <div class="today-log-title" style="margin-right:5px;">
        <!-- <img src="path_to_icon.png" alt="icon" class="today-log-icon"> -->
        <span class="today-log-text">TODAY'S LOG</span>
      </div>
      <div class="log-card" *ngFor="let log of todaysLog">
        <p>{{ log.value }}</p>
        <h3>{{ log.title }}</h3>
      </div>
    </div>
  </div>

  <div class="data-section">
    <div class="data-card" *ngFor="let data of dataCards">
      <div class="data-card-header" [style.background-color]="data.color">
        <mat-icon [fontIcon]="data.icon"></mat-icon>
        <h4>{{ data.title }}</h4>
      </div>
      <div class="data-card-body">
        <div class="data-item" *ngFor="let row of data.rows; let last = last" [class.no-border]="last">
          <div class="data-value">{{ row.value }}</div>
          <div class="data-label">{{ row.label }}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="chart-section">
    <div class="chart-container">
      <div class="chart-card">
        <h3>Pending Complaint State Wise <a href="#"
            style="color: rgb(13, 221, 248);margin-left: 10px;font-weight: bolder;">Show Details</a></h3>
        <div id="stateWiseChart" class="chart"></div>
      </div>
      <div class="chart-card">
        <h3>Pending Complaint Engineer Wise <a href="#"
            style="color: rgb(13, 221, 248);margin-left: 10px;font-weight: bolder;">Show Details</a></h3>
        <div id="engineerWiseChart" class="chart"></div>
      </div>
    </div>
  </div>
</div>
