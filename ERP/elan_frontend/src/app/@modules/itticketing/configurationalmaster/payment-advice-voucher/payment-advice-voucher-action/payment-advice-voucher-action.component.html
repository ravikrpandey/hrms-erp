<div class="edd-del">
    <mat-icon class="viewButton" matTooltip="View" *ngIf="assignAction?.Read" matTooltipPosition="above"
        matTooltipHideDelay="100" (click)="openDialog()">visibility</mat-icon>
    <mat-icon class="editButton" matTooltip="Edit" *ngIf="assignAction?.Write" matTooltipPosition="above" matTooltipHideDelay="100"
        (click)="editData($event)">edit</mat-icon>
    <mat-icon class="deleteButton" matTooltip="Delete" *ngIf="assignAction?.Delete" matTooltipPosition="above" matTooltipHideDelay="100"
        (click)="DeleteData($event)">delete</mat-icon>
</div>
