<app-wrapper [title]="'Configurational Master'" [subTitle]="'Purchase Master'" [subheading]="'Vendor Type'"
  [showActions]="true" [actions]="[{ label: 'Add Vendor Type', icon: 'add', color: 'primary', callback: add('vendor-type') }]">
  <div class="">
    <div class="d-flex justify-content-between mb-3">
      <select id="page-size" (change)="onPageSizeChanged()" class="form-select" style="width: auto;">
        <option value="10" selected="">10</option>
        <option value="100">100</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
      </select>
      <div class="justify-content-end">
        <input type="text" class="form-control" id="filter-text-box" (input)="onFilterTextBoxChanged()"
          placeholder="Search" />
      </div>
    </div>

    <div class="ag_grid">
      <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width: 100%; height: 426px"
        [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="9" [rowData]="rowData"
        (gridReady)="onGridReady($event)" [gridOptions]="gridOptions" [getDataPath]="getDataPath"
        [frameworkComponents]="frameworkComponents" [autoGroupColumnDef]="autoGroupColumnDef" [treeData]="true"
        [animateRows]="true">
      </ag-grid-angular>
    </div>
  </div>
</app-wrapper>
