<app-wrapper
  [title]="'Configurational Master'"
  [subTitle]="'Reimbursement Master'"
  [subheading]="'Add Reimbursement'"
  [showActions]="true"
  [isBack]="true"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="travel-type-form">
    <div class="form-group">
      <mat-form-field appearance="outline" class="col-6 px-2">
        <input
          matInput
          id="travelTypeName"
          type="text"
          formControlName="name"
          placeholder="Enter type name"
          required
        />
        <mat-error *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
          Type name is required.
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="col-6 px-2" *ngIf="type === 'conveyance'">
        <!-- Select Option -->
         <mat-select formControlName="parentId" placeholder="Select Type" required>
          <mat-option *ngFor="let item of rowData;" [value]="item.id">{{item.name}}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="form-actions mt-3 d-flex justify-content-end gap-2" *ngIf="mode !== 'view'">
      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">{{mode === 'edit'? 'Update' : 'Save'}}</button>
    </div>
  </form>
</app-wrapper>
