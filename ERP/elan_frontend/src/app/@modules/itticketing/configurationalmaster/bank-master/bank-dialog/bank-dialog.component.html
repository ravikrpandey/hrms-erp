<div>
    <h3 *ngIf="!view" mat-dialog-title class="popHead" style="padding-left: 5px">{{!bankid?"Add Bank":"Update Bank"}}</h3>
    <h3 *ngIf="view" mat-dialog-title class="popHead" style="padding-left: 5px">Bank Records</h3>

    <ng-container *ngIf="view">
        <mat-dialog-content class="mat-typography">
            <div class="cotain">
                <div class="emp_key"> 
                    <p>Bank Name : </p>
                    <p>Bank Code : </p>
                    <!-- <p>Status :</p> -->
                </div>
                <div class="emp_value">
                    <p>{{departmentData?.bank_name}}</p>
                    <p> {{departmentData?.bank_code}}</p>
                    <!-- <p> {{areaData?.status}}</p> -->
                </div>
            </div>
        </mat-dialog-content>
        <mat-dialog-actions align="end" class="common_button_sub">
            <button mat-dialog-close class="cancel_button_y">Close</button>
        </mat-dialog-actions>
    </ng-container>

    <fieldset *ngIf="!view">
        <div class="m-3" [formGroup]="departmentForm">
            <div class="row">
                <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12 mt-2">
                    <mat-label>Bank Name</mat-label>
                </div>
                <div class="col-xxl-8 col-lg-8 col-md-8 col-sm-6 col-12">
                    <div class="form-group row">
                        <!-- <p>Department Name</p> -->
                        <mat-form-field appearance="outline" readonly>
                            <mat-label>Bank Name</mat-label>
                            <input matInput type="text" formControlName="department_name" />
                            <mat-error *ngIf="departmentForm.controls['department_name'].hasError('required')">
                                *Required!
                            </mat-error>
                            <mat-error *ngIf="departmentForm.controls['department_name'].hasError('leadingSpaces')">
                                *No leading spaces!
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>
            </div>
        </div>

        <mat-dialog-actions align="end" *ngIf="!view" class="common_button_sub">
            <button *ngIf="!bankid" (click)="onSubmitForm()">
                Submit
            </button>
            <button *ngIf="bankid" (click)="onUpdateForm()">
                Update
            </button>
            <button  mat-dialog-close  class="cancel_button_y">
                Close
            </button>
        </mat-dialog-actions>
    </fieldset>
</div>
