<h3 mat-dialog-title class="popHead">Country Dialog</h3>
<mat-dialog-content class="mat-typography">
    <div class="cotain">
        <div class="emp_key">
            <!-- <p>Country ID : </p> -->
            <p>Country Code : </p>
            <p>Country Name : </p>
            <p>Status :</p>
        </div>
        <div class="emp_value">
            <!-- <p>{{singleCountryData?.countryss_id}}</p> -->
            <p>{{singleCountryData?.country_code}}</p>
            <p>{{singleCountryData?.countryss_name}}</p>
            <p> {{singleCountryData?.status}}</p>
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions align="end" class="common_button_sub">
    <button mat-dialog-close class="cancel_button_y">Close</button>
</mat-dialog-actions>
