<ng-container *ngIf="visibility=='visible'">
    <h3 mat-dialog-title class="popHead">Product Category Record</h3>
    <mat-dialog-content class="mat-typography">
        <div class="cotain">
            <div class="emp_key">
                <p>Product Name : </p>
                <!-- <p>Product Code : </p> -->
            </div>
            <div class="emp_value">
                <p>{{singleProductData?.category_name}}</p>
                <!-- <p> {{singleProductData?.category_code}}</p> -->
            </div>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close mat-raised-button color="primary">Close</button>
    </mat-dialog-actions>
</ng-container>


<ng-container *ngIf="visibility!=='visible'">
    <h3 mat-dialog-title class="popHead"> Product Category</h3>
    <mat-dialog-content class="mat-typography">
        <div class="cotain">
            <form [formGroup]="productCategoryForm">
                <div class="form-group mt-3">
                    <mat-form-field appearance="outline">
                        <mat-label>Product category Name</mat-label>
                        <input matInput type="text" formControlName="category_name" />
                        <mat-error *ngIf="productCategoryForm.controls['category_name'].hasError('required')">
                            *Required!
                        </mat-error>
                        <mat-error *ngIf="productCategoryForm.controls['category_name'].hasError('leadingSpaces')">
                            *No leading spaces!
                        </mat-error>
                    </mat-form-field>
                    <!-- <mat-form-field appearance="outline">
                        <mat-label>Product Code</mat-label>
                        <input matInput type="text" formControlName="category_code" />
                        <mat-error *ngIf="productCategoryForm.controls['category_code'].hasError('required')">
                            *Required!
                        </mat-error>
                        <mat-error *ngIf="productCategoryForm.controls['category_code'].hasError('leadingSpaces')">
                            *No leading spaces!
                        </mat-error>
                    </mat-form-field> -->
                </div>
            </form>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button mat-raised-button color="primary"
            (click)="SubmitProductCategory(productCategoryForm)">Submit</button>
        <button mat-button mat-dialog-close mat-raised-button color="warn">Close</button>
    </mat-dialog-actions>

</ng-container>
