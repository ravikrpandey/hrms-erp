<div class="page-title p-2 px-3">
    <h1>Configurational Master</h1>
    <p>
        Item Cost Category Master
      <i
        class="fa fa-angle-right"
        aria-hidden="true"
        style="color: #858586"
      ></i>
      
    </p>
  </div>
<div class="right_data_all mb-4">
    <div [formGroup]="itemCostForm">
      <mat-card>
    
        <div class="row form_head">
            <h3>Item Cost Category Master</h3>
          </div>

        <div class="form_set">
          <div class="table-responsive col-12 mt-2">
            <table class="table table-bordered" formArrayName="itemCostForm">
              <thead>
                <tr>
                  <th>Cost Type</th>
                  <th>Chart of account</th>
                 
                
                  <th  >Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let group of itemCostFormFormArray.controls; let i = index" [formGroupName]="i">
                   
                  <td>
                    <mat-form-field appearance="outline">
                      <mat-label>Cost Type</mat-label>
                      
                       <input matInput value="" formControlName="cost_type"  >
                       
                  </mat-form-field>
                    </td>
                    <td>
                        <mat-form-field appearance="outline">
                          <mat-label>Account</mat-label>
                          <mat-select #select2 formControlName="chart_of_account_id"  >
          
                            <mat-select-filter *ngIf="select2.focused" [array]="chartedAccount1"
                              (filteredReturn)="accountFilter($event)"></mat-select-filter>
                            
                              <mat-option [value]="data.id" *ngFor="let data of chartedAccount"  
                                >
                                {{data.account_name}}
                              </mat-option>
                           </mat-select>
                      </mat-form-field>
                      </td>
                  <td  >
                   
                    <mat-icon matTooltip="Remove Item" (click)="removeItem(i)" *ngIf="itemCostFormFormArray.length>1">delete</mat-icon>
                    <mat-icon matTooltip="Add Item" (click)="addItem()" class="pointer">add_circle</mat-icon>
                  </td>
                </tr>
              </tbody>
            </table>
          
          </div>
  
    <div class="mt-3 common_button_sub" *ngIf="type !== 'View'">
        <button  (click)="onSubmit()">
          Update
        </button>
        
      </div>
    </div>
        </mat-card>
        </div>
        </div>
