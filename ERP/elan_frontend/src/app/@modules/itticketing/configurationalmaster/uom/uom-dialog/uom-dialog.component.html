<div>
    <h3 mat-dialog-title class="popHead" style="padding-left: 5px">
      {{ view ? 'UOM Record' : (!uomId ? 'Add UOM' : 'Update UOM') }}
    </h3>
  
    <!-- Conditionally Render View or Edit Form -->
    <ng-container *ngIf="view; else editForm">
      <mat-dialog-content class="mat-typography">
        <div class="cotain">
          <div class="emp_key">
            <p>UOM Name :</p>
            <p>Description:</p>
          </div>
          <div class="emp_value">
            <p>{{ uomData?.uom_name }}</p>
            <p>{{ uomData?.uom_description }}</p>
          </div>
        </div>
      </mat-dialog-content>
      <mat-dialog-actions align="end" class="common_button_sub mb-3">
        <button mat-dialog-close class="cancel_button_y">Close</button>
      </mat-dialog-actions>
    </ng-container>
  
    <!-- Edit/Add Form -->
    <ng-template #editForm>
      <fieldset>
        <div class="m-3" [formGroup]="UOMForm">
          <div class="row">
            <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-12">
              <mat-label>UOM Name</mat-label>
            </div>
            <div class="col-xxl-9 col-lg-9 col-md-9 col-sm-6 col-12">
              <div class="form-group mb-4">
                <mat-form-field appearance="outline">
                  <mat-label>UOM Name</mat-label>
                  <input matInput type="text" formControlName="uom_name" />
                  <mat-error *ngIf="UOMForm.controls['uom_name'].hasError('required')">
                    *Required!
                  </mat-error>
                  <mat-error *ngIf="UOMForm.controls['uom_name'].hasError('leadingSpaces')">
                    *No leading spaces!
                  </mat-error>
                </mat-form-field>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-12">
              <mat-label>Description</mat-label>
            </div>
            <div class="col-xxl-9 col-lg-9 col-md-9 col-sm-6 col-12">
              <div class="form-group mb-4">
                <mat-form-field appearance="outline">
                  <mat-label>Description</mat-label>
                  <input matInput type="text" formControlName="uom_description" />
                  <mat-error *ngIf="UOMForm.controls['uom_description'].hasError('required')">
                    *Required!
                  </mat-error>
                  <mat-error *ngIf="UOMForm.controls['uom_description'].hasError('leadingSpaces')">
                    *No leading spaces!
                  </mat-error>
                </mat-form-field>
              </div>
            </div>
          </div>
        </div>
  
        <mat-dialog-actions align="end" class="common_button_sub mb-2">
          <button *ngIf="!uomId" (click)="onSubmitForm()">Save</button>
          <button *ngIf="uomId" (click)="onUpdateForm()">Update</button>
          <button class="cancel_button_y" mat-dialog-close>
            Close
          </button>
        </mat-dialog-actions>
      </fieldset>
    </ng-template>
  </div>
