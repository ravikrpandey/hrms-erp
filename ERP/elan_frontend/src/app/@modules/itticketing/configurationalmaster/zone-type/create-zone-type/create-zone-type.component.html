<div class="heading_top">
  <div class="page-title">
    <h1>Configurational Master</h1>
    <p>
      <span *ngIf="!id">Create Sub Location Type</span>
      <span *ngIf="action_type=='edit'">Update Sub Location Type</span>
      <span *ngIf="action_type=='view'">View Sub Location Type</span>
    </p>
  </div>

  <div class="add_button">
    <button class="backBtn" (click)="onBack()">
      <i class="fa fa-arrow-circle-left"></i> Back
    </button>
  </div>
</div>

<mat-card style="box-shadow: none">
  <form [formGroup]="createForm" class="form_set">

    <div class="row">

      <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Sub Location Type Name</mat-label>
          <input matInput formControlName="zone_type" [readonly]="action_type=='view'" />

          <mat-error *ngIf="createForm.controls['zone_type'].hasError('required')">
            *Required!
          </mat-error>
        </mat-form-field>
      </div>

    </div>

    <div class="common_button_sub" align="end" *ngIf="action_type!=='view'">
      <button (click)="onSubmit()">{{ id ? 'Update' : 'Save' }}</button>
      <!-- <button class="cancel_button_y" (click)="onBack()">Cancel</button> -->
    </div>

  </form>
</mat-card>
