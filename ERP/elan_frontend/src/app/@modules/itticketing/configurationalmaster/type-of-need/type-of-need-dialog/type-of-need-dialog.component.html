<ng-container *ngIf="view=='view'">
  <h3 class="popHead">Type Of Need Record</h3>
  <mat-dialog-content class="mat-typography">
    <div class="cotain">
      <div class="emp_key">
        <p>Type Of Need :</p>
      </div>
      <div class="emp_value">
        <p>{{ getData?.need_type }}</p>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="common_button_sub mb-3">
    <button class="cancel_button_y" mat-dialog-close >
      Close
    </button>
  </mat-dialog-actions>
</ng-container>

<ng-container *ngIf="view!='view'">
  <h3 mat-dialog-title class="popHead"  *ngIf="!id"> Add Type Of Need</h3>
  <h3 mat-dialog-title class="popHead"  *ngIf="id"> Update Type Of Need</h3>
  <mat-dialog-content class="mat-typography mt-3">
    <form [formGroup]="typeOfNeedForm">
      <div class="form-group row">
        <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12">
          <mat-form-field appearance="outline" class="mt-2">
            <mat-label>Type Of Need</mat-label>
            <input matInput type="text" formControlName="need_type" />
            <mat-error *ngIf="typeOfNeedForm.controls['need_type'].hasError('required')">
            *Required!
          </mat-error>
          <mat-error *ngIf="typeOfNeedForm.controls['need_type'].hasError('leadingSpaces')">
            *No leading spaces!
          </mat-error>
          </mat-form-field>
        </div>
      </div>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="common_button_sub mb-3">
    <button  (click)="submitData(typeOfNeedForm.value)" >
      Submit
    </button>
    <button mat-dialog-close class="cancel_button_y">
      Close
    </button>
  </mat-dialog-actions>
</ng-container>
