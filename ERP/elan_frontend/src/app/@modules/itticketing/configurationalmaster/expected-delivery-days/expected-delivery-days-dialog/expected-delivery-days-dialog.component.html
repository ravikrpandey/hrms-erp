


<ng-container >
    <h3 mat-dialog-title class="popHead"> Add Expected Delivery Days</h3>
    <mat-dialog-content class="mat-typography">
        <div class="">
            <form [formGroup]="expectedDeliveryDaysForm" >
                <div class="form-group mt-3">
                    <mat-form-field appearance="outline">
                        <mat-label>Days  </mat-label>
                        <input matInput type="number" formControlName="days" placeholder="Enter days " />
                        <mat-error *ngIf="expectedDeliveryDaysForm.controls['days'].hasError('required')">
                            *Required!
                        </mat-error>                        
                    </mat-form-field>
                </div>
            </form>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end" class="common_button_sub mb-3">
        <button  (click)="ngSubmitDesignation(expectedDeliveryDaysForm)">Save</button>
        <button  mat-dialog-close class="cancel_button_y">Close</button>
    </mat-dialog-actions>

</ng-container>
