<ng-container *ngIf="mode=='view'">
  <h3 class="popHead">Type Of Expense Record</h3>
  <mat-dialog-content class="mat-typography">
    <div class="cotain">
      <div class="emp_key">
        <p> Type Of Expense:</p>
      </div>
      <div class="emp_value">
        <p>{{ getData?.expense_type }}</p>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="common_button_sub mb-3">
    <button mat-dialog-close class="cancel_button_y">
      Close
    </button>
  </mat-dialog-actions>
</ng-container>
<ng-container *ngIf="mode!='view'">
  <h3 mat-dialog-title class="popHead" *ngIf="id">Update Type Of Expense</h3>
  <h3 mat-dialog-title class="popHead" *ngIf="!id">Type Of Expense</h3>
  <mat-dialog-content class="mat-typography mt-3">
    <form [formGroup]="typeOfExpenseForm">
      <div class="form-group row">
        <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12">
          <mat-form-field appearance="outline" class="mt-2">
            <mat-label>Expense Type</mat-label>
            <input matInput type="text" formControlName="expense_type" />
            <mat-error *ngIf="typeOfExpenseForm.controls['expense_type'].hasError('required')">
            *Required!
          </mat-error>
          <mat-error *ngIf="typeOfExpenseForm.controls['expense_type'].hasError('leadingSpaces')">
            *No leading spaces!
          </mat-error>
          </mat-form-field>
        </div>
      </div> 
      
      <div class="form-group mt-2   ">
        <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12">
          <mat-form-field appearance="outline"  >
                      <mat-label>Map Chart of Account</mat-label>
                      <mat-select #select2 formControlName="chart_account_id"  >

                        <mat-select-filter *ngIf="select2.focused" [array]="chartedAccount1"
                          (filteredReturn)="accountFilter($event)"></mat-select-filter>
                        <ng-container>
                          <mat-option [value]="data.id" *ngFor="let data of chartedAccount" [hidden]="data.hidden"
                             >
                            {{data.account_name}}
                          </mat-option>
                        </ng-container>

                      </mat-select>
                      
                    </mat-form-field>
        </div>
      </div>






    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="common_button_sub mb-3">
    <button   (click)="submitData(typeOfExpenseForm.value)" >
      Submit
    </button>
    <button mat-dialog-close class="cancel_button_y">
      Close
    </button>
  </mat-dialog-actions>
</ng-container>
