  <ng-container >
    <h3 mat-dialog-title class="popHead" *ngIf="id && mode!='view'">Update Usage Type</h3>
    <h3 mat-dialog-title class="popHead" *ngIf="mode=='view'">View Usage Type</h3>
    <h3 mat-dialog-title class="popHead" *ngIf="!id">Add Usage Type</h3>
    <mat-dialog-content class="mat-typography mt-3">
      <form [formGroup]="userForm ">
        <div class="form-group row">
          <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12">
            <mat-form-field appearance="outline" class="mt-2" [ngClass]="mode === 'view' ? 'readOnly' : ''">
              <mat-label>Enter Usage Type</mat-label>
              <input matInput type="text" formControlName="name"/>
              <mat-error *ngIf="userForm .controls['name'].hasError('required')">
                *Required!
              </mat-error>
              <mat-error *ngIf="userForm .controls['name'].hasError('leadingSpaces')">
                *No leading spaces!
              </mat-error>
            </mat-form-field>
          </div>
           
        </div>
      </form>
    </mat-dialog-content>
    <mat-dialog-actions align="end" class="common_button_sub" >
      <button   (click)="submitData(userForm .value)" *ngIf="mode!='view'" >
        {{ id ? "Update" : "Create"}}
      </button>
      <button  mat-dialog-close class="cancel_button_y">
        Close
      </button>
    </mat-dialog-actions>
  </ng-container>
