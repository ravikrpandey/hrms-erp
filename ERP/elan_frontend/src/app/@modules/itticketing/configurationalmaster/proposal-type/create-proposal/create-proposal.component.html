<div class="heading_top">
  <div class="page-title">
    <h1>Configuration Master</h1>
    <p>
      Proposal Type
      <i class="fa fa-angle-right" aria-hidden="true" style="color: #363636">
      </i
      ><span> Proposal Type </span>
    </p>
  </div>
  <div class="add_button">
    <button class="backBtn" (click)="back()">
      <i class="fa fa-arrow-left"></i> Back
    </button>
  </div>
</div>
<section class="right_data_all">
  <div class="form_basic">
    <form class="form_set" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="row">
        <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-12">
          <div class="form-group mb-3">
            <mat-form-field appearance="outline">
              <mat-label>Proposal Name</mat-label>
              <input matInput type="text" formControlName="perposal_type" />
            </mat-form-field>
          </div>
        </div>
        <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-12">
          <div class="form-group mb-3">
            <mat-form-field appearance="outline">
              <mat-label>Proposal Description</mat-label>
              <input
                matInput
                type="text"
                formControlName="perposal_discription"
              />
            </mat-form-field>
          </div>
        </div>
        <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-12">
          <div class="form-group mb-3">
            <mat-form-field appearance="outline">
              <mat-select formControlName="status">
                <mat-option value="ACTIVE">Active</mat-option>
                <mat-option value="INACTIVE">Inactive</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
      </div>
      <div class="mt-3 common_button_sub" *ngIf="mode !== 'view'">
        <button>{{ mode !== "edit" ? "Save" : "Update" }}</button>
        <button class="cancel_button_y" type="button" (click)="back()">
          Cancel
        </button>
      </div>
    </form>
  </div>
</section>
