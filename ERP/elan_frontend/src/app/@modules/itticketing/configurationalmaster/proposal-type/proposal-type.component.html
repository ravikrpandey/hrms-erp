<div class="heading_top">
  <div class="page-title">
    <h1>Configuration Master</h1>
    <p>
      Proposal Type
      <i
        class="fa fa-angle-right"
        aria-hidden="true"
        style="color: #858586"
      ></i>
      <span>Proposal Type</span>
    </p>
  </div>
  <div class="add_button">
    <button type="button" routerLink="/master/configurational-master/proposal-type/create">Create</button>
  </div>
</div>

<div class="right_data_all">
  <div class="employ_sube py-2">
    <div class="example-header">
      <select id="page-size" (change)="onPageSizeChanged()">
        <option value="10" selected="">10</option>
        <option value="100">100</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
      </select>
    </div>
  </div>

  <div class="ag_grid">
    <ag-grid-angular
      [rowClass]="rowClass"
      class="ag-theme-alpine"
      style="width: 100%; height: 426px"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [pagination]="true"
      [paginationPageSize]="10"
    >
    </ag-grid-angular>
  </div>
</div>
