<ng-container *ngIf="view">
  <h3 mat-dialog-title class="popHead">City Record</h3>
  <mat-dialog-content class="mat-typography">
    <div class="cotain">
      <div class="emp_key">
        <p>City Name</p>
        <p>State Name</p>
      </div>
      <div class="emp_value">
        <p>{{ singleCityData?.city_name }}</p>
        <p>{{ singleCityData?.states_name }}</p>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close mat-raised-button color="primary">
      Close
    </button>
  </mat-dialog-actions>
</ng-container>
<fieldset *ngIf="!view">
  <div class="m-3" [formGroup]="cityForm">
    <div class="row">
      <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-6">
        <div class="form-group">
          <mat-form-field appearance="outline">
            <mat-label>State</mat-label>
            <mat-select formControlName="states_id">
              <mat-select-filter
                [array]="stateVar"
                (filteredReturn)="stateFilter($event)"
              ></mat-select-filter>
              <mat-option
                *ngFor="let state of StateDataList"
                [value]="state.states_id"
                >{{ state.states_name }}</mat-option
              >
            </mat-select>
          </mat-form-field>
        </div>
      </div>
      <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-6">
        <div class="form-group">
          <mat-form-field appearance="outline">
            <mat-label>City Name</mat-label>
            <input matInput type="text" formControlName="city_name" />
          </mat-form-field>
        </div>
      </div>
    </div>
  </div>

  <mat-dialog-actions align="end" *ngIf="!view" class="common_button_sub mb-3">
    <button *ngIf="!city_id" (click)="onSubmitForm()" class="mx-2">Save</button>
    <button *ngIf="city_id" (click)="onUpdateForm()" class="mx-2">
      Update
    </button>
    <button mat-dialog-close class="cancel_button_y">Close</button>
  </mat-dialog-actions>
</fieldset>
