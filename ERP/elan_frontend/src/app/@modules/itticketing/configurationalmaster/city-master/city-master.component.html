<app-wrapper
  [title]="'Configurational Master'"
  [subTitle]="'City Master List'"
  [showActions]="true"
  [actions]="actions"
>
  <div class="right_data_all">
    <div class="employ_sube py-2">
      <div class="">
        <select id="page-size" (change)="onPageSizeChanged()">
          <option value="10" selected="">10</option>
          <option value="100">100</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
        </select>
      </div>
      <div class="employee_2" align="end">
        <input
          type="text"
          class="form-control"
          id="filter-text-box"
          (input)="onFilterTextBoxChanged()"
          placeholder="Search"
        />
      </div>
    </div>

    <div class="ag_grid">
      <ag-grid-angular
        [rowClass]="rowClass"
        class="ag-theme-alpine"
        style="width: 100%; height: 426px"
        [columnDefs]="columnDefs"
        [pagination]="true"
        (cellValueChanged)="onCellValueChanged($event)"
        [paginationPageSize]="10"
        [rowData]="rowData"
        (gridReady)="onGridReady($event)"
      >
      </ag-grid-angular>
    </div>
  </div>
</app-wrapper>
