<app-wrapper [title]="'Configurational Master'" [subTitle]="'Quotation Master'" [subheading]="'Payment Category'"
    [showActions]="true" [isBack]="true">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group row">
            <div class="col-6 px-2">
                <mat-form-field appearance="outline" class="col-12 px-2">
                    <mat-label>Category Name</mat-label>
                    <input matInput id="payment_name" type="text" formControlName="payment_name"
                        placeholder="Enter Insurance Name" />
                </mat-form-field>
            </div>
        </div>
        <div class="form-actions mt-3 d-flex justify-content-end gap-2" *ngIf="mode !== 'view'">
            <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
                {{ mode === "edit" ? "Update" : "Save" }}
            </button>
        </div>
    </form>
</app-wrapper>
