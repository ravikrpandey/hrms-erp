<app-wrapper [title]="'Configurational Master'" [subTitle]="'Quotation Master'" [subheading]="'Customer Payment Terms'"
    [showActions]="true" [isBack]="true">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group row">
            <div class="col-6 px-2">
                <mat-form-field appearance="outline" class="col-12 px-2">
                    <mat-label>Term Name</mat-label>
                    <input matInput id="term_name" type="text" formControlName="term_name"
                        placeholder="Enter Term Name" required />
                </mat-form-field>
            </div>
            <div class="col-6 px-2">
                <mat-form-field appearance="outline" class="col-12 px-2">
                    <mat-label>Credit Days</mat-label>
                    <input matInput id="credit_days" type="number" formControlName="credit_days"
                        placeholder="Enter Credit Days" required />
                </mat-form-field>
            </div>
            <div class="col-6 px-2">
                <mat-form-field appearance="outline" class="col-12 px-2">
                    <mat-label>Status</mat-label>
                    <mat-select formControlName="status" placeholder="Select Status">
                        <mat-option value="ACTIVE">ACTIVE</mat-option>
                        <mat-option value="INACTIVE">INACTIVE</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
        <div class="form-actions mt-3 d-flex justify-content-end gap-2" *ngIf="mode !== 'view'">
            <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
                {{ mode === "edit" ? "Update" : "Save" }}
            </button>
        </div>
    </form>
</app-wrapper>
