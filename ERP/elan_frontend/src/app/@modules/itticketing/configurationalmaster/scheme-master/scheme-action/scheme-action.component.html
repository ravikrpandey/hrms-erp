<div class="edd-del">
    <mat-icon matTooltip="View" matTooltipPosition="above"
        matTooltipHideDelay="100" (click)="openDialog()">visibility</mat-icon>
    <mat-icon matTooltip="Edit"  matTooltipPosition="above" matTooltipHideDelay="100"
        (click)="editData($event)">edit</mat-icon>
    <mat-icon matTooltip="Delete"  matTooltipPosition="above" matTooltipHideDelay="100"
        (click)="Delete($event)">delete</mat-icon>
</div>
