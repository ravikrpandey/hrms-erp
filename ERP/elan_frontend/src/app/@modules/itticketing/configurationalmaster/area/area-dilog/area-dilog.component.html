<div>
    <h3 *ngIf="!view" mat-dialog-title class="popHead" style="padding-left: 5px">{{!id?"Add Area":"Update Area"}}</h3>
    <h3 *ngIf="view" mat-dialog-title class="popHead" style="padding-left: 5px"> Area Record</h3>

    <ng-container *ngIf="view">
        <mat-dialog-content class="mat-typography">
            <div class="cotain">
                <div class="emp_key"> 
                    <p>Area Name : </p>
                    <p>Department: </p>
                    <!-- <p>Status :</p> -->
                </div>
                <div class="emp_value">
                    <p>{{areaData?.area_name}}</p>
                    <p> {{areaData?.department_name}}</p>
                    <!-- <p> {{areaData?.status}}</p> -->
                </div>
            </div>
        </mat-dialog-content>
        <mat-dialog-actions align="end" class="common_button_sub">
            <button mat-dialog-close class="cancel_button_y">Close</button>
        </mat-dialog-actions>
    </ng-container>
   
    <fieldset *ngIf="!view" >
        <div class="m-3" [formGroup]="areaForm">
            <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-6 col-12">
                <div class="form-group mb-4"  [ngClass]="view ? 'readonly-select':''">
                    <mat-form-field appearance="outline">
                    <mat-label>Department</mat-label>
                    <mat-select   formControlName="department"  >
                        <mat-select-filter [array]="departments" (filteredReturn)="departmentFilter($event)"></mat-select-filter>
                    <mat-option *ngFor="let department of departmentList"
                        [value]="department.dept_id">{{department.department_name}}</mat-option>
                        </mat-select>
                        <mat-error *ngIf="areaForm.get('department')?.hasError('required')">
                        This field is required!
                        </mat-error>
                    </mat-form-field>
                </div>     
            </div>
            <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-6 col-12">
                <div class="form-group mb-4">
                    <mat-form-field appearance="outline" readonly>
                        <mat-label>Area Name</mat-label>
                        <input matInput type="text" formControlName="area_name" />
                        <mat-error *ngIf="areaForm.controls['area_name'].hasError('required')">
                            *Required!
                        </mat-error>
                        <mat-error *ngIf="areaForm.controls['area_name'].hasError('leadingSpaces')">
                            *No leading spaces!
                        </mat-error>
                    </mat-form-field>
                </div>
            </div>
            
        </div>

        <mat-dialog-actions align="end" *ngIf="!view" class="common_button_sub">
            <button *ngIf="!id"  (click)="onSubmitForm()" class="mx-2">
                Submit
            </button>
            <button *ngIf="id"  (click)="onUpdateForm()" class="mx-2">
                Update
            </button>
            <button mat-dialog-close class="cancel_button_y" style="float: right">
                Close
            </button>      
        </mat-dialog-actions>
    </fieldset>
</div>
