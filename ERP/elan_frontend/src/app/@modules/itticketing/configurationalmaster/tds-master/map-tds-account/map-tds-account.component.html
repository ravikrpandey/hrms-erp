<div class="">
    <h3 mat-dialog-title class="popHead">Map Chart Of Account For TDS Liability<mat-icon style="float:right;margin-top:15px;color:white"   mat-dialog-close>clear</mat-icon></h3>
    <!-- <button mat-button mat-dialog-close>Cancel</button> -->
  
    <mat-dialog-content class="mat-typography mt-3">
        <form class="" [formGroup]="accountForm" (ngSubmit)="createData(accountForm)" >
          <div class="form-group mt-2">
           
            <mat-form-field appearance="outline">
              <mat-label>Mapped Chart Of Account</mat-label>
              <input matInput 
                     [value]="getAccountName(accountForm.get('mapped_chart_account_id')?.value)" 
                     readonly />
            </mat-form-field>
          
          
            <mat-form-field appearance="outline">
              <mat-label>Select Chart Of Account</mat-label>
              <mat-select formControlName="chart_account_id">
                <mat-option *ngFor="let value of chartOfAccount"
                  [value]="value.id">{{ value?.account_name }}</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
          
          
          <div class="common_button_sub mt-4">
         
            <button  >
               Update
             </button>
             
          </div>
        </form>
    </mat-dialog-content>
  </div>
