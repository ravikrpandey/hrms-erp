<ng-container >
    <h3 mat-dialog-title class="popHead">
      {{
        data?.mode === 'view' 
          ? 'View Bank Reciept Voucher Type' 
          : data?.id 
            ? 'Update Bank Reciept Voucher Type' 
            : 'Add Bank Reciept Voucher Type'
      }}
    </h3>
    
      <mat-dialog-content class="mat-typography mt-3">
        <form [formGroup]="voucherForm ">
          <div class="form-group row">
            <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12">
              <mat-form-field appearance="outline" class="mt-2" [ngClass]="data?.mode === 'view' ? 'readOnly' : ''">
                <mat-label>Bank Reciept Voucher Name</mat-label>
                <input matInput type="text" formControlName="voucher_name" autofocus="off" />
                <mat-error *ngIf="voucherForm .controls['voucher_name'].hasError('required')">
                  *Required!
                </mat-error>
                <mat-error *ngIf="voucherForm .controls['voucher_name'].hasError('leadingSpaces')">
                  *No leading spaces!
                </mat-error>
              </mat-form-field>
            </div>
            <div class="col-xxl-10 col-lg-10 col-md-10 col-sm-10 col-12">
              <mat-form-field appearance="outline" class="mt-2 readOnly"  >
                <mat-label>Voucher Series Number</mat-label>
                <input matInput type="text" formControlName="voucher_series" readonly>
              </mat-form-field>
            </div>
            <div class="col-xxl-2 col-lg-2 col-md-2 col-sm-2 col-12 mt-3">
              <mat-icon matTooltip="Generate Series" style="cursor: pointer;" [ngClass]="data?.mode === 'view' ? 'readOnly' : ''"  (click)="generateServie()" >refresh</mat-icon>
  
            </div>
          </div>
        </form>
      </mat-dialog-content>
      <mat-dialog-actions align="end" class="common_button_sub" >
        <button   (click)="submitData(voucherForm .value)" *ngIf="data?.mode!='view'" >
          {{ data?.id ? "Update" : "Create"}}
        </button>
        <button  mat-dialog-close class="cancel_button_y">
          Close
        </button>
      </mat-dialog-actions>
    </ng-container>
