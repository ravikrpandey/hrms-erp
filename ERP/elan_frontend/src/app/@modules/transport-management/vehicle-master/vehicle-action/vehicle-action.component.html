<div class="edd-del">
  <mat-icon matTooltip="Edit" *ngIf="assignAction?.Write" (click)="pageCall($event,'update')" >edit</mat-icon>
  <mat-icon matTooltip="View" *ngIf="assignAction?.Read" (click)="pageCall($event,'view')">visibility</mat-icon>
  <mat-icon matTooltip="Delete" *ngIf="assignAction?.Write" (click)="delete($event)">delete</mat-icon>
</div>
