
 <div class="heading_top">
  <div class="page-title">
    <h1>Transport Management</h1>
    <p>All Trips <i class="fa fa-angle-right" aria-hidden="true">
      </i><span>All Trips List</span></p>
  </div>
</div>
<div class="right_data_all">
<div class="row">
  <div class="col-md-12">
    <div class="tab_menu">
      <div class="tab-item">

        <button class="main-button" color="primary" [routerLink]="['approved-trip-list']"
          [ngClass]="{'active_button': currentUrl.includes('approved-trip-list')}">
          Approved Trip
        </button>

        <button class="main-button" color="primary" [routerLink]="['schedule-trip-list']"
          [ngClass]="{'active_button': currentUrl.includes('schedule-trip-list')}">
          Schedule Trip
        </button>

        <button class="main-button" color="primary" [routerLink]="['live-trip-list']"
          [ngClass]="{'active_button': isLiveTripActive()}">
          Live Trip
        </button>

        <button class="main-button" color="primary" [routerLink]="['closed-trip-list']"
          [ngClass]="{'active_button': currentUrl.includes('closed-trip-list')}">
          Closed Trip
        </button>

      </div>
    </div>
  </div>
</div>
