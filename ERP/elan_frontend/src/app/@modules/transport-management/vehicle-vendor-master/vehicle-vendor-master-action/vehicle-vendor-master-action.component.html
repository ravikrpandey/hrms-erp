<div class="edd-del">
  <mat-icon class="editButton" matTooltip="Edit" *ngIf="assignAction?.Write" (click)="edit($event)" >edit</mat-icon>
  <mat-icon class="viewButton" matTooltip="View" *ngIf="assignAction?.Read" (click)="view($event)">visibility</mat-icon>
  <mat-icon class="deleteButton" matTooltip="Delete" *ngIf="assignAction?.Delete" (click)="delete($event)">delete</mat-icon>
</div>
