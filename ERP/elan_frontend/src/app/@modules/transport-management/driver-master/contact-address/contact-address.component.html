<div class="form_basic1 main_form">
  <div class="right_data_all">
    <div class="heading_neo">
      <h3>Contact & Address</h3>
    </div>
    <form class="form_set formBorder" [formGroup]="contactform">
      <div class="form_sePo">
        <div class="row">
          <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-6 col-12">
            <div class="form-group">
              <mat-label>Mobile Number <span class="alertspan">*</span></mat-label>
              <mat-form-field>
                <input matInput type="text" formControlName="mobile_number">
              </mat-form-field>
            </div>
          </div>

          <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-6 col-12">
            <div class="form-group">
              <mat-label>Alternate Contact Number</mat-label>
              <mat-form-field>
                <input matInput type="text" formControlName="alternate_contact_number">
              </mat-form-field>
            </div>
          </div>

          <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-6 col-12">
            <div class="form-group">
              <mat-label>Email Address <span class="alertspan">*</span></mat-label>
              <mat-form-field>
                <input matInput type="email" formControlName="email_address">
              </mat-form-field>
            </div>
          </div>

          <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-12 col-12">
            <div class="form-group">
              <mat-label>Residential Address <span class="alertspan">*</span></mat-label>
              <mat-form-field>
                <textarea matInput formControlName="residential_address"></textarea>
              </mat-form-field>
            </div>
          </div>

          <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-12 col-12">
            <div class="form-group">
              <mat-label>Permanent Address <span class="alertspan">*</span></mat-label>
              <mat-form-field>
                <textarea matInput formControlName="permanent_address"></textarea>
              </mat-form-field>
            </div>
          </div>

          <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12" *ngIf="action_type!='view'">
            <div class="common_button_sub">
              <button (click)="onSubmitForm()">Save & Next</button>
            </div>
          </div>

        </div>
      </div>
    </form>
  </div>
</div>
