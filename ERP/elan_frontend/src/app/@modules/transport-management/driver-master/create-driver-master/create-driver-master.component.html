<div class="heading_top">
  <div class="page-title">
    <h1>Transport Management</h1>
    <p>Driver Master</p>
  </div>
  <div class="add_button">
    <button routerLink="../" type="button">Back To List</button>
    <!-- <button class="backBtn" routerLink="../" *ngIf="(title !='BASIC-DETAILS')"><i class="fa fa-arrow-circle-left"></i>
      Back</button> -->
  </div>
</div>
<div fxflex="100%">
  <div class="row">
    <div class="col-md-12">
    <div class="tab_menu">
      <div class="tab-item">
        <div class="mainTabs">
        <button class="main-button"  [routerLink]="['basic-driver']"
        routerLinkActive="active_button"  (click)="goToBasicDetails('BASIC-DRIVER')">
          <i class="fas fa-address-card"></i>
        </button>
          <p>Basic Driver </p>
      </div>
      <div class="mainTabs">
        <button class="main-button"  [routerLink]="['contact-address']"
          routerLinkActive="active_button" (click)="goToContactDetails('CONTACT-ADDRESS')">
          <i class="far fa-file-alt"></i>
        </button>
        <p>Contact & Address </p>
        </div>


        <div class="mainTabs">
        <button class="main-button"  [routerLink]="['license-compliance']"
          routerLinkActive="active_button" (click)="goToLicenseDetails('LICENSE-COMPLIANCE')">
          <i class="far fa-money-bill-alt"></i>
        </button>
          <p>License & Compliance </p>
        </div>
        <div class="mainTabs">
        <button class="main-button"  [routerLink]="['employment-assignment']"
          routerLinkActive="active_button" (click)="goToEmployementDetails('EMPLOYMENT-ASSIGNMENT')">
          <i class="far fa-credit-card"></i></button>
          <p>Employment & Assignment </p>
          </div>
          <div class="mainTabs">
        <button class="main-button"  [routerLink]="['attachments-Documents']"
          routerLinkActive="active_button" (click)="goToDocumentDetails('ATTACHMENTS-DOCUMENTS')">
          <i class="fas fa-id-card-alt"></i>
        </button>
          <p>Attachments & Documents</p>
        </div>

      </div>
    </div>
    </div>
  </div>
</div>
<router-outlet></router-outlet>
