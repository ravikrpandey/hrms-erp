<div class="form_basic1 main_form">
  <div class="right_data_all">
    <div class="heading_neo">
      <h3>Attachments & Documents</h3>
    </div>
    <form class="form_set formBorder" [formGroup]="attachmentform">

      <div class="form_sePo">
        <div class="row">
          <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
            <div class="form-group">
              <label >Driving License Copy Upload</label>
              <div class="input-group">
                <input
                  class="form-control"
                  type="file"
                  style="padding-right: 10px;"
                  (change)="onChangefile($event,'driving_license_copy')"
                />
                <div class="input-group-append" *ngIf="attachmentform.controls['driving_license_copy'].value">
                  <button
                    class="btn btn-outline-primary"
                    (click)="openFileInNewTab(attachmentform.controls['driving_license_copy'].value)"

                  >
                    View
                  </button>
                </div>
                </div>
            </div>
          </div>

          <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
            <div class="form-group">
              <label >Aadhar/PAN/ID Copy Upload</label>
              <div class="input-group">
                <input
                  class="form-control"
                  type="file"
                  style="padding-right: 10px;"
                  (change)="onChangefile($event,'id_proof_copy')"
                />
                <div class="input-group-append" *ngIf="attachmentform.controls['id_proof_copy'].value">
                  <button
                    class="btn btn-outline-primary"
                    (click)="openFileInNewTab(attachmentform.controls['id_proof_copy'].value)"

                  >
                    View
                  </button>
                </div>
                </div>
            </div>
          </div>

          <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
            <div class="form-group">
              <label >Police Verification Document</label>
              <div class="input-group">
                <input
                  class="form-control"
                  type="file"
                  style="padding-right: 10px;"
                  (change)="onChangefile($event,'police_verification_document')"
                />
                <div class="input-group-append" *ngIf="attachmentform.controls['police_verification_document'].value">
                  <button
                    class="btn btn-outline-primary"
                    (click)="openFileInNewTab(attachmentform.controls['police_verification_document'].value)"

                  >
                    View
                  </button>
                </div>
                </div>
            </div>
          </div>

          <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
            <div class="form-group">
              <label >Medical Fitness Certificate Upload</label>
              <div class="input-group">
                <input
                  class="form-control"
                  type="file"
                  style="padding-right: 10px;"
                  (change)="onChangefile($event,'medical_fitness_certificate')"
                />
                <div class="input-group-append" *ngIf="attachmentform.controls['medical_fitness_certificate'].value">
                  <button
                    class="btn btn-outline-primary"
                    (click)="openFileInNewTab(attachmentform.controls['medical_fitness_certificate'].value)"

                  >
                    View
                  </button>
                </div>
                </div>
            </div>
          </div>

          <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
            <div class="form-group">
              <label >Work Permit (If applicable)</label>
              <div class="input-group">
                <input
                  class="form-control"
                  type="file"
                  style="padding-right: 10px;"
                  (change)="onChangefile($event,'work_permit_document')"
                />
                <div class="input-group-append" *ngIf="attachmentform.controls['work_permit_document'].value">
                  <button
                    class="btn btn-outline-primary"
                    (click)="openFileInNewTab(attachmentform.controls['work_permit_document'].value)"

                  >
                    View
                  </button>
                </div>
                </div>
            </div>
          </div>

          <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12" *ngIf="action_type!='view'">
            <div class="common_button_sub">
              <button (click)="onSubmitForm()">Save & Next</button>
            </div>
          </div>

      </div>
</div>
    </form>
  </div>
</div>
