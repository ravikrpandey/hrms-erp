<div class="edd-del">
  <mat-icon class="editButton" matTooltip="Edit" *ngIf="!showAction && fullRowData == 'PENDING'" (click)="edit($event)" >edit</mat-icon>
  <mat-icon class="viewButton" matTooltip="View" *ngIf="!showAction" (click)="view($event)">visibility</mat-icon>
  <mat-icon class="deleteButton" matTooltip="Delete" *ngIf="!showAction && fullRowData == 'PENDING'" (click)="delete($event)">delete</mat-icon>
