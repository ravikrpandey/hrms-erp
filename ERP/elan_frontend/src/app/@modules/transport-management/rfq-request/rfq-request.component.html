 <div class="heading_top">
  <div class="page-title">
    <h1>Transport Management</h1>
    <p>RFQ Transporter List</p>
  </div>
</div>
<div class="right_data_all">
  <div class="row">
    <div class="col-md-12">
      <div class="tab_menu">
        <div class="tab-item">
          <button class="main-button" color="primary" [class.active]="selectedTab === 'ALL'" (click)="filterGridData('ALL')">All RFQ</button>
          <button class="main-button" color="primary" [class.active]="selectedTab === 'PENDING'" (click)="filterGridData('PENDING')">Pending RFQ</button>
          <button class="main-button" color="primary" [class.active]="selectedTab === 'ACCEPTED'" (click)="filterGridData('ACCEPTED')">Accepted RFQ</button>
          <button class="main-button" color="primary" [class.active]="selectedTab === 'REJECTED'" (click)="filterGridData('REJECTED')">Rejected RFQ</button>
        </div>
      </div>
    </div>
  </div>

<div class="right_data_all">
  <div class="employ_sube py-2">
    <div class="example-header">
      <select id="page-size" (change)="onPageSizeChanged()">
        <option value="10" selected="">10</option>
        <option value="100">100</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
      </select>
    </div>
    <div align="end">
      <input type="text" class="form-control" id="filter-text-box" (input)="onFilterTextBoxChanged()"
        placeholder="Search">
    </div>
  </div>

  <div class="ag_grid">
    <ag-grid-angular class="ag-theme-alpine" style="width: 100%; height: 426px"
      [rowData]="rowData" [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]=15 (gridReady)="onGridReady($event)">
    </ag-grid-angular>
  </div>
</div>
