<app-wrapper [title]="'Inventory Management'" [subTitle]="'Stock List'" [showActions]="true" [actions]="actions">
    <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-12 mt-3">
        <div class="form-group ">
            <mat-form-field appearance="outline">
                <mat-label>Warehouse</mat-label>
                <mat-icon matPrefix>warehouse</mat-icon>
                <mat-select [(ngModel)]="selectedWarehouseId" (selectionChange)="getAllStockList(+$event.value)">
                    <mat-option *ngFor="let w of warehouseList" [value]="+w.id">{{ w.name }}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>
    </div>
    <ag-grid-angular 
        class="ag-theme-alpine" 
        style="width: 100%; height: 426px" 
        [rowData]="rowData"
        [columnDefs]="columnDefs" 
        [pagination]="true" 
        [paginationPageSize]="10" 
        [gridOptions]="gridOptions">
    </ag-grid-angular>
</app-wrapper>
