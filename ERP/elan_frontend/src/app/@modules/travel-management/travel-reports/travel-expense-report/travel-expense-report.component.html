<app-travel-filters 
    [selectedMonth]="selectedMonth" 
    [selectedDepartment]="selectedDepartment"
    [selectedEmployee]="selectedEmployee" 
    [selectedLocation]="selectedLocation" 
    [selectedYear]="selectedYear"
    [selectedCategory]="selectedCategory"
    [filtersToShow]="['year', 'month', 'employee','expenseCategory']"
    (filtersChanged)="onFiltersUpdated($event)"></app-travel-filters>

    
<div class="ag_grid-container">
    <h3 class="text-center">Employee Travel Expense Report</h3>
    <div class="ag_grid">
        <ag-grid-angular class="ag-theme-alpine" id="myGrid" style="width: 100%; height: 480px;" [rowData]="rowData"
            [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="10" (gridReady)="onGridReady($event)"
            [rowClass]="rowClass">
        </ag-grid-angular>
    </div>
</div>
