<div class="heading_top">
    <div class="page-title">
    <h1>Asset Management </h1>
    <p>Asset <i class="fa fa-angle-right" aria-hidden="true" style="color:#5d6c7c">
    </i><span>sell asset approval</span></p>
  </div>
  </div>
  
  <div class="right_data_all">
    <div class="employ_sube py-2">
        <div class="example-header">
            <select id="page-size" (change)="onPageSizeChanged()">
                <option value="10" selected="">10</option>
                <option value="100">100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
        </div>
            <div class="employee_2" align="end">
                <input type="text" class="form-control" id="filter-text-box" (input)="onFilterTextBoxChanged()"
                    placeholder="Search">
        </div>
    </div>

    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start" animationDuration="0ms"
    (selectedTabChange)="onTabChange($event)" [(selectedIndex)]="selectedTabIndex">
    <mat-tab label="All Assets">
      <ng-container *ngIf="selectedTabIndex === 0">
         <div class="ag_grid">
      <ag-grid-angular
        [rowClass]="rowClass"
        class="ag-theme-alpine"
        style="width: 100%; height: 426px"
        [columnDefs]="columnDefs_1"
        [pagination]="true"
        [paginationPageSize]=10
        [rowData]="AllAssets"
        (gridReady)="onGridReady($event)"
      >
      </ag-grid-angular>
    </div>
         </ng-container>
    </mat-tab>

    <mat-tab label="Pending Assets">
      <ng-container *ngIf="selectedTabIndex === 1">
         <div class="ag_grid">
      <ag-grid-angular
        [rowClass]="rowClass"
        class="ag-theme-alpine"
        style="width: 100%; height: 426px"
        [columnDefs]="columnDefs"
        [pagination]="true"
        [paginationPageSize]=10
        [rowData]="pendingAssets"
        (gridReady)="onGridReady($event)"
      >
      </ag-grid-angular>
    </div>

      </ng-container>
    </mat-tab>
    <mat-tab label="Approved  Assets">
      <ng-container *ngIf="selectedTabIndex === 2">
         <div class="ag_grid">
      <ag-grid-angular
        [rowClass]="rowClass"
        class="ag-theme-alpine"
        style="width: 100%; height: 426px"
        [columnDefs]="columnDefs"
        [pagination]="true"
        [paginationPageSize]=10
        [rowData]="approvedAssets"
        (gridReady)="onGridReady($event)"
      >
      </ag-grid-angular>
    </div>
      </ng-container>
    </mat-tab>
    <mat-tab label="Rejected Assets">
      <ng-container *ngIf="selectedTabIndex === 3">
         <div class="ag_grid">
      <ag-grid-angular
        [rowClass]="rowClass"
        class="ag-theme-alpine"
        style="width: 100%; height: 426px"
        [columnDefs]="columnDefs"
        [pagination]="true"
        [paginationPageSize]=10
        [rowData]="rejectedAssets"
        (gridReady)="onGridReady($event)"
      >
      </ag-grid-angular>
    </div>
      </ng-container>
    </mat-tab>
    </mat-tab-group>
  </div>
