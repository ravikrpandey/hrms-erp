<div class="edd-del">
    <mat-icon class="editButton" matTooltip="Edit" *ngIf="assignAction?.Write && singleData.approval_status=='Pending'" matTooltipPosition="above" matTooltipHideDelay="100"
        (click)="openDialog('sell')">edit</mat-icon>
    <mat-icon class="editButton" matTooltip="View" *ngIf="assignAction?.Write && singleData.approval_status!='Pending'" matTooltipPosition="above" matTooltipHideDelay="100"
(click)="viewDialog('sell')">visibility</mat-icon>
</div>
