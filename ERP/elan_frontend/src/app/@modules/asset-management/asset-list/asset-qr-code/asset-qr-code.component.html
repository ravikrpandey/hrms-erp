<h2 mat-dialog-title>QR Code for {{ itemName }}</h2>

<mat-dialog-content>
  <img [src]="qrImageUrl" alt="QR Code" style="max-width: 100%; height: auto;" />
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="download()">Download</button>
  <button mat-button (click)="close()">Close</button>
</mat-dialog-actions>
