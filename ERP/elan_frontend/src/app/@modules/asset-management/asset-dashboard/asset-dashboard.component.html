<!-- Summary KPI Cards -->
<div class="summary-cards" style="display: flex; gap: 1rem; margin-bottom: 2rem;">
    <div class="kpi-card" style="flex: 1; background: #f5f5f5; padding: 1rem; border-radius: 8px; text-align: center;">
      <h4>Total Assets</h4>
      <p style="font-size: 1.5rem;">{{total_assets}}</p>
    </div>
    <div class="kpi-card" style="flex: 1; background: #f5f5f5; padding: 1rem; border-radius: 8px; text-align: center;">
      <h4>Asset Categories</h4>
      <p style="font-size: 1.5rem;">{{asset_categories}}</p>
    </div>
    <div class="kpi-card" style="flex: 1; background: #f5f5f5; padding: 1rem; border-radius: 8px; text-align: center;">
      <h4>Total Value</h4>
      <p style="font-size: 1.5rem;">{{total_value}}</p>
    </div>
  </div>
  
  <!-- Charts Section -->
  <div class="charts-grid" style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem;">
    <!-- Lifecycle Pie Chart -->
    <div class="chart-card" style="background: #fff; padding: 1rem; border-radius: 8px;">
      <h4>Asset Lifecycle Status</h4>
      <canvas baseChart [data]="lifecyclePieData" [type]="'pie'"></canvas>
    </div>
  
    <!-- Value Distribution Doughnut Chart -->
    <div class="chart-card" style="background: #fff; padding: 1rem; border-radius: 8px;">
      <h4>Asset Value Distribution</h4>
      <canvas baseChart [data]="valueDistributionData" [type]="'bar'"></canvas>
    </div>
  
    <!-- Department-wise Bar Chart - Full Width -->
    <div class="chart-card" style="grid-column: 1 / -1; background: #fff; padding: 1rem; border-radius: 8px;">
      <h4>Location-wise Asset Allocation</h4>
      <canvas baseChart [data]="assetsPerLocationData" [type]="'bar'"></canvas>
    </div>
    <div class="chart-card" style="grid-column: 1 / -1; background: #fff; padding: 1rem; border-radius: 8px;">
      <h4>Department-wise Asset Allocation</h4>
      <canvas baseChart [data]="assetsPerDepartmentData" [type]="'bar'"></canvas>
    </div>
  </div>
