<div class="edd-del">
    <!-- <i (click)="edit($event)" class='fas fa-edit'></i> -->
    <mat-icon *ngIf="assignAction?.Read" matTooltip="View" (click)="view($event)">visibility</mat-icon>
    <mat-icon *ngIf="assignAction?.Write" matTooltip="Edit" (click)="edit($event)" >edit</mat-icon>
    <mat-icon *ngIf="assignAction?.Delete" matTooltip="Delete" (click)="delete($event)">delete</mat-icon>
</div>
