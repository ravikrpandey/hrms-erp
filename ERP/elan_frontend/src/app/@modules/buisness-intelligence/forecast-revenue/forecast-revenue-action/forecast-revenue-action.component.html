<div class="edd-del">
    <!-- <i (click)="edit($event)" class='fas fa-edit'></i> -->
    <mat-icon *ngIf="assignAction?.Read"  matTooltip="View" style="padding-right: 40px;margin-top:4px" (click)="view($event)">visibility</mat-icon>
    <mat-icon *ngIf="assignAction?.Write"  matTooltip="Edit" style="padding-right: 40px;margin-top:4px" (click)="edit($event)" >edit</mat-icon>
    <mat-icon *ngIf="assignAction?.Delete" matTooltip="Delete" style="padding-right: 40px;margin-top:4px" (click)="delete($event)">delete</mat-icon>
</div>
