<div class="right_data_all">
  <div class="employ_sube download_file_icon">
    <div class="d-flex justify-content-end align-items-center gap-2 mt-2">
      <!-- Filter Icon -->
      <!-- <button mat-icon-button matTooltip="Filter">
        <mat-icon>filter_list</mat-icon>
      </button> -->

      <!-- Sort Icon -->
      <!-- <button mat-icon-button matTooltip="Sort" (click)="shortRole(sortType)">
        <mat-icon>sort</mat-icon>
      </button> -->

      <!-- Export Excel -->
      <!-- <button
        mat-icon-button
        matTooltip="Export Data"
        (click)="openDialogForDownloadCsv()"
      >
        <mat-icon>file_download</mat-icon>
      </button> -->

      <!-- Print -->
      <!-- <button mat-icon-button matTooltip="Print" (click)="onBtPrint()">
        <mat-icon>print</mat-icon>
      </button> -->
      <div class="form-group">
        <mat-form-field appearance="outline">
          <mat-label>Select Date</mat-label>
          <mat-date-range-input [rangePicker]="picker">
            <input matStartDate placeholder="Start date" [(ngModel)]="start" (click)="picker.open()" readonly/>
            <input matEndDate placeholder="End date" [(ngModel)]="end" (click)="picker.open()" readonly/>
          </mat-date-range-input>
          <mat-datepicker-toggle
            matIconSuffix
            [for]="picker"
          ></mat-datepicker-toggle>
          <mat-date-range-picker #picker></mat-date-range-picker>
        </mat-form-field>
      </div>

      <!-- Export Login History -->
      <button
        mat-icon-button
        matTooltip="Export History Data"
        (click)="onDownloadExcel()"
      >
        <mat-icon>download</mat-icon>
      </button>
    </div>
  </div>

  <div class="employ_sube py-2">
    <div class="example-header">
      <select (change)="onPageSizeChanged()" id="page-size">
        <option value="10" selected="">10</option>
        <option value="100">100</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
      </select>
      <!-- <span class="pag_size">Per Page</span> -->
    </div>
    <div class="employee_2" align="end">
      <input
        type="text"
        class="form-control"
        id="filter-text-box"
        placeholder="Search"
        (input)="onFilterTextBoxChanged()"
      />
    </div>
  </div>

  <div class="ag_grid ag_final_dat tableGroup">
    <ag-grid-angular
      class="ag-theme-alpine"
      id="myGrid"
      style="width: 100%; height: 400px"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [pagination]="true"
      [paginationPageSize]="10"
      [rowData]="rowData"
      (gridReady)="onGridReady($event)"
      (cellClicked)="onCellClicked($event)"
      [rowClass]="rowClass"
    >
    </ag-grid-angular>
  </div>
</div>
