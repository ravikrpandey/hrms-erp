<div class="edd-del">
    <mat-slide-toggle [(ngModel)]="isChecked" (click)="toggle($event,isChecked)"></mat-slide-toggle>
    <mat-icon matTooltip="Edit" (click)="edit($event)" *ngIf="assignAction?.Write">edit</mat-icon>
    <mat-icon matTooltip="View" *ngIf="assignAction?.Read" (click)="view()">visibility</mat-icon>
    <mat-icon matTooltip="Delete" (click)="delete($event)" *ngIf="assignAction?.Delete">delete</mat-icon>
    <mat-icon matTooltip="Login Track Record" (click)="loginTrackRecord()" *ngIf="assignAction?.Read">history</mat-icon>
</div>
