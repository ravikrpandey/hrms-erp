<div class="heading_top">
  <div class="page-title">
    <h1>Employee & Access Management</h1>
    <p>
      RBAC<i
        class="fa fa-angle-right"
        aria-hidden="true"
        style="color: #858586"
      >
      </i
      ><span>Role List</span>
    </p>
  </div>
  <div class="add_button">
    <button
      routerLink="../Rbac-role-create"
      *ngIf="assignAction?.Write"
      type="button"
    >
      Add New Role
    </button>
  </div>
</div>

<div class="right_data_all">
  <div class="employ_sube justify-content-end">
    <div class="employee_2" align="end">
      <input
        type="text"
        class="form-control"
        placeholder="Search"
        id="filter-text-box"
        (input)="onFilterTextBoxChanged()"
      />
    </div>
  </div>
  <div class="ag_grid">
    <ag-grid-angular
      [rowClass]="rowClass"
      class="ag-theme-alpine"
      style="width: 100%; height: 400px"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [pagination]="true"
      [paginationPageSize]="10"
      (gridReady)="onGridReady($event)"
      [rowClass]="rowClass"
      (cellClicked)="onCellClicked($event)"
    >
    </ag-grid-angular>
  </div>
</div>
