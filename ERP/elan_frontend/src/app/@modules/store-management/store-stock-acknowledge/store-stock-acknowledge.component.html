<div class="heading_top">
    <div class="page-title">
      <h1>Stock Management</h1>
      <p>Stock acknowledgment</p>
    </div>
  </div>
  
  <div class="right_data_all">
    <div class="ag_grid">
      <mat-tab-group mat-stretch-tabs animationDuration="0ms" (selectedTabChange)="onTabChange($event)">
        <mat-tab label="All stocks">
          <div *ngIf="selectedTab === 0">
            <app-all-stock></app-all-stock>
          </div>
        </mat-tab>
  
        <mat-tab label="Pending stocks">
          <div *ngIf="selectedTab === 1">
            <app-pending-stock></app-pending-stock>
          </div>
        </mat-tab>
  
        <mat-tab label="Approved stocks">
          <div *ngIf="selectedTab === 2">
            <app-approved-stock></app-approved-stock>
          </div>
        </mat-tab>
  
        <mat-tab label="Rejected stocks">
          <div *ngIf="selectedTab === 3">
            <app-rejected-stock></app-rejected-stock>
          </div>
        </mat-tab>
  
      </mat-tab-group>
    </div>
  </div>
