<div class="page-container">
    <!-- Heading -->
    <div class="heading_top">
      <div class="page-title">
        <h1>Warehouse Management</h1>
        <p>E-Invoice List</p>
      </div>
    </div>
  
  
    <!-- Filters -->
    <div class="row d-flex mb-2 justify-content-between align-items-center">
      <div class="col-auto">
        <select class="form-select" style="width: auto;" (change)="onPageSizeChanged()">
          <option value="10" selected>10</option>
          <option value="100">100</option>
          <option value="500">500</option>
        </select>
      </div>
      <div class="col-md-3">
        <input type="text" class="form-control" placeholder="Search..." (input)="onFilterTextBoxChanged($event)" />
      </div>
    </div>
  
    <!-- AG Grid -->
    <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width: 100%; height: 426px"
    [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]=10 [rowData]="rowData"
    [rowSelection]="gridOptions.rowSelection"
    [gridOptions]="gridOptions" >
</ag-grid-angular>
  </div>
