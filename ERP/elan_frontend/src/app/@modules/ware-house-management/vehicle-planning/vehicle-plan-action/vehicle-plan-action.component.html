<div class="edd-del">
  <mat-icon *ngIf="this.cellValue.status === 'Pending'" matTooltip="Edit vehicle planning" (click)="editSubtype($event)">edit</mat-icon>
  <mat-icon matTooltip="View vehicle planning" (click)="veiwSubtype($event)">visibility</mat-icon>
  <mat-icon matTooltip="Click to approve vehicle planning" *ngIf="this.cellValue.admin_accepted_status == 1 && this.cellValue.status === 'Pending'" (click)="openDialog($event)" >done_all</mat-icon>
</div>
