<h3 mat-dialog-title class="popHead">Vehicle Plan Review & Admin Approval</h3>

<mat-dialog-content class="mat-typography mt-4">
  <div class="">
    <div class="ag_grid" #gridContainer>

      <ag-grid-angular class="ag-theme-alpine" style="width:100%;height:1000px" [rowData]="rowData"
        [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" (cellClicked)="onCellClicked($event)">
      </ag-grid-angular>

      <div class="charge-tooltip" *ngIf="showTooltip" [ngStyle]="{left: tooltipX + 'px',top: tooltipY + 'px'}">

        <table>
          <thead>
            <tr>
              <th>Charge</th>
              <th>Amount</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let item of tooltipData" style="color:green">
              <td>{{item.chargeList?.charge_name}}</td>
              <td>{{item.amount}}</td>
            </tr>
          </tbody>
        </table>

      </div>

    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="common_button_sub mb-3">
  <div class="mt-3 common_button_sub">
    <button class="cancel_button_y" mat-dialog-close (click)="closeModal()">Close</button>
  </div>
</mat-dialog-actions>
