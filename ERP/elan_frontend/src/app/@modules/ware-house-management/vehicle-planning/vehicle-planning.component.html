<div class="heading_top">
  <div class="page-title">
    <h1>Warehouse Management</h1>
    <p>Vehicle Planning List</p>
  </div>
  
  <div class="add_button" >
    <button type="button" (click)='addRedirect()'>Create Vehicle Planning</button>
  </div>
</div>
<div class="right_data_all">
  <div class="row d-flex">
    <div class="employ_sube py-2 " style="display: flex;
    justify-content: space-between;">
      <div class="example-header">
        <select (change)="onPageSizeChanged()" id="page-size">
          <option value="10" selected="">10</option>
          <option value="100">100</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
        </select>
        <!-- <span class="pag_size">Per Page</span> -->
      </div>
      <div class="employee_2 col-md-3" align="end">
        <input type="text" class="form-control" id="filter-text-box" placeholder="Search"
          (input)="onFilterTextBoxChanged()">
      </div>
    </div>
  </div>

  <div class="ag_grid">
    <ag-grid-angular
    [rowClass]="rowClass"
    class="ag-theme-alpine"
    style=" width:100%; height:465px;"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [pagination]="true"
    [paginationPageSize]="10"
    >
    </ag-grid-angular>
  </div>
</div>
