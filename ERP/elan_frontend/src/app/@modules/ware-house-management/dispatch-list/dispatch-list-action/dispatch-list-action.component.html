


<div class="edd-del" >
  <mat-icon  *ngIf="cellValue.is_dispatched===0 && cellValue?.status!=='isFuture' && cellValue?.status!=='proceedToDispatch'"  matTooltip="Edit" (click)="editSubtype($event)">edit</mat-icon>
  <mat-icon *ngIf="this.cellValue?.addSo !== 'true'"  matTooltip="View" (click)="veiwSubtype($event)">visibility</mat-icon>
  <mat-icon  *ngIf="cellValue.is_dispatched===1  && cellValue?.status=='proceedToDispatch' && cellValue?.gate_outward_status=='Approved'" matTooltip="Upload POD" (click)="openDialog()">upload</mat-icon>

  <!-- <label class="custome-label" *ngIf="cellValue.is_dispatched===1  && cellValue?.status=='proceedToDispatch' " >Under Processing</label> -->

  <!-- <mat-icon   matTooltip="View Details" (click)="viewDetails($event)">visibility</mat-icon> -->
 
</div>
