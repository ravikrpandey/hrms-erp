<mat-icon class="close-icon" (click)="onClose()">close</mat-icon>
<h1 class="popHead">Upload POD Document</h1>
<ng-container class="maindiv">
    <div class="right_data_all">
        <ng-container>
            <div class="right_data_all">
                <form [formGroup]="updateSalesOrderDate" (ngSubmit)="updateSoDate()">
                    <div class="row mt-3">
                        <div class="col-md-6">
                            <div class="form-group">
                                <mat-form-field appearance="outline">
                                    <mat-label>SO No.</mat-label>
                                    <input matInput placeholder="SO NO." readonly formControlName="so_no">
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <mat-form-field appearance="outline">
                                    <mat-label>Vehicle Planning Code</mat-label>
                                    <input matInput placeholder="Planning Code" readonly formControlName="planning_code">
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <mat-form-field appearance="outline">
                                    <mat-label>Invoice No.</mat-label>
                                    <input matInput placeholder="Invoice NO." readonly formControlName="invoice_no">
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <mat-form-field appearance="outline">
                                    <mat-label>Delivered On</mat-label>
                                    <input matInput [matDatepicker]="picker" formControlName="delivered_on_date">
                                    <mat-hint>DD/MM/YYYY</mat-hint>
                                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                                    <mat-datepicker #picker></mat-datepicker>
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12 mt-3">
                            <div class="form-group">
                                <mat-form-field appearance="outline">
                                    <mat-label>Remark</mat-label>
                                    <input matInput placeholder="Remark" formControlName="pod_remark">
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12 mt-3">
                            <div class="form-group">
                                <mat-form-field appearance="outline">
                                    <mat-label>POD Status</mat-label>
                                    <input matInput formControlName="dispatch_status" readonly/>
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12 mt-3">
                            <div class="form-group fileWithViewImg">
                              <mat-label>Upload POD<span class="alertspan">*</span></mat-label>
                              <input class="form-control" type="file" style="padding-right: 19%" title="Termination Copy Upload"
                                (change)="uploadDoc($event)" formControlName="file" accept=".png, .jpg, .jpeg, .docx, .pdf, .doc" />
                              <!-- <img *ngIf="file" [src]="baseUrl + '/' + file" alt class="fileViewImage"
                                (click)="viewImg()"> -->
                            </div>
                          </div>
                    </div>
                    <ng-container>

                        <div class="mt-3 common_button_sub">
                            <button>Update </button>
                            <button class="cancel_button_y" type="button" (click)="onClose()">Cancel</button>
                        </div>
                    </ng-container>
                </form>
            </div>


        </ng-container>
    </div>

</ng-container>
