<div class="heading_top">
  <div class="page-title">
    <h1>Warehouse Management</h1>
    <p>
      Dispatch Planning
      <!-- <i class="fa fa-angle-right" aria-hidden="true" style="color:#063178"> -->
      <!-- </i><span>Manage Warehouse</span> -->
    </p>
  </div>
</div>

<div class="right_data_all">
  <div class="ag_grid">
    <mat-tab-group
      mat-stretch-tabs
      animationDuration="0ms"
      [selectedIndex]="selected.value"
      (selectedIndexChange)="onTabClick($event)"
    >
      <mat-tab label="Immediate List"> </mat-tab>
      <mat-tab label="Customization List"> </mat-tab>
      <mat-tab label="Future Date List"> </mat-tab>
      <mat-tab label="Dispatched List"> </mat-tab>
    </mat-tab-group>
    <div class="check" *ngIf="doListOn">
      <ag-grid-angular
        [rowClass]="rowClass"
        class="ag-theme-alpine"
        style="width: 100%; height: 500px"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
      ></ag-grid-angular>
    </div>
    <!-- <div class="check_cust" *ngIf="customizationOn">
      <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="height:426px;" [rowData]="rowDataCustomization"
      [columnDefs]="columnDefsCustomization"></ag-grid-angular>
    </div> -->
  </div>
</div>
