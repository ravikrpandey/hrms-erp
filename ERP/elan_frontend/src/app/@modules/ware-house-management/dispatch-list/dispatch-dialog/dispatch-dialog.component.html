<mat-icon class="close-icon" (click)="onClose()">close</mat-icon>
<h1 class="popHead">Map Serial No.</h1>
<ng-container class="maindiv">
    <div class="right_data_all">
        <ng-container>
            <div class="right_data_all">
                <div class="ag_grid">
                    <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width: 100%; height: 300px;"
                        id="myGrid" [rowData]="rowData" [columnDefs]="columnDefs2" [gridOptions]="gridOptions"
                        (gridReady)="onGridReady($event)" (selectionChanged)="onSelectionChanged($event)">
                    </ag-grid-angular>
                </div>
                <form [formGroup]="frmAssignSerialNo" (ngSubmit)="assigneSerialNo()">
                    <div class="row mt-3">
                        <div class="col-md-3">
                            <div class="form-group">
                                <mat-form-field appearance="outline">
                                    <mat-label>Warehouse</mat-label>
                                    <mat-select (selectionChange)="getRowForDisatch($event)" formControlName="warehouse_name">
                                        <mat-option *ngFor="let warehouse of warehouseList"
                                            [value]="warehouse?.WAREHOUSE_MASTER.id">{{warehouse?.WAREHOUSE_MASTER?.name}}</mat-option>
                                    </mat-select>
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <mat-form-field appearance="outline">
                                    <mat-label>Row</mat-label>
                                    <mat-select (selectionChange)="getShelfForDisatch($event)" formControlName="row_name">
                                        <mat-option *ngFor="let row of rowList"
                                            [value]="row.id">{{row.row_name}}</mat-option>
                                    </mat-select>
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <mat-form-field appearance="outline">
                                    <mat-label>Shelf</mat-label>
                                    <mat-select (selectionChange)="getSectionForDisatch($event)" formControlName="self_name">
                                        <mat-option *ngFor="let shelf of shelfList"
                                            [value]="shelf.id">{{shelf.self_name}}</mat-option>
                                    </mat-select>
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <mat-form-field appearance="outline">
                                    <mat-label>Section</mat-label>
                                    <mat-select formControlName="section_name">
                                        <mat-option *ngFor="let section of sectionList" [value]="section.id"
                                            (click)="selectedSection(section)">{{section.section_name}}</mat-option>
                                    </mat-select>
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <mat-form-field appearance="outline">
                                    <mat-label>Item Name</mat-label>
                                    <input matInput placeholder="Item Name" formControlName="item">
                                </mat-form-field>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <mat-form-field appearance="outline">
                                    <mat-label>Quantity</mat-label>
                                    <input matInput placeholder="Quantity" formControlName="quantity" >
                                </mat-form-field>
                            </div>
                        </div>
                    </div>
                    <ng-container>

                        <div class="mt-3 common_button_sub">
                            <button >Save </button>
                            <button class="cancel_button_y" type="button" (click)="onClose()">Cancel</button>
                        </div>
                    </ng-container>
                </form>
            </div>


        </ng-container>
    </div>

</ng-container>
