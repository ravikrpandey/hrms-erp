<mat-icon class="close-icon" (click)="onNoClick()">close</mat-icon>
<h3 class="popHead">Add Lorry Details</h3>
<mat-card>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="row">
          <div class="col-md-5 mt-3 mb-3">
            <div class="custom-radio-field">
                <label class="custom-radio-label">Generate Lorry No</label>
                <div class="custom-radio-outline">
                  <mat-radio-group aria-label="Select an option" formControlName="generate_lr_no">
                    <mat-radio-button value="AUTO">Auto</mat-radio-button>
                    <mat-radio-button value="MANUAL" style="margin-left: 40px;">Manual</mat-radio-button>
                  </mat-radio-group>
                </div>
            </div>
          </div>
        <div class="col-md-7 mt-3 mb-3" *ngIf="form.get('generate_lr_no')?.value!=='AUTO'">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>LR No</mat-label>
            <input matInput  formControlName="lr_no"/> 
            <mat-error *ngIf="form.get('lr_no')?.hasError('required')">Lorry number is required</mat-error>
          </mat-form-field>
        </div>
        <div class="col-md-12 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Driver Name</mat-label>
            <input matInput formControlName="driver_name" required/>
            <mat-error *ngIf="form.get('driver_name')?.hasError('required')">Driver name is required</mat-error>
          </mat-form-field>
        </div>
        <div class="col-md-6 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Contact Number</mat-label>
            <input matInput formControlName="driver_contact" type="tel" maxlength="12" required/>
            <mat-error *ngIf="form.get('driver_contact')?.hasError('required')">Contact number is required</mat-error>
          </mat-form-field>
        </div>
        <div class="col-md-6 mb-3">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Vehicle Number</mat-label>
            <input matInput formControlName="vehicle_number" required/>
            <mat-error *ngIf="form.get('vehicle_number')?.hasError('required')">Vehicle number is required</mat-error>
          </mat-form-field>
        </div>
        <div class="mt-3 col-md-12 text-end">
          <!-- CASE 1: Data NULL → only Add & Verify -->
          <button class="button-design"
            *ngIf="!hasButtonData"
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="form.invalid"
            (click)="setButtonAction('ADD_VERIFY')"
            title="Add Driver & Vehicle details and verify LR"
          >Add & Verify</button>

          <!-- CASE 2: Data present → Verify -->
          <button class="button-design"
            *ngIf="hasButtonData"
            mat-raised-button
            color="primary"
            type="submit"
            (click)="setButtonAction('VERIFY')"
            title="Verify with existing Driver & Vehicle"
          >Verify</button>

          <!-- CASE 2: Data present → Update & Verify -->
          <button class="button-design"
            *ngIf="hasButtonData"
            mat-raised-button
            color="primary"
            type="submit"
            (click)="setButtonAction('UPDATE_VERIFY')"
            title="Update Driver or Vehicle details, then verify LR"
          >Update & Verify</button>

          <button 
            mat-raised-button 
            color="warn" 
            type="button" 
            (click)="onNoClick()"
          >Close</button>
        </div>
      </div>
    </form>
  </mat-card-content>
</mat-card>
