<!-- View Button with Tooltip -->
<button
  class="btn btn-view"
  matTooltip="View Details"
  matTooltipPosition="above"
  (click)="ViewAction()">
  <mat-icon>visibility</mat-icon>
</button>

<!-- Match Item Serial No. Button -->
<button *ngIf="showButton"
  class="btn btn-view"
  matTooltip="Map Serial No. / Batch No."
  matTooltipPosition="above" (click)="mapSerialBatch()">
  <mat-icon>qr_code_scanner</mat-icon>
</button>

<!-- LR Details Button -->
<button *ngIf="showButton && mapSerialNoStatus"
  class="btn btn-view"
  matTooltip="Proceed to Generate LR"
  matTooltipPosition="above" (click)="openDialog()">
  <mat-icon>arrow_forward</mat-icon>
</button>
