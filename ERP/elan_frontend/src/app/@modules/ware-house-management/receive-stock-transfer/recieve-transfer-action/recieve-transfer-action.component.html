<div class="edd-del" >



    <ng-container *ngIf="assignAction?.Read">
        <mat-icon class="viewButton"  (click)="view($event)" matTooltip="View">visibility</mat-icon>
        <mat-icon  matTooltip="Receive Stock" *ngIf="rowValue?.default_status==='Pending' && rowValue?.transfer_status==='Dispatched'" class="editButton" (click)="edit($event)">edit</mat-icon>
    </ng-container>


</div>
