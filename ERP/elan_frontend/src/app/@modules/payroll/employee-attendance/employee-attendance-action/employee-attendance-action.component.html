<div class="edd-del">
  <mat-icon matTooltip="View" (click)="view()">visibility</mat-icon>
  <a *ngIf="singleData?.pay_slip_status == 'PROCESSED'"
    href="{{baseUrl}}/api/v1/download_SalarySlip?pay_slip_month={{singleData?.pay_slip_month}}&employee_id={{singleData?.employee_id}}"
    download target="_blank">
    <mat-icon matTooltip="Download">download</mat-icon>
  </a>
  <span *ngIf="!singleData?.pay_slip_status">Pending</span>
</div>
