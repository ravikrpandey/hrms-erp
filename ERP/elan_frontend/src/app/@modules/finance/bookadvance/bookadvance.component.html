<div class="heading_top">
    <div class="page-title">
        <h1>Finance and Accounting</h1>
        <p>Finance<i class="fa fa-angle-right" aria-hidden="true" style="color:#5d6c7c">
            </i><span>Advance Booking List</span></p>
    </div>
    <div class="add_button">
        <div class="dropdown">
          <button class="dropbtn">
            <i class="fa fa-ellipsis-v" aria-hidden="true" style="color:#5d6c7c"></i>
          </button>
          <div class="dropdown-content">
            <button type="button" class="btn_add" (click)="openNav()">Book Advance</button>
            <!-- Add more buttons here as needed -->
          </div>
        </div>
      </div>
</div>

<div class="right_data_all">
    <div class="employ_sube py-2">
        <div class="example-header">
            <select id="page-size" (change)="onPageSizeChanged()">
                <option value="10" selected="">10</option>
                <option value="100">100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
        </div>
        <div class="employee_2" align="end">
            <input type="text" class="form-control" id="filter-text-box" (input)="onFilterTextBoxChanged()"
                placeholder="Search">
        </div>
    </div>
    <div class="ag_grid">
        <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width:100%; height:426px;"
            [rowData]="rowData" [columnDefs]="columnDefs" [pagination]=true [paginationPageSize]=10
            (gridReady)="onGridReady($event)" >
        </ag-grid-angular>
    </div>

    <div id="mySidenav" class="sidenav mt-3" [style.width.px]="navWidth">
        <div align="end">
            <a href="javascript:void(0)" class="closebtn" (click)="closeNav()">&times;</a>
        </div>

        <div class="right_data_all">
            <div class="employ_sube py-2">
                <div class="example-header">
                    <select (change)="onPageSizeChanged()" id="page-size">
                        <option value="10" selected="">10</option>
                        <option value="100">100</option>
                        <option value="500">500</option>
                        <option value="1000">1000</option>
                    </select>
                    <!-- <span class="pag_size">Per Page</span> -->
                </div>
                <div class="employee_2" align="end">

                    <input type="text" class="form-control" id="filter-text-box" placeholder="Search"
                        (input)="onFilterTextBoxChanged()">
                </div>
            </div>
            <div class="ag_grid">
                <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width:100%; height:426px;"
                    [rowData]="bookgrid" [columnDefs]="bookadvance" [pagination]=true [paginationPageSize]=10
                    (gridReady)="onGridReady($event)"  (cellClicked)="statusCellClicked($event)">
                </ag-grid-angular>
            </div>
        </div>
    </div>

</div>
