  <div class="right_data_all mt-3">
    <form [formGroup]="bankClearanceForm" class="mt-2">
      <div class="row">
        <div class="col-sm-4 col-md-4 col-lg-4 col-12 mb-3">
            <mat-form-field appearance="outline">
              <mat-label>Account</mat-label>
              <mat-select formControlName="chart_of_account" (selectionChange)="onAccountChange($event)">
                <mat-option [value]="data.id" *ngFor="let data of bankCoaList">
                  {{data.account_name}}
                </mat-option>
              </mat-select>
              <button mat-icon-button *ngIf="bankClearanceForm.get('chart_of_account')?.value" matSuffix (click)="clearDate('chart_of_account')">
                <mat-icon>close</mat-icon>
              </button>
            </mat-form-field>
        </div>
        <div class="col-sm-4 col-md-4 col-lg-4 col-12 mb-3">
          <mat-form-field appearance="outline">
            <mat-label>Date</mat-label>
            <input matInput [matDatepicker]="dp" (click)="dp.open()" formControlName="from_date" [max]="maxDate"
              (dateChange)="fromDate($event)"/>
            <mat-datepicker-toggle matSuffix [for]="dp"></mat-datepicker-toggle>
            <mat-datepicker #dp></mat-datepicker>
            <mat-error *ngIf="bankClearanceForm.controls['from_date'].hasError('required')">
              This field is required!
            </mat-error>
            <button mat-icon-button *ngIf="bankClearanceForm.get('from_date')?.value" matSuffix (click)="clearDate('from_date')">
              <mat-icon>close</mat-icon>
            </button>
          </mat-form-field>
        </div>

<div class="ag_grid">
  <ag-grid-angular
    [rowClass]="rowClass"
    class="ag-theme-alpine"
    style="width: 100%; height: 426px;"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [pagination]="true"
    [paginationPageSize]="10"
    (gridReady)="onGridReady($event)"
    (cellValueChanged)="onCellValueChanged($event)">
  </ag-grid-angular>
</div>
