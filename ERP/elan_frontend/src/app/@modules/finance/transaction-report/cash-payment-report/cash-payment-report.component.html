<div class="heading_top py-3">
    <div class="page-title">
      <h1>Finance & Accounting</h1>
      <p><i class="fa fa-angle-right" aria-hidden="true" style="color:#063178">
        </i><span>Transaction Report</span> / <span>Cash Payment Report</span></p>
    </div>
    <div class="add_button" *ngIf="currencyCode">
      <span style="font-size: 14px; color: #666; margin-right: 15px;">
        Currency: {{ currencyCode }} {{ currencySymbol }} 
        <span *ngIf="currencyRate && currencyRate !== 1">(Rate: 1 {{ currencyCode }} = {{ currencyRate }})</span>
      </span>
    </div>
  </div>
  
  <div class="right_data_all">
    <div class="employ_sube py-2">
      <div class="example-header">
        <select id="page-size" (change)="onPageSizeChanged()">
          <option value="10" selected="">10</option>
          <option value="100">100</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
        </select>
      </div>
      <div class="employee_2" align="end">
        <input type="text" class="form-control" id="filter-text-box" (input)="onFilterTextBoxChanged()"
          placeholder="Search">
      </div>
    </div>
  
    <div class="ag_grid">
      <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width: 100%; height: 426px"
        [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="9" [rowData]="rowData"
        (gridReady)="onGridReady($event)" [gridOptions]="gridOptions">
      </ag-grid-angular>
    </div>
  
    <div class="d-flex justify-content-between mb-3">
      <div class="mt-2 px-4">
        <strong>Total</strong>
      </div>
      <div class="d-flex mt-2">
        <div class="total_amt"><strong>{{ currencySymbol }} {{ totalDebit | number: '1.2-2' }}</strong></div>
        <div class="px-5"><strong>{{ currencySymbol }} {{ totalCredit | number: '1.2-2' }}</strong></div>
      </div>
    </div>
  </div>
