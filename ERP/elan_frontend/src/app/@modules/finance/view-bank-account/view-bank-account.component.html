
<section class="section">
    <div class="row">
        <div class="employee_top my-1">
            Master
            <span class="employee_2"><i class="fa fa-angle-right" aria-hidden="true" style="color: #063178"></i>
                View Fiscal Year</span>
        </div>
    </div>
    <mat-card>
        <div class="form_head">
            <h3>Fiscal Year</h3>
            <button class="backBtn" (click)="navigateToBankAccount()"><i class="fa fa-arrow-circle-left"></i> Back</button>
        </div>
        <div class="form_basic">
            <form class="form_set" [formGroup]="form">
                <div class="row mt-2">

                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group">
                            <mat-label>Fiscal Year</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Fiscal Year</mat-label>
                                <input matInput type="text" formControlName="fiscal_year" readonly />
                              
                            </mat-form-field>
                        </div>
                    </div>

                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group">
                            <mat-label>Year Start Date</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Year Start Date</mat-label>
                                <input matInput type="text" formControlName="year_start_date" readonly />
                              
                            </mat-form-field>
                        </div>
                    </div>

                    
              

                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group">
                            <mat-label>Year End Date</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Year End Date</mat-label>
                                <input matInput type="text" formControlName="year_end_date" readonly />
                              
                            </mat-form-field>
                        </div>
                    </div>


                      
                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group">
                            <mat-label>Status</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Status</mat-label>
                                <input matInput type="text" formControlName="status" readonly />
                              
                            </mat-form-field>
                        </div>
                    </div>
                  

                </div>
            </form>
        </div>
    </mat-card>
</section>
