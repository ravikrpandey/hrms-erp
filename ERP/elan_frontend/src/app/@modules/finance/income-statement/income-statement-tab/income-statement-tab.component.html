<div class="heading_top">
    <div class="page-title">
    <h1>Finance And Accounting </h1>
    <p>Income Statement <i class="fa fa-angle-right" aria-hidden="true" style="color:#5d6c7c">
    </i><span>Income Statement List</span></p>
  </div>
  <div class="add_button" >
    <div *ngIf="isShortcutVisible()" class="shortcut-container add-holiday-shortcut">
      Alt + A → Generate Statement
    </div>
    <button type="button" class="btn_add" (click)="redirect()">Generate Income Statement </button>
  </div>
</div>

<div fxflex="100%" >
    <div class="row">
      <div class="col-md-12 col-lg-12 col-sm-12">
      <div class="tab_menu">
        <div class="tab-item">
          <button class="main-button" color="primary" [routerLink]="['list']" [queryParams]="{ page: 'list' }"  [skipLocationChange]="true" routerLinkActive="active_button" >Income Statement</button>
          <button class="main-button" color="primary" [routerLink]="['pending-for-approval']"  [queryParams]="{ page: 'pending-for-approval' }" [skipLocationChange]="true" routerLinkActive="active_button">Pending for Approval</button>
          <button class="main-button" color="primary" [routerLink]="['approved-by-me']"  [queryParams]="{ page: 'approved-by-me' }" [skipLocationChange]="true" routerLinkActive="active_button" >Approved By Me</button>
          <button class="main-button" color="primary" [routerLink]="['rejected']"  [queryParams]="{ page: 'rejected' }" [skipLocationChange]="true" routerLinkActive="active_button" >Rejected</button>
        </div>
      </div>
    </div>
    </div>
</div>
<router-outlet></router-outlet>
