<section class="right_data_all">
    <div class="form_basic">
        <!-- shiftMasterForm -->
        <form class="form_set" [formGroup]="operatingExpenseForm">
            <div class="row mt-2">
                <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-12 p-0">
                    <mat-form-field appearance="outline" class="mt-1">
                        <mat-label>Total Expense</mat-label>
                        <input matInput type="number" formControlName="total" readonly/>
                    </mat-form-field>
                </div>
                <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-6 p-0">
                </div>
                <div class="col-xxl-2 col-lg-2 col-md-2 col-sm-2 col-2 p-0">
                </div>
                <div class="col-xxl-1 col-lg-1 col-md-1 col-sm-1 col-1 p-0">
                    <button (click)="close()" mat-raised-button
                        color="primary">
                        Close
                    </button>
                </div>
            </div>
        </form>
    </div>
    <table class="border">
        <thead>
            <tr class="border">
                <th class="border p-3 text-center">Category</th>
                <th class="border p-3 text-center">January</th>
                <th class="border p-3 text-center">Feburary</th>
                <th class="border p-3 text-center">March</th>
                <th class="border p-3 text-center">April</th>
                <th class="border p-3 text-center">May</th>
                <th class="border p-3 text-center">June</th>
                <th class="border p-3 text-center">July</th>
                <th class="border p-3 text-center">August</th>
                <th class="border p-3 text-center">September</th>
                <th class="border p-3 text-center">October</th>
                <th class="border p-3 text-center">November</th>
                <th class="border p-3 text-center">December</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let row of array;">
                <td [ngClass]="{'border p-3 text-center heading': i === 0}" style="text-align: center" *ngFor="let field of row; let i = index">
                    {{field}}
                </td>
            </tr>
        </tbody>
    </table>
</section>
