<section class="right_data_all">
    <div class="form_basic">
        <!-- shiftMasterForm -->
        <form class="form_set" [formGroup]="variableCostForm">
            <div class="row mt-2">
                <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-12 p-0">
                    <mat-form-field appearance="outline" class="mt-1">
                        <mat-label>Total Variable Cost</mat-label>
                        <input matInput type="text" formControlName="total" readonly/>
                    </mat-form-field>
                </div>
                <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-6 p-0">
                </div>
                <div class="col-xxl-2 col-lg-2 col-md-2 col-sm-2 col-2 p-0">
                </div>
                <div class="col-xxl-1 col-lg-1 col-md-1 col-sm-1 col-1 p-0">
                    <button (click)="close()" mat-raised-button
                        color="primary">
                        Close
                    </button>
                </div>
            </div>
            <div class="row mt-2">
                <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-3">
                    <div class="form-group">
                        <mat-form-field appearance="outline" class="mt-1">
                            <mat-label>Institutional Support </mat-label>
                            <input matInput type="text"  readonly formControlName="institutional_support_fee"/>
                            <mat-error *ngIf="variableCostForm.get('institutional_support_fee')?.hasError('required')">
                                This field is required!
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>
                <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-3">
                    <div class="form-group">
                        <mat-form-field appearance="outline" class="mt-1">
                            <mat-label>Concession Fee</mat-label>
                            <input matInput type="text"  readonly formControlName="concession_fee"/>
                            <mat-error *ngIf="variableCostForm.get('concession_fee')?.hasError('required')">
                                This field is required!
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>
                <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-3">
                    <div class="form-group">
                        <mat-form-field appearance="outline" class="mt-1">
                            <mat-label>Collection Fee</mat-label>
                            <input matInput type="text"  readonly formControlName="collection_fee"/>
                            <mat-error *ngIf="variableCostForm.get('collection_fee')?.hasError('required')">
                                This field is required!
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>
                <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-3">
                    <div class="form-group">
                        <mat-form-field appearance="outline" class="mt-1">
                            <mat-label>Consultation Fee</mat-label>
                            <input matInput type="text"  readonly formControlName="consultation_fee"/>
                            <mat-error *ngIf="variableCostForm.get('consultation_fee')?.hasError('required')">
                                This field is required!
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <table class="border">
        <tbody>
            <tr *ngFor="let row of array;let i = index;">
                <td [ngClass]="{'border p-3 text-center heading': i == 0 || j === 2 || j == 0 }" style="text-align: center" *ngFor="let field of row; let j = index">
                    {{field}}
                </td>
            </tr>
        </tbody>
    </table>
</section>
