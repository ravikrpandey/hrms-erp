            </div>
            <hr>
            <form class="form_set" [formGroup]="form">

                    <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-12">
                        <div class="form-group">
                            <mat-label>Amount</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Amount</mat-label>
                                <input matInput type="number" formControlName="amount" />
                                <mat-error *ngIf="form.get('amount')?.hasError('required')">
                                    This field is required!
                                </mat-error>
                                <mat-error *ngIf="form.get('amount')?.hasError('leadingSpaces')">
                                    *No leading spaces!
                                </mat-error>
                            </mat-form-field>
                        </div>
                    </div>

<div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-12 ">
                        <div class="form-group">
                            <mat-label>Invoice Number</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Invoice Number</mat-label>
                                <input matInput type="text" formControlName="invoice_number" readonly/>
                               
                            </mat-form-field>
                        </div>
                    </div>

                     
                    <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12 ">
                        <div class="form-group">
                            <mat-label>Remarks</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Remarks</mat-label>
                                <input matInput type="text" formControlName="remarks" />
                                <mat-error *ngIf="form.get('remarks')?.hasError('required')">
                                    This field is required!
                                </mat-error>
                                <mat-error *ngIf="form.get('remarks')?.hasError('leadingSpaces')">
                                    *No leading spaces!
                                </mat-error>
                            </mat-form-field>
                        </div>
                    </div>
                </div>
                <div class="d-flex justify-content-end">
                    <button mat-raised-button color="primary" (click)="onSubmit(this.form.value)" style="padding: 4px;">
                        {{this.subtypeId?'Update':'Submit'}}
                    </button>
                    <button mat-raised-button color="warn" class="mx-3" (click)="goBack()">Close</button>
                </div>
            </form>
