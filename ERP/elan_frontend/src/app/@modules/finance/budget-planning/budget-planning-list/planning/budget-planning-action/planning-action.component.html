<!-- planning tab action buttons -->
<div *ngIf="page=='planning'" class="edd-del">
    <mat-icon  (click)="view($event)">visibility</mat-icon>
    <mat-icon *ngIf="status=='DRAFT'" (click)="edit($event)">edit</mat-icon>
    <!-- <mat-icon  (click)="delete($event)">delete</mat-icon> -->
</div>

<!-- pending for approval tab action buttons -->
<div *ngIf="page=='pending-for-approval'" class="edd-del">
    <div class="mapCCButton" (click)="mapCC($event)">Map CC </div>
</div>

<!-- approved by me action buttons -->
<div *ngIf="page=='approved-by-me'" class="edd-del">
    <mat-icon  (click)="viewApproved($event)">visibility</mat-icon>
</div>

<!-- draft action buttons -->
<div *ngIf="page=='draft'" class="edd-del">
    <mat-icon  (click)="edit2($event)">edit</mat-icon>
    <mat-icon [matTooltip]="remark">announcement</mat-icon>
</div>
