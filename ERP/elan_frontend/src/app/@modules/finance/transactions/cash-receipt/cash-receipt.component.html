<div class="heading_top py-3">
    <div class="page-title">
    <h1>Finance & Accounting </h1>
    <p><i class="fa fa-angle-right" aria-hidden="true" style="color:#063178">
    </i><span>Transactions</span> / <span>Cash-Receipt</span></p>
  </div>
  </div>
 <div class="d-flex justify-content-end mt-2 add_button me-3">
    <button type="button"  (click)="navigateToForm()" > Add New</button>
 </div>
  <div class="right_data_all">
    <div class="employ_sube py-2">
        <div class="example-header">
            <select id="page-size" (change)="onPageSizeChanged()">
                <option value="10" selected="">10</option>
                <option value="100">100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
        </div>
            <div class="employee_2" align="end">
                <input type="text" class="form-control" id="filter-text-box" (input)="onFilterTextBoxChanged()"
                    placeholder="Search">
        </div>
    </div>


    <div class="ag_grid">
        <ag-grid-angular 
  [rowClass]="rowClass" 
  class="ag-theme-alpine" 
  style="width: 100%; height: 500px"
  [columnDefs]="columnDefs" 
  [pagination]="true" 
  [paginationPageSize]="10" 
  [rowData]="rowData"
  (gridReady)="onGridReady($event)" 
  [gridOptions]="gridOptions">
</ag-grid-angular>
    </div>
      
</div>
