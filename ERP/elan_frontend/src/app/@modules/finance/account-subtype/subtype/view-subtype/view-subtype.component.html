<section class="section">
    <div class="row">
        <div class="employee_top my-1">
            Account Subtype
            <span class="employee_2"><i class="fa fa-angle-right" aria-hidden="true" style="color: #5d6c7c"></i>
                View Subtype</span>
        </div>
    </div>
    <mat-card>
        <div class="form_head">
            <h3>Subtype</h3>
            <button class="backBtn" routerLink="../"><i class="fa fa-arrow-circle-left"></i> Back</button>
        </div>
        <div class="form_basic">
            <form class="form_set" [formGroup]="form">
                <div class="row mt-2">
                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group">
                            <mat-label>Account Type</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Select A/C Type</mat-label>
                                <input matInput type="text" formControlName="account_type_id" readonly/>
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group">
                            <mat-label>Name Of A/C Subtype</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Name Of A/C Subtype</mat-label>
                                <input matInput type="text" formControlName="account_subtype_name" readonly/>
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group">
                            <mat-label>Subtype Code</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Subtype Code</mat-label>
                                <input matInput type="text" formControlName="subtype_code" readonly />
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="col-xxl-8 col-lg-8 col-md-8 col-sm-8 col-12">
                        <div class="form-group">
                            <mat-label>Subtype Description</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Subtype Description</mat-label>
                                <input matInput type="text" formControlName="subtype_description" readonly/>
                            </mat-form-field>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </mat-card>
</section>
