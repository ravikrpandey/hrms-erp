
<div class="heading_top">
    <div class="page-title">
    <h1>Finance & Accounting </h1>
    <p>Account Subtype<i class="fa fa-angle-right" aria-hidden="true" style="color:#5d6c7c">
    </i><span>View Chart Account</span></p>
  </div>
  <div class="add_button">
    <button class="backBtn" routerLink="../"><i class="fa fa-arrow-left"></i> Back</button>
  </div>
  </div>

<section class="right_data_all mt-3">
    <mat-card>
        <div class="form_head">
            <h3>Chart</h3>
        </div>
        <div class="form_basic">
            <form class="form_set" [formGroup]="form">
                <div class="row mt-2">
                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group">
                            <mat-label>Account Type</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Select A/C Type</mat-label>
                                <input matInput type="text" formControlName="account_type_id" readonly/>
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group">
                            <mat-label>Account Subtype</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Select A/C Subtype</mat-label>
                                <input matInput type="text" formControlName="account_subtype_id" readonly/>
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group">
                            <mat-label>Account Name</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Account Name</mat-label>
                                <input matInput type="text" formControlName="account_name" readonly/>
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group">
                            <mat-label>Account Code</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Account Code</mat-label>
                                <input matInput type="text" formControlName="account_code" readonly/>
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="col-xxl-8 col-lg-8 col-md-8 col-sm-8 col-12">
                        <div class="form-group">
                            <mat-label>Description</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Description</mat-label>
                                <input matInput type="text" formControlName="account_description" readonly/>
                            </mat-form-field>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </mat-card>
</section>
