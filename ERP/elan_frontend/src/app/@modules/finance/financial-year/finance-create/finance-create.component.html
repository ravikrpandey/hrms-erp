<!-- currect code  -->
<ng-container *ngIf="action!=='view'">
    <mat-dialog-content class="mat-typography">
        <div class="cotain">
            <form [formGroup]="FinancialYear">
                <div class="form-group mt-3">
                    <mat-form-field appearance="outline">
                        <mat-label>Financial Year </mat-label>
                        <select matNativeControl formControlName="financial_year" placeholder="Enter Financial Year">
                            <option *ngFor="let data of financeYear" [value]="data">{{data}}</option>
                        </select>
                        <mat-error *ngIf="FinancialYear.controls['financial_year'].hasError('required')">
                            *Required!
                        </mat-error>
                        <mat-error *ngIf="FinancialYear.controls['financial_year'].hasError('leadingSpaces')">
                            *No leading spaces!
                        </mat-error>
                    </mat-form-field>
                </div>
            </form>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button  align="end"  *ngIf="!action" mat-raised-button color="primary" (click)="ngSubmitFinancialYear()" class="mx-2">
            Submit
        </button>
        <button *ngIf="action" mat-raised-button color="primary" (click)="onUpdateFinanceYear()" class="mx-2">
            Update
        </button>
        <button mat-button mat-dialog-close mat-raised-button color="warn" style="float: right">
            Close
        </button>
    </mat-dialog-actions>

</ng-container>
