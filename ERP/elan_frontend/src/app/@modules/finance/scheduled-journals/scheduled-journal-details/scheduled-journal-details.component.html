
<div class="heading_top">
  <div class="page-title">
      <h1>Finance & Accounting</h1>
      <p>Journal Book<i class="fa fa-angle-right" aria-hidden="true" style="color:#363636">
      </i><span> Scheduled Journals </span></p>
  </div>
  <div class="add_button">
    <button class="backBtn" routerLink="../"><i class="fa fa-arrow-left"></i> Back</button>
  </div>
</div>

<div class="right_data_all">
<div class="employ_sube py-2">
  
</div>

  <div class="ag_grid">
    <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width:100%; height:312px;"
      [rowData]="rowData" [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="6"
      (gridReady)="onGridReady($event)">
    </ag-grid-angular>
  </div>
  <hr>
  <form class="form_set" [formGroup]="scheduleForm">
      <div class="row mt-3">
          <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-12">
              <div class="form-group">
                  <mat-form-field appearance="outline">
                    <mat-label>Reference Document Type </mat-label>
                    <input matInput type="text" formControlName="document_type" readonly>
                  </mat-form-field>
              </div>
          </div>
          <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-12">
              <div class="form-group">
                  <mat-form-field appearance="outline">
                    <mat-label>Start Date </mat-label>
                    <input matInput type="text" formControlName="start_date" readonly>
                  </mat-form-field>
              </div>
          </div>
          <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-12">
              <div class="form-group">
                  <mat-form-field appearance="outline">
                    <mat-label>Reference Document </mat-label>
                    <input matInput type="text" formControlName="reference_document" readonly>
                  </mat-form-field>
              </div>
          </div>
          <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-12">
              <div class="form-group">
                  <mat-form-field appearance="outline">
                    <mat-label>End Date  </mat-label>
                    <input matInput type="text" formControlName="end_date" readonly>
                  </mat-form-field>
              </div>
          </div>
          <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-12">
              <div class="form-group">
                  <mat-form-field appearance="outline">
                    <mat-label>Frequency </mat-label>
                    <input matInput type="text" formControlName="frequency" readonly>
                  </mat-form-field>
              </div>
          </div>
          <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-12">
              <div class="form-group">
                  <mat-form-field appearance="outline">
                    <mat-label>Next Schedule Date </mat-label>
                    <input matInput type="text" formControlName="next_schedule_date" readonly>
                  </mat-form-field>
              </div>
          </div>
      </div>
      <div class=" common_button_sub">
          <div class="mt-3" align="end">
              <button class="cancel_button_y" (click)="deleteJournal()">
                  Delete
              </button>
            <!-- <button class="cancel_button_y" routerLink="/master/finance/scheduled-journals">
              Cancel
            </button> -->
          </div>
      </div>
  </form>
</div>
