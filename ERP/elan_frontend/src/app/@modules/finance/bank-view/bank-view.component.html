<div class="heading_top">
    <div class="page-title">
    <h1>Finance & Accounting </h1>
    <p> Bank Accounting<i class="fa fa-angle-right" aria-hidden="true" style="color:#363636">
    </i><span>View Bank</span></p>
  </div>
  <div class="add_button">
    <button class="backBtn" (click)="navigateToBank()"><i class="fa fa-arrow-left"></i> Back</button>
  </div>
  </div>

<section class="right_data_all mt-3">
    <mat-card>
        <div class="form_head">
            <h3>Bank</h3>
        </div>
        <div class="form_basic mb-0">
            <form class="form_set" [formGroup]="form">
                <div class="row mt-2">

                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group mb-3">
                            <mat-label>Bank</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Bank</mat-label>
                                <input matInput type="text" formControlName="bank_name" readonly />
                              
                            </mat-form-field>
                        </div>
                    </div>

                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group mb-3">
                            <mat-label>Swift Number</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Swift Number</mat-label>
                                <input matInput type="text" formControlName="swift_number" readonly />
                              
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group mb-3">
                            <mat-label>IFSC Code</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>IFSC Code</mat-label>
                                <input matInput type="text" formControlName="ifsc_code" readonly />
                              
                            </mat-form-field>
                        </div>
                    </div>

                    
              

                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group mb-3">
                            <mat-label>Branch</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Branch</mat-label>
                                <input matInput type="text" formControlName="branch" readonly />
                              
                            </mat-form-field>
                        </div>
                    </div>

                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group mb-3">
                            <mat-label>State</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>State</mat-label>
                                <input matInput type="text" formControlName="state" readonly />
                              
                            </mat-form-field>
                        </div>
                    </div>

                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group mb-3">
                            <mat-label>Country</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Country</mat-label>
                                <input matInput type="text" formControlName="country" readonly />
                              
                            </mat-form-field>
                        </div>
                    </div>


                      
                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group mb-3">
                            <mat-label>Status</mat-label>
                            <mat-form-field appearance="outline" class="mt-1">
                                <mat-label>Status</mat-label>
                                <input matInput type="text" formControlName="status" readonly />
                              
                            </mat-form-field>
                        </div>
                    </div>
                  

                </div>
            </form>
        </div>
    </mat-card>
</section>
