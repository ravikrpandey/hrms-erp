<div class="heading_top">
  <div class="page-title">
    <h1>Finance & Accounting</h1>
    <p>Journal <i class="fa fa-angle-right" aria-hidden="true" style="color:#363636">
      </i><span> Journal List </span></p>
  </div>
  <div class="add_button">
    <!-- <div *ngIf="isShortcutVisible()" class="shortcut-container add-holiday-shortcut">
      Alt + A → Add Journal Entry
    </div> -->
    <button type="button" routerLink="employee-create" [routerLink]="'/master/finance/journal/journal-ledger/journal-entry'">Add
      Journal Entry</button>
  </div>
</div>

<div fxflex="100% mb-3">
  <div class="row">
    <div class="tab_menu">
      <div class="tab-item">
        <button class="main-button navigate" id="button1" (click)="getJournalEntry()"
          [ngClass]="publish ?'active_button':''">Publish</button>
        <button class="main-button navigate" id="button2" (click)="getQuickEntry()"
          [ngClass]="!publish ?'active_button':''">Draft</button>
      </div>
    </div>
  </div>
</div>

<div class="right_data_all">
  <div class="employ_sube py-2">
    <div class="example-header">
      <select (change)="onPageSizeChanged()" id="page-size">
        <option value="10" selected="">10</option>
        <option value="100">100</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
      </select>
      <!-- <span class="pag_size">Per Page</span> -->
    </div>
    <div class="employee_2" align="end">
      <input type="text" class="form-control" id="filter-text-box" placeholder="Search"
        (input)="onFilterTextBoxChanged()">

    </div>
  </div>

  <div class="ag_grid">
    <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style=" width:100%; height:426px;"
      [rowData]="rowData" [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="9"
      (gridReady)="onGridReady($event)" (cellClicked)='onCellClicked($event)'>
    </ag-grid-angular>
  </div>
  <div>
  </div>
