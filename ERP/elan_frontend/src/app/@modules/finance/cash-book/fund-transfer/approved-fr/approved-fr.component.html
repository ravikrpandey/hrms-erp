
<div class="right_data_all">
    <div class="employ_sube py-2">
      <div class="example-header">
        <select (change)="onPageSizeChanged()" id="page-size">
          <option value="10" selected="">10</option>
          <option value="100">100</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
        </select>
    </div>
    <div class="form-group">
      <mat-form-field appearance="outline">
        <mat-label>Department</mat-label>
        <mat-select [(ngModel)]="quickFilter" (ngModelChange)="onFilterByDepartment($event)">
            <mat-option>select</mat-option>
            <mat-option *ngFor="let dep of depData" [value]="dep.department_name" >{{dep?.department_name}}</mat-option>
          </mat-select>
      </mat-form-field>
    </div>
      <div class="employee_2" align="end">
  
        <input type="text" class="form-control" id="filter-text-box" placeholder="Search"
          (input)="onFilterTextBoxChanged()">
    </div>
  </div>
      <div class="ag_grid">
        <ag-grid-angular
          class="ag-theme-alpine"
          id="myGrid"
          style="width: 100%; height: 400px"
          [rowData]="rowData"
          [columnDefs]="columnDefs"
          [pagination]="true"
          [paginationPageSize]="10"
          [rowData]="filteredData"
          (gridReady)="onGridReady($event)"
          (cellClicked)="statusCellClicked($event)"
          [rowClass]="rowClass"
        >
        </ag-grid-angular>
      </div>
    </div>
