<h3 class="popHead">{{bankAccount}} <span mat-dialog-close class="cencelBtn">×</span></h3>

<mat-dialog-content class="mat-typography">
    <div style="margin-top: 15px;">
      <div class="main_model">
        <p class="import-text">Upload your Related Bank Statement to proceed fuurther.</p>
        <form [formGroup]="form" class="mt-2">
          <div class="row">
            <div class="col-sm-12 col-md-6 col-lg-6 col-12">
              <div class="d-flex">
                <div class="text-center" class="import-button" style="width: 100%; float: left; position: relative;">
                  <input 
                      type="file" 
                      (change)="acceptFile($event)" 
                      formControlName="file" 
                      accept=".xlsx, .csv,.xls"
                      autocomplete="off"
                      tabindex="-1"
                      [ngClass]="{'markRed': (!filePath && selectedFileExc !== null || form.get('file')?.hasError('notAllowed'))}">
                    <span *ngIf="form.get('file')?.hasError('notAllowed')" class="err-msg">Please select a valid file (XLSX or CSV).</span>
                </div>
            </div>
          </div>
          </div>
        </form>
      </div>
    </div>

</mat-dialog-content>
<mat-dialog-actions align="end" class="assignBtn common_button_sub" >
    <button [disabled]="showLoader" (click)="Upload()" > <mat-spinner *ngIf="showLoader" style="width: 50px; height:21px;"></mat-spinner><span *ngIf="!showLoader">Upload</span></button>
    <button [disabled]="showLoader" (click)="downloadSample()" > <mat-spinner *ngIf="showLoader" style="width: 50px; height:21px;"></mat-spinner><span *ngIf="!showLoader">Sample Download for Excel Upload</span></button>
    <button  mat-dialog-close class="cancel_button_y" >Close</button>
</mat-dialog-actions>
