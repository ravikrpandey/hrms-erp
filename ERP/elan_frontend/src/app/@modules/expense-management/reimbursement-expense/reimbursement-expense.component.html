<app-wrapper [title]="'Expense Management'" [subTitle]="'Reimbursement Expense'"
    [subheading]="'Reimbursement Expense List'">
    <div class="">
        <div class="right_data_all">
            <mat-tab-group #tabGroup (selectedTabChange)="tabChange($event)">
                <mat-tab *ngFor="let tab of tabs" [label]="tab.label">
                    <ng-template matTabContent>
                        <div class="mt-4">
                            <div class="d-flex justify-content-between flex-wrap w-100 py-2 mt-4">
                                <div class="example-header">
                                    <select id="page-size" (change)="onPageSizeChanged()">
                                        <option value="10" selected="">10</option>
                                        <option value="100">100</option>
                                        <option value="500">500</option>
                                        <option value="1000">1000</option>
                                    </select>
                                </div>
                                <div class="employee_2" align="end">
                                    <input type="text" class="form-control" id="filter-text-box"
                                        (input)="onFilterTextBoxChanged()" placeholder="Search">
                                </div>
                                <div class="downloadAddButton" *ngIf="status=='0'">
                                    <div class="add_button">
                                        <button routerLink="/master/expense-management/reimbursement-expense/create"
                                            *ngIf="status === '0'"><i class="bi bi-person-add"></i> Add Reimbursement
                                            Expense
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="ag_grid ag_final_dat tableGroup">
                                <ag-grid-angular class="ag-theme-alpine" style="width: 100%; height: 400px;"
                                    [rowData]="rowData" [columnDefs]="columnDefs" [pagination]="true"
                                    [paginationPageSize]="10" (gridReady)="onGridReady($event)"
                                    (cellClicked)="statusCellClicked($event)" [gridOptions]="gridOptions">
                                </ag-grid-angular>
                            </div>
                        </div>
                    </ng-template>
                </mat-tab>
            </mat-tab-group>
        </div>
    </div>
</app-wrapper>
