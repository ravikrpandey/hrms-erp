
<h3 mat-dialog-title class="popHead">Status Details</h3>

<mat-dialog-content class="mat-typography">
  <div class="cotain">
    <div class="emp_key">

      <div class="not_created" *ngIf="this.notCreatedFlow">
        <p>Work Flow Is Not Created!</p>

      </div>
      <table class="table" *ngIf="!this.notCreatedFlow">
        <thead>
          <tr>
            <th>Approver</th>
            <th>Level</th>
            <th>Status</th>
            <th>Remark</th>
          </tr>
        </thead>
        <tbody *ngFor="let control of getdataCopy; index as i">
          <tr>
            <td>{{control?.name}}</td>
            <td>{{control?.level}}</td>
            <td>{{control?.status}}</td>
            <td>
              <mat-icon matTooltip="View Remark" style="cursor: pointer;" (click)="view(control)">visibility</mat-icon>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="row">
        <p style=" font-size: 16px;">{{remarkshow}}</p>
      </div>
    </div>
    <div class="emp_value">

    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close mat-raised-button color="primary">
    Close
  </button>
</mat-dialog-actions>
