
<h3 mat-dialog-title class="popHead">Timesheet Details</h3>

<mat-dialog-content class="mat-typography">
    <form class="form_set" [formGroup]="timesheetForm">
        <div class="row">
            <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-12 mb-3">
                <div class="form-group">
                    <mat-form-field appearance="outline" class="readonly-wrapper">
                        <mat-label>Date</mat-label>
                        <input matInput formControlName="date" readonly />
                    </mat-form-field>
                </div>
            </div>
            <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-12 mb-3">
                <mat-form-field appearance="outline" class="readonly-wrapper">
                  <mat-label>Total Hours</mat-label>
                  <input matInput formControlName="total_hours" readonly />
                </mat-form-field>
              </div>
        </div>
    </form>
    <div class="ag_grid">
        <ag-grid-angular class="ag-theme-alpine" id="myGrid" style=" width:100%; height:400px;" [rowData]="rowData"
          [columnDefs]="columnDefs" [pagination]=true [paginationPageSize]=10 [rowData]="rowData"
          (gridReady)="onGridReady($event)"   [rowClass]="rowClass">
        </ag-grid-angular>
      </div>
</mat-dialog-content>
<mat-dialog-actions align="end" class="common_button_sub mb-3">
  <button mat-dialog-close class="cancel_button_y">Close</button>
</mat-dialog-actions>
