



  <mat-icon class="close-icon" (click)="onClose()">close</mat-icon>
<h1 class="popHead">Schedule Proposal Version</h1>
<ng-container class="maindiv">
    <div class="right_data_all">
        <ng-container>
            <div class="right_data_all">

              <form [formGroup]="scheduleFollowup" (ngSubmit)="updateForlloupDate()">
                <div class="row">
                  <div class="col-md-4">
                    <mat-form-field appearance="outline">
                      <mat-label>Proposal No </mat-label>
                      <input matInput placeholder="Proposal No"  formControlName="proposal_no">
                    </mat-form-field>
                  </div>
                  <div class="col-md-4">
                    <mat-form-field appearance="outline">
                      <mat-label>Version</mat-label>
                      <input matInput placeholder="Version" formControlName="version">
                    </mat-form-field>
                  </div>
                  <div class="col-md-4">
                    <mat-form-field appearance="outline">
                      <mat-label>Follow Up date</mat-label>
                      <input matInput [matDatepicker]="picker" formControlName="followup_date">
                      <mat-hint>DD/MM/YYYY</mat-hint>
                      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                      <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                
                  </div>
                 </div>
                 <ng-container>

                  <div class="common_button_sub">
                      <button>Update </button>
                      <button class="cancel_button_y" type="button" (click)="onClose()">Cancel</button>
                  </div>
              </ng-container>
              </form>
            </div>


        </ng-container>
    </div>

</ng-container>
