<div class="heading_top">
  <div class="page-title">
    <h1>Sales CRM</h1>
    <p><span> All Quotation List </span></p>
  </div>
  <div class="add_button">
    <!-- <button class="backBtn" routerLink="../"><i class="fa fa-arrow-circle-left"></i> Back</button> -->
  </div>
</div>

<div class="right_data_all">
  <div class="employ_sube py-2">
    <div class="tabs-section mb-3">
      <button class="tab-btn" [class.active]="currentTab === 'elanProCustomer'" (click)="setTab('elanProCustomer')">
        Elan Pro Customer
      </button>
      <button class="tab-btn" [class.active]="currentTab === 'dealerCustomer'" (click)="setTab('dealerCustomer')">
        Dealer's Customer
      </button>
    </div>
  </div>
  <mat-tab-group mat-stretch-tabs animationDuration="0ms" [selectedIndex]="selected.value"
    (selectedIndexChange)="onTabClick($event)">
    <mat-tab label="All List"> </mat-tab>
    <mat-tab label="Draft List"> </mat-tab>
    <mat-tab label="Pending List"> </mat-tab>
    <mat-tab label="Approved List"> </mat-tab>
    <mat-tab label="Rejected List"> </mat-tab>
  </mat-tab-group>
  <div class="employ_sube py-2 mt-4">
    <div class="example-header">
      <select (change)="onPageSizeChanged()" id="page-size">
        <option value="10" selected="">10</option>
        <option value="100">100</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
      </select>
    </div>
    <div class="employee_2" align="end">
      <input type="text" class="form-control" id="filter-text-box" placeholder="Search"
        (input)="onFilterTextBoxChanged()" />
    </div>
  </div>
  <div class="ag_grid">
    <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width: 100%; height: 426px"
      [rowData]="rowData" [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="9"
      (gridReady)="onGridReady($event)">
    </ag-grid-angular>
  </div>
</div>
