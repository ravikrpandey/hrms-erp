
  <h3 class="popHead">Description [Customer Name
    : {{singleData?.contact_person_name}} ]</h3>
  <!-- <button mat-button mat-dialog-close>Cancel</button> -->

  <mat-dialog-content class="mat-typography">
    <div class="container">
      <div class="ag-grid">
        <ag-grid-angular
          [rowClass]="rowClass"
          class="ag-theme-alpine"
          style="width: 100%; height: 426px;"
          [rowData]="rowData"
          [columnDefs]="columnDefs"
          [pagination]="true"
          [paginationPageSize]="9"
          (gridReady)="onGridReady($event)">
        </ag-grid-angular>
      </div>
    </div>


  </mat-dialog-content>
  <mat-dialog-actions align="end" class="common_button_sub">
    <button mat-dialog-close class="cancel_button_y">Close</button>
  </mat-dialog-actions>
