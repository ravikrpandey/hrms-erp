<div class="heading_top">
    <div class="page-title">
        <h1>ESS</h1>
        <p>Advance Payment <i class="fa fa-angle-right" aria-hidden="true">
        </i><span> Apply Advance Payment </span></p>
    </div>
    <div class="add_button">
        <button type="button" class="btn_add" *ngIf="assignAction?.Write" routerLink="auther-create"><i
                class="bi bi-pencil-square"></i> Apply Advance Payment
        </button>
    </div>
</div>


<div class="right_data_all">
    <div class="d-flex justify-content-between flex-wrap w-100 py-2">
        <div class="example-header">
            <select id="page-size" (change)="onPageSizeChanged()">
                <option value="10" selected="">10</option>
                <option value="100">100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
        </div>
        <div class="employee_2" align="end">
            <input type="text" class="form-control" id="filter-text-box" (input)="onFilterTextBoxChanged()"
                   placeholder="Search">
        </div>
    </div>
    <div class="heading_neo">
        <h3>Create Advance Payment</h3>
    </div>
    <div class="form_basic">
        <form class="form_set" [formGroup]="advancePayment_form">
            <div class="row">
                <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12 mb-3">
                    <div class="form-group">
                        <mat-form-field appearance="outline">
                            <mat-label>Request Amount</mat-label>
                            <input matInput type="text" formControlName="requestAmout"/>
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12 mb-3">
                    <div class="form-group">
                        <mat-form-field appearance="outline">
                            <mat-label>Installment Period(In Month)</mat-label>
                            <input matInput type="number" formControlName="segment_suv"/>
                        </mat-form-field>
                    </div>
                </div>
                <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12 mb-3">
                    <div class="form-group">
                        <input formControlName="file" id="file" type="file" multiple class="form-control"
                               (change)="onFileChange($event)">
                    </div>
                </div>
                <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12 mb-3">
                    <div class="form-group">
                        <mat-form-field appearance="outline">
                            <mat-label>Description</mat-label>
                            <input matInput type="text" formControlName="remarks"/>
                        </mat-form-field>
                    </div>
                </div>
            </div>
            <div class="mt-3 common_button_sub" align="right">
                <button>Save</button>
                <button class="cancel_button_y">Cancel</button>
            </div>
        </form>
    </div>


    <div class="row form_head">
        <h3>Record Advance Payment</h3>
    </div>
    <div class="ag_grid ag_final_dat tableGroup">
        <ag-grid-angular class="ag-theme-alpine" style=" width:100%; height:400px;" [rowData]="rowData"
                         [columnDefs]="columnDefs" [pagination]=true [paginationPageSize]=10 [rowData]="rowData"
                         (gridReady)="onGridReady($event)" (cellClicked)="onCellClicked($event)" [rowClass]="rowClass">
        </ag-grid-angular>
    </div>

</div>
<!-- (cellClicked)='onCellClicked($event)' -->
