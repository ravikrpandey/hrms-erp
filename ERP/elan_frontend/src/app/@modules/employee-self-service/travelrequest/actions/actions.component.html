<div class="edd-del">
    <mat-icon class="viewButton" *ngIf="assignAction?.Read" (click)="view()">visibility</mat-icon>
    <mat-icon class="deleteButton" (click)="delete($event)" *ngIf="assignAction?.Delete && this.approval=='PENDING'">delete</mat-icon>
    <mat-icon class="downloadButton" (click)="download()" *ngIf="this.approval=='APPROVED' && this.cout_documents">download</mat-icon>
    <mat-icon class="editButton" (click)="edit()" *ngIf="assignAction?.Write && this.approval=='PENDING'">edit</mat-icon>
</div>
