<h3  class="popHead">Status Details</h3>

<mat-dialog-content class="mat-typography p-0 overflow-hidden">
  <div class="cotain">
    <div class="emp_key">

      <div class="not_created" *ngIf="this.notCreatedFlow">
        <p>Work Flow Is Not Created!</p>

      </div>
      <div class="table-responsive p-0 mb-0">
      <table class="table table-bordered this.notCreatedFlow mb-0">
        <thead>
          <tr>
            <th>Approver</th>
            <th>Level</th>
            <th>Status</th>
            <th>Remarks</th>
          </tr>
        </thead>
        <tbody *ngFor="let control of getdataCopy; index as i">
          <tr>
            <td>{{control?.name}}</td>
            <td>{{control?.level}}</td>
            <td>{{control?.status}}</td>
            <td>
              <mat-icon matTooltip="View Remark" style="cursor: pointer; color:#7c7c7c7c;" (click)="view(control)">visibility</mat-icon>
            </td>
          </tr>
        </tbody>
      </table>
      </div>
      <div class="row">
        <p style=" font-size: 14px;">{{remarkshow}}</p>
      </div>
    </div>
    <div class="emp_value">

    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end" class="common_button_sub">
  <button  mat-dialog-close class="cancel_button_y">
    Close
  </button>
</mat-dialog-actions>
