<div class="heading_top">
    <div class="page-title">
        <h1>ESS </h1>
        <p>Travel Request<i class="fa fa-angle-right" aria-hidden="true">
        </i><span>Travel Request List</span></p>
    </div>
    <div class="add_button">
        <button type="button" class="btn_add"   (click)="navigation()"><i class="bi bi-pencil-square"></i> Create New Request </button>
    </div>

</div>

<div class="right_data_all">
    <div class="d-flex justify-content-between flex-wrap w-100 py-2">
        <div class="example-header">
            <select id="page-size" (change)="onPageSizeChanged()">
                <option value="10" selected="">10</option>
                <option value="100">100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
        </div>
        <div class="employee_2" align="end">
            <input type="text" class="form-control" id="filter-text-box" (input)="onFilterTextBoxChanged()"
                   placeholder="Search">
        </div>
    </div>

    <div class="ag_grid ag_final_dat tableGroup">
        <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width:100%; height:426px;"
                         [rowData]="rowData"
                         [columnDefs]="columnDefs" [pagination]=true [paginationPageSize]=10
                         (gridReady)="onGridReady($event)" (cellClicked)="statusCellClicked($event)"
                         [gridOptions]="gridOptions">
        </ag-grid-angular>
    </div>
</div>
