<div class="heading_top">
    <div class="page-title">
        <h1>ESS</h1>
        <p>Leave Apply <i class="fa fa-angle-right" aria-hidden="true" style="color:#858586">
        </i><span> Applied Leaves List </span></p>
    </div>
    <div class="add_button">
        <button type="button" (click)="routeToCreateLeave()"><i class="bi bi-pencil-square"></i> Apply Leave
        </button>
    </div>
</div>

<div class="right_data_all">
    <div class="d-flex justify-content-between flex-wrap w-100 py-2">
        <div class="example-header">
            <select id="page-size" (change)="onPageSizeChanged()">
                <option value="10" selected="">10</option>
                <option value="100">100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
        </div>
        <div class="employee_2" align="end">
            <input type="text" class="form-control" id="filter-text-box1" (input)="onFilterTextBoxChanged()"
                   placeholder="Search">
        </div>
    </div>

    <div class="ag_grid ag_final_dat tableGroup">
        <ag-grid-angular class="ag-theme-alpine" style="width:100%; height:400px;" [columnDefs]="columnDefs"
                         [pagination]="true" [paginationPageSize]="10" [rowData]="rowData"
                         (cellClicked)="onCellClicked($event)"
                         (gridReady)="onGridReady($event)" [rowClass]="rowClass" [gridOptions]="gridOptions">
        </ag-grid-angular>

    </div>
</div>
