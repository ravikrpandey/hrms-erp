<div class="heading_top">
  <div class="page-title">
    <h1>ESS</h1>
    <p> Employee Self Service <i class="fa fa-angle-right" aria-hidden="true" style="color:#858586">
      </i><span> Manpower Request</span></p>
  </div>
  <div class="add_button">
    <button type="button" *ngIf="assignAction?.Write && this.showBtn" routerLink="./new-request-create" (click)="(navigate)()">
      <i class="bi bi-pencil-square"></i> New Request
    </button>
    <!-- <button routerLink="../achievement" type="button">List</button>
    <button class="backBtn" routerLink="../"><i class="fa fa-arrow-circle-left"></i> Back</button> -->

</div>

<div class="right_data_all">
      <div class="row">
        <div class="col-md-12 col-12">
        <div class="tab_menu">
          <div class="tab-item">
            <button class="main-button" color="primary" [routerLink]="['my-request-manpower']"
              routerLinkActive="active_button">My Request</button>
            <button class="main-button" color="primary" routerLinkActive="active_button"
              routerLink="pending-for-approval">Pending For Approval</button>
            <button class="main-button" color="primary" routerLinkActive="active_button"
              routerLink="approval">Approved</button>
            <button class="main-button" color="primary" routerLinkActive="active_button"
              routerLink="reject">Rejected</button>
          </div>
        </div>
      </div>
