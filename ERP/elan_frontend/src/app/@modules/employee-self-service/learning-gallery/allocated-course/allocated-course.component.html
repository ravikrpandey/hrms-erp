<div class="">
    <div class="d-flex justify-content-between flex-wrap w-100 py-2">
        <div class="example-header">
            <select id="page-size" (change)="onPageSizeChanged()">
                <option value="10" selected="">10</option>
                <option value="100">100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
        </div>
        <div class="employee_2" align="end">
            <input type="text" class="form-control" id="filter-text-box" (input)="onFilterTextBoxChanged()"
                placeholder="Search">
        </div>
    </div>
    <div class="row">
        <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-3" *ngFor="let column of rowData">
            <div class="course_contact">
                <div class="course_pic">
                    <img [src]="baseUrl + '/' + column.thumbnail">
                    <!-- <div class="icon-actions">
                      <mat-icon (click)="edit(column)" >edit</mat-icon>
                      <mat-icon (click)="delete(column.id)" >delete</mat-icon>
                    </div> -->
                </div>

                <ul class="course_dayslist">
                    <li>
                        <div class="day_title">Title</div>
                        <div class="day_number">{{ column.course_name }}</div>
                    </li>
                    <li>
                        <div class="day_title">Category</div>
                        <div class="day_number">{{ column.category }}</div>
                    </li>
                    <li>
                        <div class="day_title">Total Content</div>
                        <div class="day_number">{{ column.content_count }}</div>
                    </li>
                    <li>
                        <div class="date">
                            <div>Start Data</div>
                            <div>{{ column.allocation_start_date | date: 'dd-MMM-yyyy' }}</div>

                        </div>
                        <div class="date">
                            <div>End Date</div>
                            <div>{{ column.allocation_end_date | date : 'dd-MMM-yyyy' }}</div>
                        </div>
                    </li>
                </ul>

                <button class="op_btn" (click)="View(column)">Open</button>
            </div>
        </div>


    </div>
</div>
