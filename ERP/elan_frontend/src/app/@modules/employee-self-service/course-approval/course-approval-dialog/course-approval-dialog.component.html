<div>
  <form [formGroup]="formModel" class="form_set">

    <div class="row">
      <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
        <div class="form-group mb-3">
          <mat-form-field appearance="outline">
            <mat-label>Employee Name</mat-label>
            <input matInput formControlName="employee_name" />
          </mat-form-field>
        </div>
      </div>

      <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
        <div class="form-group mb-3">
          <mat-form-field appearance="outline">
            <mat-label>Employe Code</mat-label>
            <input matInput formControlName="employee_code" />
          </mat-form-field>
        </div>
      </div>

      <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
        <div class="form-group mb-3">
          <mat-form-field appearance="outline">
            <mat-label>Department</mat-label>
            <input matInput formControlName="department" />
          </mat-form-field>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
        <div class="form-group mb-3">
          <mat-form-field appearance="outline">
            <mat-label>Designation</mat-label>
            <input matInput formControlName="designation" />
          </mat-form-field>
        </div>
      </div>

      <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
        <div class="form-group mb-3">
          <mat-form-field appearance="outline">
            <mat-label>Manager</mat-label>
            <input matInput formControlName="reporting_manager" />
          </mat-form-field>
        </div>
      </div>

      <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
        <div class="form-group mb-3">
          <mat-form-field appearance="outline">
            <mat-label>Approval Manager</mat-label>
            <input matInput formControlName="approval_manager" />
          </mat-form-field>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
        <div class="form-group mb-3">
          <mat-form-field appearance="outline">
            <mat-label>Course Category</mat-label>
            <input matInput formControlName="course_category" />
          </mat-form-field>
        </div>
      </div>

      <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
        <div class="form-group mb-3">
          <mat-form-field appearance="outline">
            <mat-label>Course Name</mat-label>
            <input matInput formControlName="course_name" />
          </mat-form-field>
        </div>
      </div>

      <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
        <div class="form-group mb-3">
          <mat-form-field appearance="outline">
            <mat-label>Remark</mat-label>
            <input matInput formControlName="req_remark" />
          </mat-form-field>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="form-group mb-3">
        <mat-form-field appearance="outline">
          <mat-label>Remark</mat-label>
          <input matInput formControlName="remark" />
        </mat-form-field>
      </div>
    </div>
 <mat-dialog-actions align="end">
  <button class="btn-approve" (click)="onSubmit()">Approved</button>
  <button class="btn-reject" (click)="onReject()">Reject</button>
  <button
    mat-button
    mat-dialog-close
    mat-raised-button
    color="warn"
    class="btn-close"
  >
    Close
  </button>
</mat-dialog-actions>

  </form>
</div>
