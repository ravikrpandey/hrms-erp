<div class="edd-del">
    <mat-icon class="checkButton" matTooltip="approve" (click)="approvalAction('APPROVED')"
        *ngIf="assignAction?.Write">check_circle</mat-icon>
    <mat-icon class="closeButton" matTooltip="reject" (click)="approvalAction('REJECTED')" *ngIf="assignAction?.Delete">cancel</mat-icon>
</div>
