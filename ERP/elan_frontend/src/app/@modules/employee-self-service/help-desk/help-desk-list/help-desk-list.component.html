<div class="heading_top">
    <div class="page-title">
        <h1>ESS</h1>
        <p>Employee Master <i class="fa fa-angle-right" aria-hidden="true" style="color:#858586">
        </i><span> Help Desk </span></p>
    </div>
    <div class="add_button">
        <div *ngIf="isShortcutVisible()" class="shortcut-container add-shift-shortcut">
            Alt + A → Add Help Desk
        </div>
        <div class="add_button">
            <button type="button" *ngIf="assignAction?.Write" routerLink="help-disk-create">
                <i class="bi bi-person-add"></i> Add Help Desk
            </button>
        </div>

        <!-- <button class="backBtn" routerLink="../../"><i class="fa fa-arrow-circle-left"></i> Back</button> -->
    </div>
</div>


<div class="right_data_all">
    <div class="d-flex justify-content-between flex-wrap w-100 py-2">
        <div class="example-header">
            <select id="page-size" (change)="onPageSizeChanged()">
                <option value="10" selected="">10</option>
                <option value="100">100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
        </div>
        <div class="employee_2" align="end">
            <input type="text" class="form-control" id="filter-text-box" (input)="onFilterTextBoxChanged()"
                   placeholder="Search">
        </div>
    </div>
    <div class="ag_grid ag_final_dat tableGroup">
        <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style=" width:100%; height:400px;"
                         [rowData]="rowData"
                         [columnDefs]="columnDefs" (cellClicked)='onCellClicked($event)' [pagination]=true
                         [paginationPageSize]=10 (gridReady)="onGridReady($event)" [gridOptions]="gridOptions">
        </ag-grid-angular>
    </div>
</div>
