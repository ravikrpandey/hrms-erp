<div class="edd-del">
    <!-- <i (click)="edit($event)" class='fas fa-edit'></i> -->
    <mat-icon class="viewButton" (click)="openDialog($event)">visibility</mat-icon>
    <!-- <mat-icon *ngIf="(!tobeApproved && allJObData?.final_status == 'PENDING')" (click)="edit($event)">edit</mat-icon> -->
    <mat-icon class="deleteButton" *ngIf="(!tobeApproved && allJObData?.status == 'PENDING')" (click)="delete($event)">delete</mat-icon>
    <mat-icon class="checkButton" *ngIf="tobeApproved" (click)="updated($event)" matTooltip="Proceed To Approval">check_circle</mat-icon>
</div>
