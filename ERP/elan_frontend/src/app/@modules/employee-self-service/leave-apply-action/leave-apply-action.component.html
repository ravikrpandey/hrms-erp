<div class="edd-del">
    <mat-icon class="viewButton" *ngIf="assignAction?.Read" matTooltip="View" (click)="visible()">visibility</mat-icon>
    <mat-icon class="editButton" matTooltip="Edit" (click)="edit()" *ngIf=" assignAction?.Write && status !== 'APPROVED' && status !== 'REJECTED'">edit</mat-icon>
    <mat-icon class="deleteButton" matTooltip="Delete" (click)="delete()" *ngIf="assignAction?.Delete && status !== 'APPROVED' && status !== 'REJECTED'">delete</mat-icon>
