<div class="heading_top">
    <div class="page-title">
        <h1>ESS</h1>
        <p>Approve Travel Request
            <i class="fa fa-angle-right" aria-hidden="true" style="color:#858586"></i>
            <span *ngIf="status === '0'">To be approved</span>
            <span *ngIf="status === '1'">Approved</span>
            <span *ngIf="status === '2'">Rejected</span>
        </p>
    </div>
</div>

<div class="right_data_all">
    <mat-tab-group #tabGroup (selectedTabChange)="tabChange($event)">
        <mat-tab *ngFor="let tab of tabs" [label]="tab.label">
            <div class="mt-4">
                <div class="d-flex justify-content-between flex-wrap w-100 py-2">
                    <div class="example-header">
                        <select id="page-size" (change)="onPageSizeChanged()">
                            <option value="10" selected="">10</option>
                            <option value="100">100</option>
                            <option value="500">500</option>
                            <option value="1000">1000</option>
                        </select>
                    </div>
                    <div class="employee_2" align="end">
                        <input type="text" class="form-control" id="filter-text-box" (input)="onFilterTextBoxChanged()"
                               placeholder="Search">
                    </div>
                </div>

                <div class="ag_grid ag_final_dat tableGroup">
                    <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width:100%; height:426px;"
                                     [rowData]="rowData" [columnDefs]="columnDefs" [pagination]="true"
                                     [paginationPageSize]="10"
                                     (gridReady)="onGridReady($event)" [gridOptions]="gridOptions">
                    </ag-grid-angular>
                </div>
            </div>
        </mat-tab>
    </mat-tab-group>
</div>
