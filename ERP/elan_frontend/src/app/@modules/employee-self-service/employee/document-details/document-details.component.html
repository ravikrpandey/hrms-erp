<div class="right_data_all">
  <div class="heading_neo">
    <h3>Document Details</h3>
  </div>
  <mat-card>
    <table class="table table-bordered form_set">
      <thead>
        <tr>
          <th>Document Name</th>
          <th>Document Description</th>
          <th>Document</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let data of dataObj?.documents_detail">
          <td>{{data?.document_name}}</td>
          <td>{{data?.document_description}}</td>
          <td class="edd-del">
            <mat-icon class="viewButton" style="cursor:pointer" matTooltip="View" (click)="viewImg(data?.documents)">visibility</mat-icon>
          </td>
        </tr>
      </tbody>
    </table>
  </mat-card>
</div>
