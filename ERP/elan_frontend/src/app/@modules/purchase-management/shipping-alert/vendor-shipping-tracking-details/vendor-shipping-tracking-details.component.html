<div class="page-wrapper">
  <app-vendor-top-header [vendor_id]="vendor_id_header" [po_id]="po_id_header"></app-vendor-top-header>

  <div class="main">
    <h1 class="main-heading">Track Shipment Alert List</h1>
    <p class="main-sub">Monitor shipment movement and view the latest tracking updates,current locations, delivery progress, and shipment status for all purchase orders.</p>
    <form>
      <mat-card class="form-card">
        <mat-card-header>
          <mat-card-title>
            <mat-icon class="card-icon">receipt_long</mat-icon> Shipment Track Details
          </mat-card-title>

          <a style="padding-left: 10px;" mat-button 
          [routerLink]="['/approved-shipping-alert']"
          [queryParams]="{
            po_id: po_id_header,
            vendor_id: vendor_id_header
          }">
            <mat-icon class="card-icon">local_shipping</mat-icon>
            <span class="txt-decoration">Create Shipment</span>
          </a>
        </mat-card-header>

        <mat-card-content>
          <div class="mat-elevation-z1 table-wrap">
              <div class="ag_grid">
          <ag-grid-angular class="ag-theme-alpine" id="myGrid" style="width: 100%; height: 400px"
              [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="10" [rowData]="filteredData"
              (gridReady)="onGridReady($event)" (cellClicked)="statusCellClicked($event)" [rowClass]="rowClass">
          </ag-grid-angular>
      </div>
          </div>
        </mat-card-content>
      </mat-card>
    </form>
  </div>
</div>
