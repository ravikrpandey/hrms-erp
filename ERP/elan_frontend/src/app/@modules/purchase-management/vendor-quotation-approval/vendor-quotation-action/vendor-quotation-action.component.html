<div class="edd-del" *ngIf="assignAction">
  <ng-container
    *ngIf="assignAction.Write && cellData.approval_status === 'PENDING'"
  >
    <mat-icon matTooltip="Approve/Reject" (click)="approve($event)"
      >fast_forward</mat-icon
    >
  </ng-container>
  <ng-container
    *ngIf="assignAction.Read && cellData.approval_status !== 'PENDING'"
  >
    <mat-icon matTooltip="View Details" (click)="view($event)"
      >visibility</mat-icon
    >
  </ng-container>
</div>
