<app-wrapper [title]="'Purchase Management'" [subTitle]="'Invoice Payment'" [subheading]="'Invoice Payment List'">
    <div class="right_data_all">
        <div class="employ_sube py-2">
            <div class="example-header">
                <select (change)="onPageSizeChanged()" id="page-size">
                    <option value="10" selected="">10</option>
                    <option value="100">100</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                </select>
            </div>
            <div class="employee_2" align="end">
                <input type="text" class="form-control" id="filter-text-box" placeholder="Search"
                    (input)="onFilterTextBoxChanged()">
            </div>
        </div>

        <div class="ag_grid">
            <ag-grid-angular class="ag-theme-alpine" id="myGrid" style="width: 100%; height: 400px"
                [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="10" [rowData]="filteredData"
                (gridReady)="onGridReady($event)" [rowClass]="rowClass">
            </ag-grid-angular>
        </div>
    </div>
</app-wrapper>
