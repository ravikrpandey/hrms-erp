<app-wrapper [title]="'Purchase Management'" [subTitle]="'RFP List'" [subheading]="''">
    <div class="right_data_all" *ngIf="showList">
        <div class="row">
            <div class="col-md-7">
                <mat-tab-group [selectedIndex]="selectedIndex" (selectedTabChange)="onTabChange($event)">
                    <mat-tab label="Initiate RFP"></mat-tab>
                    <mat-tab label="Live RFP"></mat-tab>
                    <mat-tab label="Closed RFP"></mat-tab>
                    <mat-tab label="All RFP List"></mat-tab>
                </mat-tab-group>
            </div>
        </div>

        <div class="employ_sube py-2">
            <div class="example-header">
                <select (change)="onPageSizeChanged()" id="page-size">
                    <option value="10" selected="">10</option>
                    <option value="100">100</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                </select>
            </div>
            <div class="employee_2" align="end">
                <input type="text" class="form-control" id="filter-text-box" placeholder="Search"
                    (input)="onFilterTextBoxChanged()">
            </div>
        </div>


        <div class="ag_grid">
            <ag-grid-angular class="ag-theme-alpine" id="myGrid" style="width: 100%; height: 400px"
                [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="10" [rowData]="filteredData"
                (gridReady)="onGridReady($event)" (cellClicked)="statusCellClicked($event)" [rowClass]="rowClass">
            </ag-grid-angular>
        </div>
    </div>
</app-wrapper>
