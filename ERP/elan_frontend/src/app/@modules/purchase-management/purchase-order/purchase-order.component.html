<app-wrapper [title]="'Purchase Management'" [subTitle]="'Purchase Order List'" [subheading]="''" [showActions]="true"
    [actions]="actions">
    <div class="right_data_all">
        <div class="row">
            <div class="col-md-10">
                <mat-tab-group [selectedIndex]="selectedIndex" (selectedTabChange)="onTabChange($event)">
                    <mat-tab label="All My Purchase Order"></mat-tab>
                    <mat-tab label="Pending For Approval"></mat-tab>
                    <mat-tab label="Approved PO"></mat-tab>
                    <mat-tab label="Rejected PO"></mat-tab>
                    <!-- <mat-tab label="Draft PO"></mat-tab> -->
                </mat-tab-group>
            </div>
        </div>

        <div class="employ_sube py-2">
            <div class="example-header">
                <select (change)="onPageSizeChanged()" id="page-size">
                    <option value="10" selected="">10</option>
                    <option value="100">100</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                </select>
            </div>
            <div class="employee_2" align="end">
                <input type="text" class="form-control" id="filter-text-box" placeholder="Search"
                    (input)="onFilterTextBoxChanged()">
            </div>
        </div>


        <div class="ag_grid">
            <ag-grid-angular class="ag-theme-alpine" id="myGrid" style="width: 100%; height: 400px"
                [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="10" [rowData]="filteredData"
                (gridReady)="onGridReady($event)" (cellClicked)="statusCellClicked($event)" [rowClass]="rowClass">
            </ag-grid-angular>
        </div>
    </div>

    <div id="drawerPoPr" class="sidenav sidebarDialog">
        <div align="end"><span style="float: left;padding-left: 20px;font-weight: 500;">PO From PR</span>
            <a href="javascript:void(0)" class="closebtn" style="padding-right: 20px;"
                (click)="closeNav('drawerPoPr')">&times;</a>
        </div>
        <div class="right_data_all">
            <!-- <div class="employ_sube py-2">
                <div class="example-header">
                    <select (change)="onPageSizeChanged()" id="page-size">
                        <option value="10" selected="">10</option>
                        <option value="100">100</option>
                        <option value="500">500</option>
                        <option value="1000">1000</option>
                    </select>
                </div>
                <div class="employee_2" align="end">
                    <input type="text" class="form-control" id="filter-text-box" placeholder="Search"
                        (input)="onFilterTextBoxChanged()" />
                </div>
            </div> -->
            <div class="ag_grid">
                <ag-grid-angular class="ag-theme-alpine" style="width: 100%; height: 510px" [rowClass]="rowClass"
                    [columnDefs]="columnDefsPR" [autoGroupColumnDef]="autoGroupColumnDef" [rowData]="prRowData"
                    [treeData]="true" [getDataPath]="getDataPath" [animateRows]="true" [pagination]="true"
                    [paginationPageSize]="10" [gridOptions]="gridOptions" (gridReady)="onGridReady($event)">
                </ag-grid-angular>
            </div>
            <!-- <div class="ag_grid">
                <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width: 100%; height: 426px"
                    [columnDefs]="columnDefsPR" [pagination]="true" [paginationPageSize]="9" [rowData]="prRowData"
                    [gridOptions]="gridOptions" (gridReady)="onGridReady($event)">
                </ag-grid-angular>
            </div> -->
        </div>
    </div>

    <div id="drawerPoRfp" class="sidenav sidebarDialog">
        <div align="end"><span style="float: left;padding-left: 20px;font-weight: 500;">PO From Vendor Quotation</span>
            <a href="javascript:void(0)" class="closebtn" (click)="closeNav('drawerPoRfp')">&times;</a>
        </div>
        <div class="right_data_all">
            <!-- <div class="employ_sube py-2">
                <div class="example-header">
                    <select (change)="onPageSizeChanged()" id="page-size">
                        <option value="10" selected="">10</option>
                        <option value="100">100</option>
                        <option value="500">500</option>
                        <option value="1000">1000</option>
                    </select>
                </div>
                <div class="employee_2" align="end">
                    <input type="text" class="form-control" id="filter-text-box" placeholder="Search"
                        (input)="onFilterTextBoxChanged()" />
                </div>
            </div> -->
            <div class="ag_grid">
                <ag-grid-angular class="ag-theme-alpine" style="width: 100%; height: 510px" [rowClass]="rowClass"
                    [columnDefs]="columnDefsQuotation" [autoGroupColumnDef]="autoGroupQuotationColumnDef"
                    [rowData]="quotationRowData" [treeData]="true" [getDataPath]="getDataPath" [animateRows]="true"
                    [pagination]="true" [paginationPageSize]="10" [gridOptions]="gridOptions"
                    (gridReady)="onGridReady($event)">
                </ag-grid-angular>
            </div>
        </div>
    </div>
</app-wrapper>
