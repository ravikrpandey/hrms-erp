<app-wrapper [title]="'Sales Target & Achievement Management'" [subTitle]="'Sales Target List'" [subheading]="''"
    [showActions]="true" [actions]="actions">
    <div class="right_data_all">
        <div class="row" *ngIf="isReportingManager">
            <div class="col-md-10">
                <mat-tab-group [selectedIndex]="selectedIndex" (selectedTabChange)="onTabChange($event)">
                    <mat-tab label="All Targets"></mat-tab>
                    <mat-tab label="Pending Approval"></mat-tab>
                </mat-tab-group>
            </div>
        </div>

        <div class="employ_sube py-2">
            <div class="example-header">
                <select (change)="onPageSizeChanged()" id="page-size">
                    <option value="10" selected="">10</option>
                    <option value="100">100</option>
                    <option value="500">500</option>
                    <option value="1000">1000</option>
                </select>
            </div>
        
            <div class="employee_2" align="end">
                <input type="text" class="form-control" id="filter-text-box" placeholder="Search"
                    (input)="onFilterTextBoxChanged()">
            </div>
        </div>

        <div class="ag_grid">
            <ag-grid-angular class="ag-theme-alpine" id="myGrid" style="width: 100%; height: 400px"
                [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="10" [rowData]="rowData"
                (gridReady)="onGridReady($event)">
            </ag-grid-angular>
        </div>
    </div>
</app-wrapper>
