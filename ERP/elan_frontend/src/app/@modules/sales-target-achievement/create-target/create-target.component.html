<app-wrapper [title]="'Sales Target & Achievement Management'" [subTitle]="'Manage Sales Target'" [showActions]="true" [isBack]="true" [actions]="actions">

    <mat-card class="p-2">
        <form [formGroup]="formData">
            <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                <div class="row">
                    <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                        <mat-form-field appearance="outline">
                            <mat-label>Target Name</mat-label>
                            <input matInput type="text" formControlName="target_name"/>
                            <mat-error *ngIf="formData.controls['target_name'].hasError('required')">
                                This field is required!
                            </mat-error>
                        </mat-form-field>
                    </div>

                    <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                        <mat-form-field appearance="outline">
                        <mat-label>Select Date Range</mat-label>

                        <mat-date-range-input [rangePicker]="picker">
                            <input matStartDate placeholder="Start date" readonly formControlName="valid_from">
                            <input matEndDate placeholder="End date" readonly formControlName="valid_to">
                        </mat-date-range-input>

                        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>

                        <mat-date-range-picker #picker></mat-date-range-picker>
                        </mat-form-field>
                    </div>

                    <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                        <mat-form-field appearance="outline">
                            <mat-label>Total Target Amount (₹)</mat-label>
                            <input matInput type="number" formControlName="target_amount"/>
                            <mat-error *ngIf="formData.controls['target_amount'].hasError('required')">
                                This field is required!
                            </mat-error>
                        </mat-form-field>
                    </div>

                    <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                        <app-mat-form-select-filter [key]="'employee_id'"
                            [items]="reportingManagerList" [displayKey]="'employee_name'" placeholder="Reporting Manager"
                            formControlName="reporting_manager_id">
                        </app-mat-form-select-filter>
                    </div>
                </div>
            </div>
            <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12" style="margin-top: 10px;">
                <div class="row">
                    <div class="col-xxl-3 col-lg-3 col-md-3 col-sm-3 col-12">
                        <app-mat-form-select-filter [key]="'employee_id'"
                            [items]="employeeList" [displayKey]="'employee_name'" placeholder="Sales Employee"
                            formControlName="employee_ids" [multiple]="true">
                        </app-mat-form-select-filter>
                    </div>
                </div>
            </div>

            <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12" style="margin-top: 15px;">
                <div formArrayName="employee_targets">
                    <div class="row" *ngFor="let item of employeeTargets.controls; let i = index" [formGroupName]="i">
                        <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                            <mat-form-field appearance="outline">
                                <mat-label>{{i+1}}. Employee Name</mat-label>
                                <input matInput formControlName="employee_name" readonly>
                            </mat-form-field>
                        </div>

                        <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                            <mat-form-field appearance="outline">
                                <mat-label>Employee Target Amount (₹)</mat-label>
                                <input matInput type="number" formControlName="target_amount" (input)="updateMainTargetAmount()">
                            </mat-form-field>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-3 common_button_sub" align="end">
                <button *ngIf="!isViewMode && actionStatus=='PENDING'" (click)="onSubmit()">
                    Submit
                </button>
            </div>
        </form>
    </mat-card>

</app-wrapper>
