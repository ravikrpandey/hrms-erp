<ng-container>
  <h3 class="popHead"> Interviewer Status</h3>
  <mat-dialog-content class="mat-typography">
    <div class="cotain table-responsive">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>S.No. </th>
            <th>Round</th>
            <th>Interviewer Name</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of dataList; let i = index">
            <td>{{i+1}}</td>
            <td>{{data?.interview_round}}</td>
            <td>{{data?.first_name + ' ' + data?.last_name}}</td>
            <td>
              <button type="button" class="statusButton">{{data?.interview_status}}</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </mat-dialog-content>

</ng-container>
