<div class="edd-del">
    <mat-icon matTooltip="Create JD From Request" (click)="navigateToPO()"
        *ngIf="!singleData?.isApproved">navigate_next</mat-icon>
    <mat-icon matTooltip="User Link" *ngIf="(singleData?.isApproved && singleData?.isCompletedJd == 'COMPLETED')"
        (click)="generateIcon()">send</mat-icon>
    <mat-icon matTooltip="View" *ngIf="assignAction?.Read" (click)="viewJD($event)">visibility</mat-icon>
    <mat-icon matTooltip="Update" *ngIf="(singleData?.isCompletedJd == 'PENDING' && assignAction?.Write)"
        (click)="editJd($event)">edit</mat-icon>
        <mat-icon
  matTooltip="clone"
  *ngIf="(singleData?.isCompletedJd == 'COMPLETED' && assignAction?.Write)"
  (click)="copyToClipboard($event)">
  content_paste
</mat-icon>

</div>
