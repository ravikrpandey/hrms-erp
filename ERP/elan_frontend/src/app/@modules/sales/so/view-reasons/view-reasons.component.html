<mat-icon class="close-icon" (click)="onNoClick()">close</mat-icon>
<h3 class="popHead">Status </h3>
<mat-card>

    <mat-card-content>
        <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width: 100%; height: 426px"
            [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="9" [rowData]="rowData"
            (gridReady)="onGridReady($event)"   
            [gridOptions]="gridOptions">
        </ag-grid-angular>
    </mat-card-content>
</mat-card>
