<div class="edd-del">
    <mat-icon (click)="invoiceReturn()" *ngIf="!vehiclePlanning && invoice_status!='CANCELLED' && payment_status=='UNPAID'" title="Invoice Cancel">cancel</mat-icon>
    <mat-icon *ngIf="vehiclePlanning && invoice_status==='APPROVED'" title="Vehicle Planning Created. Invoice cannot be cancelled.">directions_car</mat-icon>
    <mat-icon (click)="view()">visibility</mat-icon>
</div>
