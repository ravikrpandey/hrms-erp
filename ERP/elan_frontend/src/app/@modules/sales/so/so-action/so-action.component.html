    <i *ngIf="assignAction?.Write && !soStatus && deliveredQty<proposedQuantity && completedStatus!=='completed'" class="fa fa-plus-circle" title="Add SO" (click)="addChallanformValue()" style="font-size: 25px;color:#28a745;"></i>
    <i *ngIf="assignAction?.Read && !soStatus && deliveredQty!=0" class="fa fa-history" title="SO History" (click)="historyOfDO()" style="font-size: 25px;color:#6c757d;"></i>
    <i *ngIf="assignAction?.Write && !soStatus && deliveredQty===0 && completedStatus!=='completed'" class="fa fa-info-circle" title="Delay Reason" (click)="openDialog('Status')" style="font-size: 25px;color: #2196F3;"></i>
    <i *ngIf="assignAction?.Write && !soStatus && deliveredQty===0 && completedStatus!=='completed'" class="fa fa-times-circle" title="Reject SO" (click)="openDialog('Reject')" style="font-size: 25px;color: #dc3545;"></i>
