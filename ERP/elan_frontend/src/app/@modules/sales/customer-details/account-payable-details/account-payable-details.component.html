<div class="right_data_all mb-4">
    <div [formGroup]="docForm">
      <mat-card>
        <div class="row form_head">
          <h3>Account Receivable Details</h3>
        </div>
        <div class="form_set">
  
        
       
  
        <div class="row" style="padding: 10px;">
          <div class="form-group mb-3 col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
            <mat-form-field appearance="outline">
                <mat-label>Assign General Customer Account</mat-label>
                <!-- <input matInput type="text" formControlName="location" /> -->
                <mat-select formControlName="account_chart">
                    <mat-option *ngFor="let value of data"
                        [value]="value.id">{{value?.account_name}}</mat-option>
                </mat-select>
                 <mat-error *ngIf="docForm.controls['account_chart'].hasError('required')">
                      This field is required!
                    </mat-error>
            </mat-form-field>
        </div>
  
        
        
          <!-- <div class="form-group mb-4 col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
            <mat-form-field appearance="outline">
                <mat-label>Assign Advance from Customer Account</mat-label>
                <mat-select formControlName="advance_account_chart">
                    <mat-option *ngFor="let value of data"
                        [value]="value.id">{{value?.account_name}}</mat-option>
                </mat-select>
                 <mat-error *ngIf="docForm.controls['advance_account_chart'].hasError('required')">
                      This field is required!
                    </mat-error>
            </mat-form-field>
        </div> -->
      </div>
  
    <div class="mt-3 common_button_sub" *ngIf="type !== 'View'">
        <button  (click)="onSubmit()">
          Update
        </button>
       
        <button class="cancel_button_y" (click)="cancels()">
          Cancel
        </button>
      </div>
    </div>
        </mat-card>
        </div>
        </div>
