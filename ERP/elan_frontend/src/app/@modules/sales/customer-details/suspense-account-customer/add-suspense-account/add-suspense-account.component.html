<div class="right_data_all mb-4">
    <div [formGroup]="docForm">
      <mat-card>
  
        <div class="row form_head">
          <h3>Advance Receipt</h3>
        </div>
  
        <div class="form_set">
  
          <div class="row p-2">
  
           
            <div class="form-group mb-3 col-lg-4 col-md-6 col-12">
              <mat-form-field appearance="outline">
                <mat-label>Customer Name</mat-label>
                <input
                  matInput   type="text"
                  formControlName="name"
                  >
              </mat-form-field>
            </div>
  
  
            <!-- Amount -->
            <div class="form-group mb-3 col-lg-4 col-md-6 col-12">
              <mat-form-field appearance="outline">
                <mat-label>Amount ({{currencyCode}}) </mat-label>
  
                <input
                  matInput
                  type="number"
                  formControlName="advance_amount">
  
                <mat-error *ngIf="docForm.get('advance_amount')?.hasError('required')">
                  This field is required!
                </mat-error>
              </mat-form-field>
            </div>
  
            <!-- Payment Mode -->
            <div class="form-group mb-3 col-lg-4 col-md-6 col-12">
              <mat-form-field appearance="outline">
                <mat-label>Payment Mode </mat-label>
  
                <mat-select formControlName="payment_mode">
                  <mat-option value="cash">Cash</mat-option>
                  <mat-option value="bank">Bank</mat-option>
                </mat-select>
  
               
              </mat-form-field>
            </div>
  
            <!-- Bank Details -->
            <ng-container *ngIf="docForm.get('payment_mode')?.value === 'bank'">
  
                <div class="form-group mb-3 col-lg-4 col-md-6 col-12">
                    <mat-form-field appearance="outline">
                      <mat-label>Bank </mat-label>
                  
                      <mat-select
  formControlName="bank"
  (selectionChange)="onBankChange($event.value)">

  <mat-option *ngFor="let bank of bankList" [value]="bank.id">
    {{ bank.bank_name }}
  </mat-option>

</mat-select>
                  
                      <mat-error *ngIf="docForm.get('bank')?.hasError('required')">
                        This field is required!
                      </mat-error>
                  
                    </mat-form-field>
                  </div>
  
              <div class="form-group mb-3 col-lg-4 col-md-6 col-12">
                <mat-form-field appearance="outline">
                  <mat-label>Account Name </mat-label>
  
                  <input
                    matInput
                    formControlName="account_name" readonly>
  
                  <mat-error *ngIf="docForm.get('account_name')?.hasError('required')">
                    This field is required!
                  </mat-error>
                </mat-form-field>
              </div>
  
              <div class="form-group mb-3 col-lg-4 col-md-6 col-12">
                <mat-form-field appearance="outline">
                  <mat-label>Cheque Number </mat-label>
  
                  <input
                    matInput
                    formControlName="cheque_number">
  
                  <mat-error *ngIf="docForm.get('cheque_number')?.hasError('required')">
                    This field is required!
                  </mat-error>
                </mat-form-field>
              </div>
  
            </ng-container>
  
            <!-- Terms & Conditions -->
            <div class="form-group mb-3 col-12">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Terms & Conditions</mat-label>
  
                <textarea
                  matInput
                  rows="4"
                  formControlName="terms_conditions">
                </textarea>
              </mat-form-field>
            </div>
  
          </div>
  
          <div class="mt-3 common_button_sub" >
  
            <button type="button" *ngIf="action_type !== 'view'" (click)="onSubmit()">
              Submit
            </button>
  
            <button
              type="button"
              class="cancel_button_y"
              (click)="cancels()">
              Cancel
            </button>
  
          </div>
  
        </div>
  
      </mat-card>
    </div>
  </div>
