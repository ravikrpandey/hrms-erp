<!-- Page Title -->
<div class="heading_top">
    <div class="page-title">
      <h1>Suspense Customer Account List</h1>
    </div>
    <div class="add_button">
      <button
  mat-raised-button
  color="primary"
  [routerLink]="['add-suspense-account']">
  <mat-icon>add</mat-icon>
  Add Suspense Record
</button>
    </div>
  </div>
  <!-- Controls Section -->
  <div class="right_data_all">
    <div class="employ_sube py-2" style="display: flex; justify-content: space-between;">
      <div class="example-header">
        <select id="page-size" (change)="onPageSizeChanged()">
          <option value="10" selected="">10</option>
          <option value="100">100</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
        </select>
      </div>
      <div class="employee_2" align="end" style="width:max-content">
        <input
          type="text"
          class="form-control"
          id="filter-text-box"
          (input)="onFilterTextBoxChanged()"
          placeholder="Search"
        />
      </div>
    </div>
  
    <div>
      <ag-grid-angular
        class="ag-theme-alpine"
        style="width: 100%; height: 426px"
        [rowData]="customerList"
        [columnDefs]="columnDefs"
        [pagination]="true"
        [paginationPageSize]="10"
        (gridReady)="onGridReady($event)"
      >
      </ag-grid-angular>
    </div>
  
  
  </div>
