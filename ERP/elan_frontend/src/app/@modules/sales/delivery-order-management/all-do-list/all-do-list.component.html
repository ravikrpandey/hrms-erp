<div class="heading_top">
  <div class="page-title">
    <h1>Sales CRM</h1>
    <p><span>Challan List</span>
    </p>
  </div>
  <!-- <div class="add_button">
    <button type="button" routerLink="../create-direct-delivery-challan" >Add Challan</button>
</div>  -->
</div>
<div class="right_data_all">
  <section class="tab-bar">
    <div fxflex="100%">
      <div class="row">
        <div class="col-md-12 col-12">
          <div class="tab_menu">
            <div class="tab-item">
              <button
                class="main-button active_button"
                color="primary"
                routerLink="/master/sales/delivery-challan-list"
              >
              All Delivery 
              </button>
              <button
                class="main-button"
                routerLink="/master/sales/delivery-e-way-list"
              >
              All e-Way 
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="right_data_all">
  <div class="employ_sube py-2">
    <div class="example-header">
      <select id="page-size" (change)="onPageSizeChanged()">
        <option value="10" selected="">10</option>
        <option value="100">100</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
      </select>
    </div>
    <div class="employee_2" align="end">
      <input
        type="text"
        class="form-control"
        id="filter-text-box"
        (input)="onFilterTextBoxChanged()"
        placeholder="Search"
      />
    </div>
  </div>
  <div class="ag_grid">
    <ag-grid-angular
      [rowClass]="rowClass"
      class="ag-theme-alpine"
      style="width: 100%; height: 426px"
      [columnDefs]="columnDefs"
      [pagination]="true"
      [paginationPageSize]="9"
      [rowData]="rowData"
      (gridReady)="onGridReady($event)"
      [gridOptions]="gridOptions"
    >
    </ag-grid-angular>
  </div>
</div>
