<div class="edd-del">
  <mat-icon
    class="viewButton"
    (click)="viewChallan($event)"
    matTooltip="View"
    >visibility</mat-icon
  >
  <mat-icon
  *ngIf="cellValue.eway_type == null && cellValue.challan_type_status ==='DIRECT'"
  class="viewButton"
  matTooltip="Generate e-Way bill"
  (click)="generateEwayWithoutIRN($event)"
  >receipt</mat-icon
>
</div>
