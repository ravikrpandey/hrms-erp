<div class="page-wrapper">
    <app-customer-header [login_id]="login_id_header"></app-customer-header>

    <div class="page-heading-wrapper">
        <h1 class="main-heading">Sales Order List</h1>
        <p class="main-sub">Track your sales orders and stay updated on their current status, shipment progress, and delivery.</p>

        <mat-card class="form-card">
            <mat-card-header>
                <mat-card-title>
                    <mat-icon class="card-icon">receipt_long</mat-icon> Sales Order List
                </mat-card-title>
            </mat-card-header>

            <mat-card-content>
                <div class="mat-elevation-z1 table-wrap">
                    <div class="ag_grid">
                        <ag-grid-angular class="ag-theme-alpine" id="myGrid" style="width: 100%; height: 500px"
                            [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="10" [rowData]="rowData"
                            (gridReady)="onGridReady($event)">
                        </ag-grid-angular>
                    </div>
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
