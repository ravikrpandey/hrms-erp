<section *ngIf="!editMode">
    <div class="row email_header form_head">
        <div class="col-md-6">
            <p>New Message</p>
        </div>
        <div class="col-md-6">
            <div class="icons_email">
                <span class="email_icon" style="padding: 0 10px;">
                    <mat-icon style="margin: 0 12px" matTooltip="Full Screen" (click)="minimize()"> launch</mat-icon>
                    <mat-icon matTooltip="Close" mat-dialog-close>clear</mat-icon>
                </span>
            </div>
        </div>
    </div>



    <form [formGroup]="emailorm">
        <div class="form_basic">

            <div class="form_set">
                <div class="email_fileds">

                    <span (click)="ccOpen()" class="cc_mail">CC</span>
                    <span (click)="bccOpen()" class="bcc_mail">BCC</span>
                </div>
                <!-- <div class="form-group">
                    <mat-label class="label_o">To</mat-label>
                    <mat-form-field appearance="outline">
                        <input type="email" matInput formControlName="to_email">
                    </mat-form-field>
                </div> -->
                <div class="form-group">
                   
                    <mat-form-field appearance="outline">
                        <mat-label>To</mat-label>
                        <mat-chip-grid #chipGrid formControlName="to_email">
                          <mat-chip-row *ngFor="let email of emailList" (removed)="removeEmail(email)">
                            {{email.value}}
                            <button matChipRemove>
                              <mat-icon>cancel</mat-icon>
                            </button>
                          </mat-chip-row>
                          <input
                            placeholder="Add email..."
                            [matChipInputFor]="chipGrid"
                            [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                            [matChipInputAddOnBlur]="true"
                            (matChipInputTokenEnd)="add($event)"
                          />
                        </mat-chip-grid>
                      </mat-form-field>
                      
                  
                    <mat-error *ngIf="emailorm.get('to_email')?.hasError('invalidEmail')">
                      Please enter a valid email address.
                    </mat-error>
                  </div>
                  
                  
                <div *ngIf="ccOpenClick">
                    <div class="form-group">
                        <mat-label>CC</mat-label>
                        <mat-form-field appearance="outline">

                            <input type="email" matInput formControlName="cc_email">

                        </mat-form-field>
                    </div>
                </div>
                <div *ngIf="bccOpenClick">
                    <div class="form-group">
                        <mat-label class="label_o">BCC</mat-label>
                        <mat-form-field appearance="outline">

                            <input type="email" matInput formControlName="bcc_email">

                        </mat-form-field>
                    </div>
                </div>


                <div class="form-group">
                    <mat-label class="label_o">Subject</mat-label>
                    <mat-form-field appearance="outline">

                        <input type="text" matInput formControlName="subject">

                    </mat-form-field>
                </div>

                <div class="form-group attach_file">

                    <ckeditor   formControlName="text"></ckeditor>
                </div>

                <div class="file_name" style="padding: 4px 0 0 0;">
                    <span style="font-size: 15px;
    font-weight: 500;
    color: #4a4545;" *ngIf="filename">Attached File Name:</span><span style="font-size: 13px;
    color: #5c5858">{{filename}}</span>
                </div>
            </div>


            <input type="file" class="file-input" (change)="onFileSelected($event)" multiple #file>
            <div class="row">
                <div class="col-md-12" align=right>
                    <button mat-mini-fab color="primary" class="upload-btn" (click)="file.click()"
                        matTooltip="File Attach">
                        <mat-icon>attach_file</mat-icon>
                    </button>


                    <span class="mail_button">
                  
                            <img
                              src="../../../../../assets/gemini-2.png"
                              alt="Gemini"
                              style="width: 48px; padding-bottom: 13px; cursor: pointer;"
                              (click)="googleGeminiAi()"
                            />
                            
                          
                      <!-- / <img src="../../../../../assets/gemini.png" style="width: 48px; padding-bottom: 13px; cursor: pointer;" (click)="googleGeminiAi()"/> -->
                    </span>
                    <span class="mail_button">
                        <button mat-raised-button color="primary" (click)="sendMail()"  [disabled]="emailorm.invalid">
                            {{sppinerRotate?'Sending':'Send'}}
                                <mat-icon *ngIf="sppinerRotate" ><mat-spinner color="accent" diameter="20">
                            </mat-spinner></mat-icon>
                          </button>
                    </span>
                </div>

            </div>

        </div>
    </form>





</section>
