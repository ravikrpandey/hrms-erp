<!-- Page Title -->
<div class="heading_top">
  <div class="page-title">
    <h1>My Customer List</h1>
    <!-- <p>Customer <i class="fa fa-angle-right" aria-hidden="true" style="color:#858586"></i><span> Customer List</span></p> -->
  </div>
  <div class="add_button">
    <button
      mat-raised-button
      color="primary"
      type="button"
      (click)="downloadCSV()"
    >
      <mat-icon class="mr-2">file_download</mat-icon>
      Export
    </button>
  </div>
</div>

<!-- Controls Section -->
<div class="right_data_all">
  <div class="d-flex justify-content-between align-items-center py-2">
    <div class="d-flex gap-3 align-items-center">
      <mat-form-field appearance="outline" class="w-auto">
        <mat-label>Rows per page</mat-label>
        <mat-select (selectionChange)="onPageSizeChanged($event.value)">
          <mat-option [value]="10">10</mat-option>
          <mat-option [value]="100">100</mat-option>
          <mat-option [value]="500">500</mat-option>
          <mat-option [value]="1000">1000</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-auto">
        <mat-label>View Type</mat-label>
        <mat-select [(ngModel)]="selectedView">
          <mat-option value="list">List View</mat-option>
          <mat-option value="tree">Tree View</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="w-25">
      <mat-label>Search</mat-label>
      <input
        matInput
        type="text"
        (input)="onFilterTextBoxChanged($event)"
        placeholder="Search customers..."
      />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <!-- Grid View -->
  <div [ngClass]="{ 'd-none': selectedView !== 'list' }">
    <ag-grid-angular
      class="ag-theme-alpine"
      style="width: 100%; height: 426px"
      [rowClass]="rowClass"
      [rowData]="customerList"
      [columnDefs]="columnDefs"
      [pagination]="true"
      [paginationPageSize]="10"
      (gridReady)="onGridReady($event)"
    >
    </ag-grid-angular>
  </div>

  <!-- Tree View -->
  <div [ngClass]="{ 'd-none': selectedView !== 'tree' }">
    <app-customer-tree-view></app-customer-tree-view>
  </div>
</div>
