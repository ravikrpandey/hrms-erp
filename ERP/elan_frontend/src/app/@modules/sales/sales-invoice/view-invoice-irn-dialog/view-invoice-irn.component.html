<h3 mat-dialog-title class="popHead">IRN Details</h3>
<mat-dialog-content class="mat-typography mt-4">
  <div class="emp_key">
    <div class="table-responsive">
      <table class="table table-bordered">
        <tbody>
          <tr>
            <th class="fixed-th">IRN No.</th>
            <td>{{ viewIrnData?.Irn || "N/A" }}</td>
          </tr>
          <tr>
            <th class="fixed-th">Ack. No</th>
            <td>{{ viewIrnData?.AckNo || "N/A" }}</td>
          </tr>
          <tr>
            <th class="fixed-th">Ack. At</th>
            <td>{{ viewIrnData?.AckDate || "N/A" }}</td>
          </tr>
          <tr>
            <th class="fixed-th">Document No.</th>
            <td>{{ viewIrnData?.DocNo || "N/A" }}</td>
          </tr>
          <tr>
            <th class="fixed-th">Document Date</th>
            <td>{{ viewIrnData?.DocDate || "N/A" }}</td>
          </tr>
          <tr>
            <th class="fixed-th">GSTIN</th>
            <td>{{ viewIrnData?.GSTIN || "N/A" }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="emp_value"></div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="common_button_sub mb-3">
  <button class="cancel_button_y" mat-dialog-close>Close</button>
</mat-dialog-actions>
