<header>
  <div routerLink="ess/dashboard" class="logo">
    <!-- <img [src]="baseUrl + '/uploaded_files/' + entityDetail?.logo" alt=""> -->
     <!-- <img src="../../../assets/selected-logo.png"/> -->
    <img src="../../../assets/company-logo.png" alt="company-logo"/>
  </div>

  <div class="float-right">
    <div class="user_profile">

      <ul>

        <li class="handle_custome_language">
          <!-- <button class="lang-button" (click)="setLanguage('en')" [class.active]="currentLanguage === 'en'">EN</button>
          <button class="lang-button" (click)="setLanguage('pt')" [class.active]="currentLanguage === 'pt'">PT</button> -->
        </li>

        <li>
          <a> <span class="user_picture">
             <img
                src="../../../assets/vendorlogo.png"
                alt="Profile Photo" matTooltip="Profile Photo"
                class="profileImg" />
            </span>

            <div class="star-rating">
              <p class="name">{{ loginUserDetails?.vendor_name  }}</p>
            </div>
          </a>
          <div class="dropdown-profile">
            <a (click)="changePassword()"><img src="assets/change-password.png" alt="Change Password"> Change Password</a>
            <a (click)="onLogout()"><img src="assets/logout.png" alt="Sign Out">
              Logout</a>
          </div>
        </li>

      </ul>
    </div>
  </div>
</header>
