<div style="background:#fff;border:1px solid #ccc;padding:10px;border-radius:5px;min-width:220px">

    <table style="width:100%;border-collapse:collapse">
        <thead>
            <tr>
                <th style="border:1px solid #ccc;padding:5px">Charge</th>
                <th style="border:1px solid #ccc;padding:5px">Amount</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let item of transporters">
                <td style="border:1px solid #ccc;padding:5px">
                    {{item.chargeList?.charge_name}}
                </td>

                <td style="border:1px solid #ccc;padding:5px">
                    {{item.amount}}
                </td>
            </tr>
        </tbody>
    </table>

</div>
