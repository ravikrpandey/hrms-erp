<div class="quick-modal-container" cdkDrag cdkDragBoundary=".cdk-overlay-container" cdkDragRootElement=".cdk-overlay-pane">
  <div class="quick-modal-header" cdkDragHandle>
    <span class="quick-modal-title">{{ data.title }}</span>
    <button type="button" class="close-btn" (click)="closeDialog()" aria-label="Close modal">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div class="quick-modal-body">
    <ng-container *ngComponentOutlet="componentClass; injector: innerInjector"></ng-container>
  </div>
</div>
