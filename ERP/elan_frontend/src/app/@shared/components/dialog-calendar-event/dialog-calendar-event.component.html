<ng-container>
  <h3 class="popHead"> Attendance Details</h3>
  <mat-dialog-content class="mat-typography">
    <div class="cotain table-responsive">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>S.No. </th>
            <th>Time</th>
            <!-- <th>Day</th> -->
            <th>IN/OUT</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of attendanceData; let i = index">
            <td>{{i+1}}</td>
            <td>{{data?.att_checktime}}</td>
            <!-- <td>{{data?.att_day}}</td> -->
            <td>{{data?.entry_type}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </mat-dialog-content>

</ng-container>
