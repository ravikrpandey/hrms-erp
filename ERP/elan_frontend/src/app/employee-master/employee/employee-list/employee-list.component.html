<div class="heading_top">
  <div class="page-title">
    <h1>Employee & Access Management</h1>
    <p>
      Employee Master
      <i class="fa fa-angle-right" aria-hidden="true" style="color: #858586">
      </i
      ><span> Employees </span>
    </p>
  </div>
  <div class="add_button">
    <button type="button" routerLink="employee-create">Add Employee</button>
    <!-- <button class="backBtn" routerLink="../"><i class="fa fa-arrow-circle-left"></i> Back</button> -->
  </div>
</div>

<div fxflex="100%">
  <div class="row">
    <div class="tab_menu">
      <div class="tab-item">
        <button class="main-button active_button">Employee Lists</button>
        <button
          class="main-button"
          routerLink="//master/hrms/employee-master/on-boarding-employ"
        >
          On-Boarding Employee List
        </button>
      </div>
    </div>
  </div>
</div>

<div class="right_data_all">
  <div class="employ_sube download_file_icon">
    <div class="d-flex justify-content-end align-items-center gap-2 mt-2">
      <!-- Filter Icon -->
      <button mat-icon-button matTooltip="Filter">
        <mat-icon>filter_list</mat-icon>
      </button>

      <!-- Sort Icon -->
      <button mat-icon-button matTooltip="Sort" (click)="shortRole(sortType)">
        <mat-icon>sort</mat-icon>
      </button>

      <!-- Export Excel -->
      <button
        mat-icon-button
        matTooltip="Export Data"
        (click)="onBtnExportDataAsExcel()"
      >
        <mat-icon>file_download</mat-icon>
      </button>

      <!-- Print -->
      <button mat-icon-button matTooltip="Print" (click)="onBtPrint()">
        <mat-icon>print</mat-icon>
      </button>
    </div>
  </div>

  <div class="employ_sube py-2">
    <div class="example-header">
      <select (change)="onPageSizeChanged()" id="page-size">
        <option value="10" selected="">10</option>
        <option value="100">100</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
      </select>
      <!-- <span class="pag_size">Per Page</span> -->
    </div>
    <div class="employee_2" align="end">
      <input
        type="text"
        class="form-control"
        id="filter-text-box"
        placeholder="Search"
        (input)="onFilterTextBoxChanged()"
      />
    </div>
  </div>

  <div class="ag_grid">
    <ag-grid-angular
      class="ag-theme-alpine"
      id="myGrid"
      style="width: 100%; height: 400px"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [pagination]="true"
      [paginationPageSize]="10"
      [rowData]="rowData"
      (gridReady)="onGridReady($event)"
      (cellClicked)="onCellClicked($event)"
      [rowClass]="rowClass"
    >
    </ag-grid-angular>
  </div>
</div>
