<section>
  <div class="conatiner">
    <mat-card>
      <div class="form_head">
        <h3>Salary Details</h3>
        <button class="backBtn" (click)="prevTab()"><i class="fa fa-arrow-circle-left"></i> Back</button>
      </div>

      <div class="form_basic">
        <form class="form_set pDetails" [formGroup]="salaryForm">
          <div class="row">
            <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
              <mat-label>Base Salary</mat-label>
              <p>{{monthly_salary}}</p>
            </div>
          </div>

          <!-- Allowance Details -->

          <div class="personalDetails pt-5">
            <div class="row form_head">
              <h3>Allowance Details</h3>
            </div>
            <div class="form_basic">
              <div class="table-wrapper" style="width: 100%;">
                <table class="table" style="width: 100%;">
                  <thead>
                    <tr class="row" style="display: flex; width: 100%;">
                      <th class="col-xxl-2 col-lg-2 col-md-2 col-sm-2 col-12" style="flex: 2;">
                        S.No.
                      </th>
                      <th class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12" style="flex: 4;">
                        Allowance Name
                      </th>
                      <th class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12" style="flex: 4;">
                        Amount
                      </th>
                      <!-- <th class="col-xxl-2 col-lg-2 col-md-2 col-sm-2 col-12 py-2" style="flex: 2;">
                        <button mat-raised-button color="warn" (click)="addRow()">
                          Add
                        </button>
                      </th> -->
                    </tr>
                  </thead>
                  <tbody formArrayName="allowanace_details">
                    <tr class="row" *ngFor="let control of allowanaceFormArray.controls; index as i" [formGroupName]="i"
                      style="display: flex; width: 100%;">
                      <td class="col-xxl-2 col-lg-2 col-md-2 col-sm-2 col-12" style="flex: 2;">
                        {{ i + 1 }}
                      </td>
                      <td class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12" style="flex: 4;">
                        <mat-form-field appearance="outline">
                          <input type="text" matInput formControlName="allowance_name" class="form-control"
                            style="width: 100%;" readonly="true" />
                        </mat-form-field>
                      </td>

                      <td class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12" style="flex: 4;">
                        <input matInput type="number" matInput formControlName="allowance_amount" class="form-control"
                          style="width: 100%;" readonly="true" />
                      </td>
                      <!-- <td class="col-xxl-2 col-lg-2 col-md-2 col-sm-2 col-12"
                        style="flex: 2; text-align: center; color: #858586; cursor: pointer;">
                        <i class="material-icons" (click)="deleteallowanace_details(i, control)">delete</i>
                      </td> -->
                    </tr>
                  </tbody>
                </table>
              </div>

            </div>
          </div>

          <div class="mt-3" *ngIf="!action_type">
            <button mat-raised-button color="primary" class="mx-3" (click)="onSubmitForm()">
              Save & Next

            <button mat-raised-button color="warn" (click)="Skip()">
