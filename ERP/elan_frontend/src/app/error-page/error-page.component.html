<div class="error-container d-flex align-items-center justify-content-center min-vh-100">
  <div class="text-center content-wrapper p-5">
    
    <h1 class="display-1 fw-bold text-primary error-code">404</h1>

    <h2 class="mb-3 fw-bold text-dark">Page Not Found</h2>

    <p class="lead text-muted mb-4 mx-auto" style="max-width: 450px;">
      Sorry, the page you are looking for doesn’t exist or has been moved. 
      Let's get you back on track.
    </p>

    <div class="d-flex gap-3 justify-content-center">
      <a routerLink="/master/ess/dashboard" 
         class="btn btn-primary btn-lg px-4 rounded-pill shadow-sm custom-btn">
        Go Home
      </a>

      <button (click)="goBack()" 
              class="btn btn-outline-secondary btn-lg px-4 rounded-pill shadow-sm custom-btn">
        Go Back
      </button>
    </div>

  </div>
</div>
