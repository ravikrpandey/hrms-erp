<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 12px;
    }
    .header {
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      border-right: solid 1px #000;
      border-top: solid 1px #000;
       border-left: solid 1px #000;
       display: flex;
       align-items: center;
       justify-content: center;
       height: 42px;

    }
    table, th, td {
      border: 1px solid black;
      border-collapse: collapse;
    }
    table {
      width: 100%;
      margin-bottom: 0px;
    }
    th, td {
      padding: 4px;
      text-align: left;
    }
    .section {
      margin-top: 15px;
    }
    .label {
      font-weight: bold;
    }
    .logo {
      position: absolute;
      top: 10px;
      left: 10px;
    }
  </style>
</head>
<body>

  <div class="logo">
    <img src="{logoUrl}" width="100" />
  </div>

  <div class="header">Asset Transfer Note</div>

  <div style="border-top: solid 1px #000; padding-left: 5px; padding-top: 4px; padding-bottom: 4px; border-left: solid 1px #000; border-right: solid 1px #000;">Date of Transfer: {createdAt}</div>

  <table>
    <thead>
      <tr>
        <th>Sr.</th>
        <th>Asset Name</th>
        <th>Asset No.</th>
        <th>Remarks</th>
      </tr>
    </thead>
    <tbody>
     {getData}
    </tbody>
  </table>
    <div style="text-align: center; padding-top: 4px; padding-bottom: 4px; border-left: solid 1px #000; border-right: solid 1px #000; border-bottom: solid 1px #000;">Sender: {assignedBy}</div>

    <div style="border-left: solid 1px #000; border-right: solid 1px #000; border-bottom: solid 1px #000;">
      <div style="padding-left: 5px; padding-top: 10px; padding-bottom: 5px;">Project:</div>
      <div style="padding-left: 5px; padding-top: 5px; padding-bottom: 5px;">Site In-charge:</div>
      <div style="padding-left: 5px; padding-top: 5px; padding-bottom: 10px;">Sender's Slip No.:</div>
    </div>

    <div style="text-align: center; padding-top: 4px; padding-bottom: 4px; border-left: solid 1px #000; border-right: solid 1px #000; border-bottom: solid 1px #000;">Receiver: {receiverName}</div>

       <div style="border-left: solid 1px #000; border-right: solid 1px #000; border-bottom: solid 1px #000;">
      <div style="padding-left: 5px; padding-top: 10px; padding-bottom: 5px;">Project:</div>
      <div style="padding-left: 5px; padding-top: 5px; padding-bottom: 5px;">Site In-charge:</div>
      <div style="padding-left: 5px; padding-top: 5px; padding-bottom: 10px;">Sender's Slip No.:</div>
    </div>

    <div style="padding-left: 5px; text-align: left; padding-top: 10px; padding-bottom: 10px; border-left: solid 1px #000; border-right: solid 1px #000; border-bottom: solid 1px #000;">Official approval:</div>
</body>
</html>
