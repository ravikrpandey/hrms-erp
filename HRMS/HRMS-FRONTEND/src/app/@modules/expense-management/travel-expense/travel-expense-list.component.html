<div class="heading_top">
    <div class="page-title">
        <h1>Expense Management</h1>
        <p>Travel Expense
            <i class="fa fa-angle-right" aria-hidden="true"></i>
            <span *ngIf="status === '0'">My Travel Expense</span>
            <span *ngIf="status === '1'">Pending For Approval</span>
            <span *ngIf="status === '2'">Approved</span>
            <span *ngIf="status === '3'">Rejected</span>
        </p>
    </div>
    <div class="add_button">
        <!-- <button type="button"  routerLink="/master/expense-management/travel-expense/add-travel-expense" *ngIf="status=='0' && assignAction?.Write">Add Travel Expense</button> -->
    </div>
</div>

<div class="right_data_all pt-4">
    <mat-tab-group #tabGroup (selectedTabChange)="tabChange($event)">
        <mat-tab *ngFor="let tab of tabs" [label]="tab.label">
            <div class="d-flex justify-content-between flex-wrap w-100 py-2 mt-4">
                <div class="example-header">
                    <select id="page-size" (change)="onPageSizeChanged()">
                        <option value="10" selected="">10</option>
                        <option value="100">100</option>
                        <option value="500">500</option>
                        <option value="1000">1000</option>
                    </select>
                </div>
                <div class="employee_2" align="end">
                    <input type="text" class="form-control" id="filter-text-box" (input)="onFilterTextBoxChanged()"
                           placeholder="Search">
                </div>
                <div class="downloadAddButton" *ngIf="status=='0' && assignAction?.Write">
                    <div class="add_button">
                        <!-- <button type="button" (click)="downloadCSV()"> <i class="bi bi-arrow-down-circle"></i> Download CSV</button> -->
                        <button type="button" routerLink="/master/expense-management/travel-expense/add-travel-expense"
                                *ngIf="status=='0' && assignAction?.Write"><i class="bi bi-person-add"></i> Add Travel
                            Expense
                        </button>
                    </div>

                </div>
            </div>
            <div class="ag_grid ag_final_dat tableGroup">
                <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width:100%; height:426px;"
                                 [rowData]="rowData" [columnDefs]="columnDefs" [pagination]="true"
                                 [paginationPageSize]="10"
                                 (gridReady)="onGridReady($event)" (cellClicked)="statusCellClicked($event)"
                                 [gridOptions]="gridOptions">
                </ag-grid-angular>
            </div>
        </mat-tab>
    </mat-tab-group>
</div>
