<h3 class="popHead">Remark</h3>

<mat-dialog-content class="mat-typography">
  <div class="cotain">
    <p>Do you want to approve this travel expense?</p>
    <div class="row">
      <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12">
        <form class="form_set" [formGroup]="remarksForm">
          <div class="form-group">
            <mat-form-field appearance="outline">
              <mat-label>Remark</mat-label>
              <input matInput type="text" formControlName="remarks" />
            </mat-form-field>
          </div>
        </form>
      </div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end" class="common_button_sub">
  <button (click)="approve()">
    Approve
  </button>
  <button mat-dialog-close class="cancel_button_y" (click)="reject()">Reject</button>
</mat-dialog-actions>
