
<div>
    <h3 *ngIf="!view" mat-dialog-title class="popHead" style="padding-left: 5px">{{!id?"Add Sub Department":"Update Sub Department"}}</h3>
    <h3 *ngIf="view" mat-dialog-title class="popHead" style="padding-left: 5px"> Sub Department Record</h3>
    <ng-container *ngIf="view">
        <mat-dialog-content class="mat-typography">
            <div class="cotain">
                <div class="emp_key"> 
                    <p>Sub Department : </p>
                    <p>Department:</p>
                </div>
                <div class="emp_value">
                    <p>{{this.areaData?.area_name}}</p>
                    <p> {{this.areaData?.department_name}}</p>
                </div>
            </div>
        </mat-dialog-content>
        <mat-dialog-actions align="end">
            <button mat-button mat-dialog-close mat-raised-button color="primary">Close</button>
        </mat-dialog-actions>
    </ng-container>
    <fieldset *ngIf="!view">
        <form [formGroup]="areaForm">
        <div class="m-3" >
            <div class="col-xxl-12 col-lg-12 col-md-6 col-sm-6 col-8 mt-3">
                <div class="form-group"  [ngClass]="view ? 'readonly-select':''">
                    <mat-form-field appearance="outline">
                    <mat-label>Department</mat-label>
                    <mat-select formControlName="department_name" (selectionChange)="selectdepartmentname($event)">
                    <mat-select-filter  (keyup)="filterDepartment($event)"></mat-select-filter>
                    <mat-option *ngFor="let department of filterdepartment" 
                        [value]="department.department_name">{{department.department_name}}</mat-option>
                        </mat-select>
                        <mat-error *ngIf="areaForm.get('department_name')?.hasError('required')">
                        This field is required!
                        </mat-error>
                    </mat-form-field>
                </div>     
            </div>
            <div class="col-xxl-12 col-lg-12 col-md-6 col-sm-6 col-8 mt-3">
                <div class="form-group">
                    <mat-form-field appearance="outline" readonly>
                        <mat-label>Sub Department</mat-label>
                        <input matInput type="text" formControlName="area_name" />
                        <mat-error *ngIf="areaForm.controls['area_name'].hasError('required')">
                            *Required!
                        </mat-error>
                        <mat-error *ngIf="areaForm.controls['area_name'].hasError('leadingSpaces')">
                            *No leading spaces!
                        </mat-error>
                    </mat-form-field>
                </div>
            </div>
        </div>
        <mat-dialog-actions align="end" *ngIf="!view">
            <button *ngIf="!id" mat-raised-button color="primary" (click)="onSubmitForm()" class="mx-2">
                Submit
            </button>
            <button *ngIf="id" mat-raised-button color="primary" (click)="onUpdateForm()" class="mx-2">
                Update
            </button>
            <button mat-button mat-dialog-close mat-raised-button color="warn" style="float: right">
                Close
            </button>      
        </mat-dialog-actions>
    </form>
    </fieldset>
</div>
