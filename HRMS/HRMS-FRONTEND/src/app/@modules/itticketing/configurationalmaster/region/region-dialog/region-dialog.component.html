<ng-container *ngIf="mode=='view'">
  <h3 mat-dialog-title class="popHead">Region Record</h3>
  <mat-dialog-content class="mat-typography">
    <div class="cotain">
      <div class="emp_key">
        <p>Region Name :</p>
        <p>Region Code :</p>
      </div>
      <div class="emp_value">
        <p>{{ getData?.region_name }}</p>
        <p>{{ getData?.region_code }}</p>
      </div>
    </div>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close mat-raised-button color="primary">
      Close
    </button>
  </mat-dialog-actions>
</ng-container>

<ng-container  *ngIf="mode!='view'">
  <h3 *ngIf="!id" mat-dialog-title class="popHead">Add Region</h3>
  <h3 *ngIf="id" mat-dialog-title class="popHead">Update Region</h3>
  <mat-dialog-content class="mat-typography">
    <form [formGroup]="regionForm">
      <div class="form-group row">
        <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-12">
          <mat-form-field appearance="outline" class="mt-2">
            <mat-label>Region</mat-label>
            <input matInput type="text" formControlName="region_name" />
            <mat-error *ngIf="regionForm.controls['region_name'].hasError('required')">
              *Required!
            </mat-error>
            <mat-error *ngIf="regionForm.controls['region_name'].hasError('leadingSpaces')">
              *No leading spaces!
            </mat-error>
          </mat-form-field>
        </div>
        <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-12">
          <mat-form-field appearance="outline" class="mt-2">
            <mat-label>Region Code</mat-label>
            <input matInput type="text" formControlName="region_code" />
            <mat-error *ngIf="regionForm.controls['region_code'].hasError('required')">
              *Required!
            </mat-error>
            <mat-error *ngIf="regionForm.controls['region_code'].hasError('leadingSpaces')">
              *No leading spaces!
            </mat-error>
          </mat-form-field>
        </div>
      </div>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-raised-button color="primary"  (click)="submitData(regionForm.value)" >
      {{ id ? "Update" : "Create"}}
    </button>
    <button mat-button mat-dialog-close mat-raised-button color="warn">
      Close
    </button>
  </mat-dialog-actions>
</ng-container>
