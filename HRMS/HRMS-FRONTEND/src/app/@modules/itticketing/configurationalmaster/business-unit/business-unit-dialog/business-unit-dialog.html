<ng-container *ngIf="visible=='visible'">
    <h3 mat-dialog-title class="popHead">Business Unit Record</h3>
    <mat-dialog-content class="mat-typography">
        <div class="cotain">
            <div class="emp_key">
                <!-- <p>S.NO. :</p> -->
                <p>Business Unit :</p>
                <p>Status :</p>
            </div>
            <div class="emp_value">
                <!-- <p>{{ singleGrade?.grade_id }}</p> -->
                <p>{{ singleGrade?.businessunit_name }}</p>
                <p>{{ singleGrade?.status }}</p>
            </div>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close mat-raised-button color="primary">
            Close
        </button>
    </mat-dialog-actions>
</ng-container>
<ng-container *ngIf="add_grade=='add_grade'">
    <form [formGroup]="businessunitForm">
        <h3 mat-dialog-title class="popHead">Business Unit</h3>
        <mat-dialog-content class="mat-typography">
            <div class="cotain">
                <div class="col-xxl-8 col-lg-8 col-md-8 col-sm-6 col-12">
                    <div class="form-group row">
                        <mat-form-field appearance="outline" class="mt-2">
                            <mat-label>Business Unit</mat-label>
                            <input matInput type="text" formControlName="businessunit_name" />
                            <mat-error *ngIf="businessunitForm.controls['businessunit_name'].hasError('required')">
                                *This field is required!
                            </mat-error>
                            <mat-error *ngIf="businessunitForm.controls['businessunit_name'].hasError('leadingSpaces')">
                                *No leading spaces!
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>
            </div>
        </mat-dialog-content>
        <mat-dialog-actions align="end">
            <button mat-button mat-raised-button color="primary" (click)="ngSubmitEmp(businessunitForm.value)">
                Submit
            </button>
            <button mat-button mat-dialog-close mat-raised-button color="warn">
                Close
            </button>
        </mat-dialog-actions>
    </form>
</ng-container>

    </form>
</ng-container>
