<ng-container *ngIf="view">
    <h3 mat-dialog-title class="popHead">{{translate('header')}}</h3>
<mat-dialog-content class="mat-typography">
    <div class="cotain">
        <div class="emp_key">
            <!-- <p>Country ID : </p> -->
            <p>{{ translate('countryCode') }} : </p>
            <p>{{ translate('countryName') }} : </p>
            <p>{{ translate('status') }} :</p>
        </div>
        <div class="emp_value">
            <!-- <p>{{singleCountryData?.countryss_id}}</p> -->
            <p>{{singleCountryData?.country_code}}</p>
            <p>{{singleCountryData?.countryss_name}}</p>
            <p> {{singleCountryData?.status}}</p>
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close mat-raised-button color="primary">{{translate('closeButton')}}</button>
</mat-dialog-actions>
</ng-container>
<fieldset *ngIf="!view">
    <div class="m-3" [formGroup]="CategoryForm">
      <div class="row">
        <!-- First Row -->
      
        <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12">
            <!-- CC Code -->
            <div class="row align-items-center">
              
              <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                <mat-form-field appearance="outline">
                  <mat-label>Category Name</mat-label>
                  <input matInput type="text" formControlName="category_name" />
                  <mat-error *ngIf="CategoryForm.get('category_name')?.hasError('required')">
                    *Required!
                  </mat-error>
                  <mat-error *ngIf="CategoryForm.get('category_name')?.hasError('leadingSpaces')">
                    *No leading spaces!
                  </mat-error>
                </mat-form-field>
              </div>
            </div>
          </div>
      </div>


    </div>



    <mat-dialog-actions align="end" *ngIf="!view">
      <button *ngIf="!category_id" mat-raised-button color="primary" (click)="onSubmitForm()" class="mx-2">
        Submit
      </button>
      <button *ngIf="category_id" mat-raised-button color="primary" (click)="onUpdateForm()" class="mx-2">
        Update
      </button>
      <button mat-button mat-dialog-close mat-raised-button color="warn" style="float: right">
        Close
      </button>
    </mat-dialog-actions>
  </fieldset>
