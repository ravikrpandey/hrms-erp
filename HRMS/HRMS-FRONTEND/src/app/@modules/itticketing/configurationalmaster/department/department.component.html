<div class="heading_top">
    <div class="page-title">
        <h1>{{ translate('pageTitle') }}</h1>
        <p>
            {{ translate('master') }}
            <i class="fa fa-angle-right" aria-hidden="true" style="color:#5d6c7c"></i>
            <span>{{ translate('masterTable') }}</span>
        </p>
    </div>
    <div class="d-flex justify-content-end align-items-center gap-3 mt-3">
        <button type="button" class="btn btn-outline-primary" (click)="downloadCSV()">
            <mat-icon>download</mat-icon> Download CSV
        </button>

        <button type="button" class="btn btn-primary" (click)="openDialog()">
            <mat-icon>add</mat-icon> {{ translate('addButton') }}
        </button>
    </div>

</div>

<div class="right_data_all">

    <div class="employ_sube py-2">
        <div class="example-header">
            <select id="page-size" (change)="onPageSizeChanged()">
                <option value="10" selected="">10</option>
                <option value="100">100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
        </div>
        <div class="employee_2" align="end">
            <input type="text" class="form-control" id="filter-text-box" (input)="onFilterTextBoxChanged()"
                [placeholder]="translate('placeholder')">
        </div>
    </div>


    <div class="ag_grid">
        <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width: 100%; height: 426px"
            [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]=10 [rowData]="rowData"
            [gridOptions]="gridOptions" (gridReady)="onGridReady($event)">
        </ag-grid-angular>
    </div>
</div>
