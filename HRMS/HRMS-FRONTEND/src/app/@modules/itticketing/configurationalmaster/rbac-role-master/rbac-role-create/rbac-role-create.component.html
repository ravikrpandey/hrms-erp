<div class="heading_top">
  <div class="page-title">
      <h1>HRMS</h1>
      <p>RBAC<i class="fa fa-angle-right" aria-hidden="true" style="color:#5d6c7c">
    </i><span>Add New Designation</span></p>
  </div>
  <div class="add_button">
    <button class="backBtn" (click)="goBack()"><i class="fa fa-arrow-circle-left"></i> Back</button>
  </div>
</div>

<section class="job-nav right_data_all">
    <mat-card>

      <div class="">
        <form class="form_set" [formGroup]="roleMasterForm">
          <div class="row">
            <!-- <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12 mb-2">
              <div class="form-group">
                <mat-form-field appearance="outline">
                  <mat-label>Select Branch</mat-label>
                  <mat-select formControlName="branch_id">
                    <mat-option *ngFor="let branch_setup of branchData"
                      [value]="branch_setup.id">{{branch_setup.branch_name}}</mat-option>
                  </mat-select>
                  <mat-error *ngIf="roleMasterForm.controls['branch_id'].hasError('required')">
                    Branch Name is Required.
                  </mat-error>
                </mat-form-field>
              </div>
            </div> -->
            <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12 mb-2">
              <div class="form-group">
                <mat-form-field appearance="outline">
                  <mat-label>Add New Designation Name</mat-label>
                  <!-- <mat-select formControlName="role_name">
                    <mat-option *ngFor="let role of roleData" [value]="role.role_name">{{role.role_name}}</mat-option>
                  
                  </mat-select> -->
                  <input matInput type="text" formControlName="role_master_name" />
                  <mat-error *ngIf="roleMasterForm.controls['role_master_name'].hasError('required')">
                    Designation Name is Required.
                  </mat-error>
                  <mat-error *ngIf="roleMasterForm.controls['role_master_name'].hasError('leadingSpaces')">
                    *No leading spaces!
                  </mat-error>
                </mat-form-field>
              </div>
            </div>
          </div>
          <div class="save-style">
            <div class="mt-3 common_button_sub">
              <button  (click)="roleSubmitForm()">
                Save
              </button>
              <button class="cancel_button_y" (click)="back()">
                Cancel
              </button>
            </div>
          </div>
        </form>
      </div>
    </mat-card>
</section>
