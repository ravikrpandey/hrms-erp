<div>
    <h3 *ngIf="!view" mat-dialog-title class="popHead">{{!departmentId?"Add Reason":"Update Reason"}}</h3>
    <h3 *ngIf="view" mat-dialog-title class="popHead">View Reason</h3>
    <fieldset >
        <div class="m-3" [formGroup]="departmentForm">
            <div class="row">
                <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12 mt-2">
                    <mat-label>Reason Name</mat-label>
                </div>
                <div class="col-xxl-8 col-lg-8 col-md-8 col-sm-6 col-12">
                    <div class="form-group row">
                        <!-- <p>Department Name</p> -->
                        <mat-form-field appearance="outline">
                            <mat-label>Reason Name</mat-label>
                            <input matInput 
                                   type="text" 
                                   formControlName="reason_for_recruitment" 
                                   [readonly]="view === 'view'" />
                            <mat-error *ngIf="departmentForm.controls['reason_for_recruitment'].hasError('required')">
                              *Required!
                            </mat-error>
                            <mat-error *ngIf="departmentForm.controls['reason_for_recruitment'].hasError('leadingSpaces')">
                              *No leading spaces!
                            </mat-error>
                          </mat-form-field>
                          
                    </div>
                </div>
            </div>
        </div>

        <mat-dialog-actions align="end" *ngIf="view" class="common_button_sub">
            <button  mat-dialog-close class="cancel_button_y">
                Close
            </button>
        </mat-dialog-actions>

        <mat-dialog-actions align="end" *ngIf="!view" class="common_button_sub">
            <button *ngIf="!departmentId" (click)="onSubmitForm()">
                Submit
            </button>
            <button *ngIf="departmentId" (click)="onUpdateForm()">
                Update
            </button>
            <button  mat-dialog-close class="cancel_button_y" >
                Close
            </button>
        </mat-dialog-actions>
    </fieldset>
</div>
