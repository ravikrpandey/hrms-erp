<div class="heading_top p-3">
  <div class="page-title">
    <h1>Configurational Master</h1>
    <p>Travel Type Master<i class="fa fa-angle-right" aria-hidden="true" style="color:#063178">
      </i><span>List</span></p>
  </div>
  <div class="add_button">
    <button type="button" class="btn_add" (click)="add('travel')" style="margin-right:10px">
      <i class="fa fa-plus" aria-hidden="true"></i> Add Travel Type
    </button>
    <button type="button" class="btn_add" (click)="add('conveyance')">
      <i class="fa fa-plus" aria-hidden="true"></i> Add Conveyance
    </button>
  </div>
</div>
<div class="">
  <div class="d-flex justify-content-between">
    <select id="p-3" (change)="onPageSizeChanged()">
      <option value="10" selected="">10</option>
      <option value="100">100</option>
      <option value="500">500</option>
      <option value="1000">1000</option>
    </select>
    <div class="justify-content-end">
      <input type="text" class="form-control" id="filter-text-box" (input)="onFilterTextBoxChanged()"
        placeholder="Search" />
    </div>
  </div>

  <div class="ag_grid p-3">
    <!-- <ag-grid-angular
        [rowClass]="rowClass"

        [paginationPageSize]="10"

    <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width: 100%; height: 426px"
      [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="9" [rowData]="rowData"
      (gridReady)="onGridReady($event)" [gridOptions]="gridOptions" [getDataPath]="getDataPath"
      [frameworkComponents]="frameworkComponents" [autoGroupColumnDef]="autoGroupColumnDef" [treeData]="true"
      [animateRows]="true">
    </ag-grid-angular>
  </div>
</div>
