<div class="heading_top p-3">
  <div class="page-title">
    <h1>Configurational Master</h1>
    <p>
      Travel Type Master<i class="fa fa-angle-right" aria-hidden="true" style="color:#5d6c7c"></i>
      <span>{{ mode === 'edit' ? 'Update' : (mode === 'view' ? 'View' : 'Add') }}
      </span>
    </p>
  </div>
  <div class="add_button">
    <button class="backBtn" (click)="back()"><i class="fa fa-arrow-circle-left"></i> Back</button>
  </div>
</div>
<section class="job-nav right_data_all">
  <mat-card>
    <div>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form_set">
        <div class="row">
          <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-6 col-12 mb-2" *ngIf="type === 'conveyance'">
            <div class="form-group">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>Select Travel Type</mat-label>
                <mat-select formControlName="parentId" required>
                  <mat-option *ngFor="let item of rowData" [value]="item.id">
                    {{ item.name }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </div>
          <!-- Travel Type Name -->
          <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-6 col-12 mb-2">
            <div class="form-group">
              <mat-form-field appearance="outline" class="w-100">
                <mat-label>{{ type === 'travel' ? 'Travel Type Name' : 'Conveyance Name' }}</mat-label>
                <input matInput id="travelTypeName" type="text" formControlName="name" required />
                <mat-error *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
                  Type name is required.
                </mat-error>
              </mat-form-field>
            </div>
          </div>

          <!-- Parent Type (Only for conveyance) -->
          
        </div>

        <!-- Save / Cancel -->
        <div class="save-style">
          <div class="mt-3 common_button_sub">
            <button type="submit" [disabled]="form.invalid">
              {{ mode === 'edit' ? 'Update' : 'Save' }}
            </button>
            <!-- <button class="cancel_button_y" type="button" (click)="back()">
              Cancel
            </button> -->
          </div>
        </div>
      </form>
    </div>
  </mat-card>
</section>
