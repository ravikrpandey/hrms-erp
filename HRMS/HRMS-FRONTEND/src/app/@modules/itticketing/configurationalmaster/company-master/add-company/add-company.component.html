<section class="section">
    <div class="row head">
        <p>Admin</p>
    </div>
    <div class="row py-1">
        <div class="employee_top">Add Company Master
            <span class="employee_2" *ngIf="!companyID"><i class="fa fa-angle-right" aria-hidden="true"
                    style="color:#5d6c7c">
                </i>
                Create </span>
            <span class="employee_2" *ngIf="companyID"><i class="fa fa-angle-right" aria-hidden="true"
                    style="color:#5d6c7c">
                </i>
                Update </span>
        </div>
    </div>

    <mat-card>
        <div class="form_head">
            <h3>Company Master</h3>
            <button class="backBtn" (click)="goBack()"><i class="fa fa-arrow-circle-left"></i> Back</button>
        </div>
        <div class="form_basic">
            <!-- shiftMasterForm -->
            <form class="form_set" [formGroup]="CompanyMasterform">
                <div class="row">
                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group">
                            <mat-form-field appearance="outline">
                                <mat-label>Company Name</mat-label>
                                <input matInput type="text" formControlName="company_name" />
                                <mat-error *ngIf="CompanyMasterform.controls['company_name'].hasError('required')">
                                    Company Name is Required.
                                </mat-error>
                                
                            </mat-form-field>
                        </div>
                    </div>
                    <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
                        <div class="form-group">
                            <mat-form-field appearance="outline">
                                <mat-label>Abbreviation</mat-label>
                                <input matInput type="text" formControlName="abbreviation" />
                                <mat-error *ngIf="CompanyMasterform.controls['abbreviation'].hasError('required')">
                                    Company Contact is Required.
                                </mat-error>
                                
                            </mat-form-field>
                        </div>
                    </div>
                   
                </div>
                <div *ngIf="parm!=='view'">
                    <button *ngIf="!companyID" [disabled]="extraWords" (click)="onSubmitForm()" mat-raised-button
                        color="primary">
                        Submit
                    </button>

                    <button *ngIf="companyID" (click)="updateForm($event)" mat-raised-button color="primary">
                        Update
                    </button>
                    <button mat-raised-button color="warn" class="mx-3" (click)="back()">Cancel</button>
                </div>
            </form>

        </div>
    </mat-card>
</section>
