
<div class="heading_top">
    <div class="page-title">
        <h1>HRMS</h1>
        <p>
            Comp Off Work
            <i class="fa fa-angle-right" aria-hidden="true" style="color: #5d6c7c"></i>
            <span> List</span>
        </p>
    </div>
</div>
<div class="right_data_all">
    <div class="employ_sube py-2 d-flex justify-content-between">
        <div class="example-header">
            <label for="page-size">Page Size:</label>
            <select (change)="onPageSizeChanged()" id="page-size" class="form-control">
                <option value="10" selected>10</option>
                <option value="100">100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
        </div>
        <div>
            <input type="text" class="form-control" id="filter-text-box" placeholder="Search"
                (input)="onFilterTextBoxChanged()" />
        </div>
    </div>
    <div class="ag_grid">
        <ag-grid-angular class="ag-theme-alpine" style="width: 100%; height: 500px" [rowData]="rowData"
            [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="10" (gridReady)="onGridReady($event)"
            (cellClicked)="onCellClicked($event)">
        </ag-grid-angular>
    </div>
</div>
