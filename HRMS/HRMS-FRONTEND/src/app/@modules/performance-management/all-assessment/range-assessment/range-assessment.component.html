<div class="heading_top">
  <div class="page-title">
    <h1>Performance Assessment</h1>
    <p>All Assessment<i
        class="fa fa-angle-right"
        aria-hidden="true"
        style="color: #858586"
      >
      </i
      ><span>All Assessment List</span>
    </p>
  </div>
</div>

<ng-container>
    <div class="right_data_all">
        <div class="parentDiv">
          <div *ngFor="let yr of rowData" (click)="redirect(yr)"  [ngClass]="{'yrBox': true, 'activeClass': yr.active}">
            <div class="yearHeading">{{yr?.assessment_name}}</div>
            <div class="gap"></div>
            <div class="yearText"><span class="heading">Start Date</span> : {{yr?.start_date}}</div>
            <div class="gap"></div>
            <div class="yearText"><span class="heading">End Date</span> : {{yr?.end_date}}</div>
          </div>
        </div>
      </div>
</ng-container>
