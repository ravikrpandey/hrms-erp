<div class="heading_top">
  <div class="page-title">
    <h1>Performance Assessment</h1>
    <p>Department Wise List</p>
  </div>
</div>
<div>
  <div class="right_data_all flexCenter">
    <div class="parentDiv">
      <div *ngFor="let dep of rowData" (click)="redirect(dep)" class="box">
        <div class="innerBox">
          <div class="heading"> Department Name:</div>
          <div class="value">{{dep?.department_name}}</div>
        </div>
        <div class="innerBox">
          <div class="heading">Total Number Of Employee:</div>
          <div  class="value">{{dep?.no_of_employee}}</div>
        </div>
        <div class="innerBox">
          <div class="heading">Completed Assessment: </div>
          <div  class="value">{{dep?.completed_assessment}}</div>
        </div>
        <div class="innerBox">
          <div class="heading">Pending Assessment:</div>
          <div  class="value">{{dep?.pending_assessment}}</div>
        </div>
        <div class="innerBox">
          <div class="heading">Pending Self Assessment:</div>
          <div  class="value">{{dep?.pending_self_assessment}}</div>
        </div>
      </div>
    </div>
  </div>
</div>
