<div class="add_btn">
  <button type="button" class="btn_add" (click)="allocateCourse()">
    Allocate Course
  </button>
</div>

<div class="right_data_all">
  <mat-tab-group #tabGroup (selectedTabChange)="tabChange($event)">
    <mat-tab *ngFor="let tab of tabs" [label]="tab.label">
  <div class="employ_sube py-2">
    <div class="employee_2" align="end">
      <input
        id="searchText"
        type="text"
        placeholder="Search by course name"
        class="input-group form-control search-input form-control"
        (input)="filterSupplier($event)"
      />
    </div>
  </div>

  <div class="ag_grid">
    <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width: 100%; height: 426px"
        [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]=10 [rowData]="rowData"
        [gridOptions]="gridOptions" (gridReady)="onGridReady($event)">
    </ag-grid-angular>
</div>
</mat-tab>
  </mat-tab-group>
</div>
