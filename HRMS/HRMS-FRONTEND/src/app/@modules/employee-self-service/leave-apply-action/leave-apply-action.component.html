<div class="edd-del">
    <mat-icon matTooltip="View" (click)="visible()">visibility</mat-icon>
    <mat-icon matTooltip="Edit" (click)="edit()" *ngIf="status !== 'APPROVED' && status !== 'REJECTED'">edit</mat-icon>
    <mat-icon matTooltip="Delete" (click)="delete()" *ngIf="status !== 'APPROVED' && status !== 'REJECTED'">delete</mat-icon>
