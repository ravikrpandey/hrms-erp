<div class="container">
   
    <mat-tab-group (selectedIndexChange)="onTabChange($event)">
      
      <mat-tab label="My Tickets">
        <ng-template matTabContent>
          <app-myticket *ngIf="selectedTab === 0"></app-myticket>
        </ng-template>
      </mat-tab>
  
    
      <mat-tab label="Allocated Tickets">
        <ng-template matTabContent>
          <app-allocated-tickets *ngIf="selectedTab === 1"></app-allocated-tickets>
        </ng-template>
      </mat-tab>
    </mat-tab-group>
  </div>
