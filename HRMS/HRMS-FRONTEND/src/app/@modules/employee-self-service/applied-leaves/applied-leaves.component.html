<div class="heading_top">
    <div class="page-title">
      <h1>ESS</h1>
      <p>Employees Applied Leaves <i class="fa fa-angle-right" aria-hidden="true" style="color:#5d6c7c">
        </i><span> All Applied Leaves </span></p>
    </div>
  </div>
  
  
   
  <div class="right_data_all">
  
    <div class="employ_sube">
      <div class="example-header">
        <select (change)="onPageSizeChanged()" id="page-size">
          <option value="10" selected="">10</option>
          <option value="100">100</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
        </select>
      </div>
      <div class="employee_2">
        <input type="text" class="form-control" id="filter-text-box1" #input placeholder="Search"
          (input)="onFilterTextBoxChanged()">
      </div>
    </div>
  
    <div class="ag_grid">
      <ag-grid-angular class="ag-theme-alpine" style=" width:100%; height:400px;" [rowData]="rowData"
        [columnDefs]="columnDefs" [pagination]=true [paginationPageSize]=10 [rowData]="rowData"
        (gridReady)="onGridReady($event)" (cellClicked)="onCellClicked($event)"  [rowClass]="rowClass">
      </ag-grid-angular>
  
    </div>
  </div>
