<div class="heading_top">
    <div class="page-title">
        <h1>ESS</h1>
        <p>Knowledge Transfer
            <i class="fa fa-angle-right" aria-hidden="true" style="color:#5d6c7c"></i>
            <span> KT Assignment Create </span>
        </p>
    </div>

    <div class="add_button">
        <button mat-raised-button color="warn" [routerLink]="['../']">Back</button>
    </div>
</div>

<section class="job-nav right_data_all">
    <mat-card>
        <form [formGroup]="ktAssignform" (ngSubmit)="onSubmit()" class="form_set">
            <div class="row">

                <!-- KT Category -->
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>KT Category</mat-label>
                    <mat-select formControlName="category_name" (selectionChange)="onCategoryChange($event.value)">
                        <mat-option *ngFor="let cat of categoryList" [value]="cat.id">
                            {{ cat.category_name }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>


                <!-- From Employee -->
                <div class="col-xxl-4 col-lg-4 col-md-6 col-sm-12 mb-3">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>From Employee</mat-label>
                        <mat-select formControlName="from_emp">
                            <mat-option *ngFor="let emp of employeeList" [value]="emp.employee_id">
                                {{ emp.full_name }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>

                <!-- To Employee (Multiple) -->
                <div class="col-xxl-4 col-lg-4 col-md-6 col-sm-12 mb-3">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>To Employee</mat-label>
                        <mat-select formControlName="employee" multiple>
                            <mat-option *ngFor="let emp of employeeList" [value]="emp.employee_id">
                                {{ emp.full_name }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>

                <!-- Assigned Date -->
                <div class="col-xxl-4 col-lg-4 col-md-6 col-sm-12 mb-3">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Assigned Date</mat-label>
                        <input matInput [matDatepicker]="picker" formControlName="assigned_date" readonly>
                        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker disabled="false"></mat-datepicker>
                    </mat-form-field>
                </div>


                <!-- Remarks -->
                <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 mb-3">
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label>Remarks</mat-label>
                        <textarea matInput rows="3" formControlName="remarks"></textarea>
                    </mat-form-field>
                </div>

            </div>

            <div class="save-style">
                <div class="mt-3 common_button_sub">
                    <button mat-raised-button color="primary" type="submit" [disabled]="ktAssignform.invalid">
                        {{ mode === 'edit' ? 'Update' : 'Submit' }}
                    </button>

                    <button mat-raised-button color="warn" type="button" routerLink="kt-assignment">
                        Cancel
                    </button>
                </div>
            </div>

        </form>
    </mat-card>
</section>
