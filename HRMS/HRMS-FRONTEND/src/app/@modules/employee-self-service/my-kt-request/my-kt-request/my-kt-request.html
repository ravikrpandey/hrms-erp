<div class="tab-item">
  <button class="main-button" [ngClass]="{'active': currentTab==='myRequest'}" 
          (click)="onTabSelect('myRequest')">My Request</button>

  <button class="main-button" [ngClass]="{'active': currentTab==='pendingForApproval'}" 
          (click)="onTabSelect('pendingForApproval')">Pending For Approval</button>

  <button class="main-button" [ngClass]="{'active': currentTab==='approved'}" 
          (click)="onTabSelect('approved')">Approved</button>

  <button class="main-button" [ngClass]="{'active': currentTab==='rejected'}" 
          (click)="onTabSelect('rejected')">Rejected</button>
</div>

<div class="right_data_all">
  <div class="employ_sube py-2">
    <div class="d-flex justify-content-between">
      <div class="example-header">
        <select (change)="onPageSizeChanged()" id="page-size">
          <option value="10" selected>10</option>
          <option value="100">100</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
        </select>
      </div>

      <div class="employee_2">
        <input type="text" class="form-control" id="filter-text-box1"
               placeholder="Search" (input)="onFilterTextBoxChanged()">
      </div>
    </div>

    <!-- AG GRID -->
    <div class="ag_grid" *ngIf="rowData.length > 0">
      <ag-grid-angular
        class="ag-theme-alpine"
        style="width:100%; height:420px;"
        [columnDefs]="columnDefs"
        [pagination]="true"
        [paginationPageSize]="10"
        [rowData]="rowData"
        (cellClicked)="onCellClicked($event)"
        (gridReady)="onGridReady($event)">
      </ag-grid-angular>
    </div>

    <div *ngIf="rowData.length === 0" class="text-center py-4">
      No requests found for this tab.
    </div>
  </div>
</div>
