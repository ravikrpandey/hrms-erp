<div>
    <h3 mat-dialog-title class="popHead" style="padding-left: 5px" *ngIf="!view">{{this.data.tableData.content_name}}
        <!-- <mat-dialog-actions align="end"> -->
            <mat-icon
              mat-button
              mat-dialog-close
              mat-raised-button
              color="warn"
              style="float: right;padding: 20px;"
              matTooltip="close"
              >close</mat-icon
            >
          <!-- </mat-dialog-actions> -->
    </h3>
 
  <div mat-dialog-content>
    
    <ng-container
      *ngIf="this.data.tableData.content_file_type === 'image'; else otherTypes"
    >
      <img
        [src]="baseUrl + '/' + this.data.tableData.content_file_path"
        alt="Image"
        style="max-width: 100%; height: auto"
      />
    </ng-container>

    <ng-template #otherTypes>
      <ng-container
        *ngIf="
          this.data.tableData.content_file_type === 'video';
          else fileTypes
        "
      >
        <video controls controlsList="nodownload" style="width: 100%; height: 290px">
          <source
            [src]="baseUrl + '/' + data.tableData.content_file_path"
            content_file_type="video/mp4"
          />
          Your browser does not support html Copy code the video tag.
        </video>
      </ng-container>

      <ng-template #fileTypes>
        <ng-container *ngIf="this.data.tableData.content_file_type === 'pdf'">
          <iframe
            *ngIf="sanitizedUrl"
            [src]="sanitizedUrl"
            style="width: 500px; height: 500px"
            frameborder="0"
            aria-hidden="true"
          ></iframe>
        </ng-container>

        <!-- <ng-container *ngIf="this.data.tableData.content_file_type === 'docs'">
          <iframe
            [src]="
              'https://view.officeapps.live.com/op/embed.aspx?src=' +
              this.data.tableData.content_file_path
            "
            style="width: 100%; height: 500px"
            frameborder="0"
          >
          </iframe>
        </ng-container> -->

        <ng-container *ngIf="isExcelFile">
          <h3>Excel File Preview</h3>
          <table mat-table [dataSource]="fileContent" class="mat-elevation-z8">
            <ng-container
              *ngFor="let header of fileContentHeaders"
              [matColumnDef]="header"
            >
              <th mat-header-cell *matHeaderCellDef>{{ header }}</th>
              <td mat-cell *matCellDef="let row">{{ row[header] }}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="fileContentHeaders"></tr>
            <tr mat-row *matRowDef="let row; columns: fileContentHeaders"></tr>
          </table>
        </ng-container>

        <!-- Text File -->
        <!-- <ng-container *ngIf="this.data.tableData.content_file_type === 'Text File'">
          <textarea [value]="fileContent" readonly style="width: 100%; height: 500px; resize: none;"></textarea>
        </ng-container> -->

        <ng-container *ngIf="this.data.tableData.content_file_type === 'audio'">
          <audio controls style="width: 300px">
            <source
              [src]="baseUrl + '/' + data.tableData.content_file_path"
              content_file_type="audio/mpeg"
            />
            Your browser does not support the audio tag.
          </audio>
        </ng-container>

        <ng-container
          *ngIf="this.data.tableData.content_file_type === 'Archive'"
        >
          <p>Download the file:</p>
          <a
            [href]="this.data.tableData.content_file_path"
            target="_blank"
            style="color: blue"
            >Click here to download</a
          >
        </ng-container>
      </ng-template>
    </ng-template>
  </div>
</div>
