<div class="employee_basic_details">
  <mat-card class="Document_Details">
      <h3>Document Details </h3>
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Document Name</th>
          <th>Document Description</th>
          <th>Document</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let data of dataObj?.documents_detail">
          <td>{{data?.document_name}}</td>
          <td>{{data?.document_description}}</td>
          <td>
            <mat-icon (click)="viewImg(data?.documents)">visibility</mat-icon>
          </td>
        </tr>
      </tbody>
    </table>
  </mat-card>
</div>
