<mat-card class="CONTRACT_details">
  <h3>Contract Details </h3>
  <div class="acor_data_y">
    <div class="table_ip tableDesign table-responsive">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th class="cen">S. No.</th>
            <th class="cen">Contract Type</th>
            <th class="cen">Start Contract Date</th>
            <th class="cen">End Contract Date</th>
            <!-- <th class="cen" *ngIf="action_type !='view'">Action</th> -->
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let document of documents_detail; let i = index">
            <td>{{i+1}}</td>
            <td>{{document?.contract_types}}</td>
            <td>{{document?.start_working_date | date:'dd/MM/yyyy'}}</td>
            <td>{{document?.end_date_probation  | date:'dd/MM/yyyy'}}</td>
  
            <!-- <td class="common_button_sub" *ngIf="action_type !='view'">
              <button (click)="editRecord(i, document)">Edit</button>
              <button class="cancel_button_y" (click)="deleteRecord(i)">Delete</button>
            </td> -->
          </tr>
          <tr class="text-center">
            <td colspan="5" *ngIf="!documents_detail?.length">No record found</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  </mat-card>
