<h3 mat-dialog-title class="popHead">Remarks for {{ exit_code }}</h3>

<div class="remarks-box">
  <div class="row-item">
    <label>Approver Name:</label>
    <span>{{ approverName }}</span>
  </div>

  <div class="row-item">
    <label>Status:</label>
    <span [class.approved]="status==='APPROVED'" [class.rejected]="status==='REJECTED'">
      {{ status }}
    </span>
  </div>

  <div class="row-item remarks-text">
    <label>Remarks:</label>
    <p>{{ remarks }}</p>
  </div>
</div>

<div class="actions">
  <button mat-button mat-dialog-close color="primary">Close</button>
</div>
