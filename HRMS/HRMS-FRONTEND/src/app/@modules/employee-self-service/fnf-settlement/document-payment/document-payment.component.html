
<div style="width: 100%;
    float: left;padding-top: 20px;">
<form [formGroup]="documentForm" (ngSubmit)="handleSubmit()">
  <div class="section">
    <h2>Payment Processing</h2>
    <div class="form-grid grid-3">
      <div class="field">
        <label>Payment Status</label>
        <select formControlName="final_payment_status">
          <option value="">Select</option>
          <option value="PENDING">Pending</option>
          <option value="PROCESSING">Processing</option>
          <option value="PAID">Paid</option>
        </select>
      </div>

      <div class="field">
        <label>Payment Date</label>
        <input type="date" formControlName="payment_date" />
      </div>

      <div class="field">
        <label>Payment Method</label>
        <select formControlName="payment_method">
          <option value="">Select</option>
          <option value="BANKTRANSFER">Bank Transfer</option>
          <option value="CHEQUE">Cheque</option>
          <option value="OTHER">Other</option>
        </select>
      </div>

      <div class="field">
        <label>Remark</label>
        <input type="text" formControlName="remark" />
      </div>

      <div class="field">
        <label>Transaction Id</label>
        <input type="text" formControlName="transaction_id" maxlength="12" />
      </div>
    </div>
  </div>
  <div class="form-actions">
    <button class="action-btn btn btn-primary" type="submit">Submit</button>
    <button class="action-btn btn btn-secondary Cancel" type="button" routerLink="/master/ess/fnf-settlement">Cancel</button>
  </div>
</form>
</div>
 
<div class="section">
  <h2>Document Generation</h2>
  <div class="form-grid grid-2">
    <div class="field">
      <label>FNF Statement</label>
      <div class="icon-buttons">
        <i class="fas fa-download" title="Download FNF" (click)="downloadFnf()" style="cursor: pointer; font-size: 20px; margin-right: 15px;"></i>
        <i class="fas fa-envelope" title="Email FNF" (click)="openSendEmailModal()" style="cursor: pointer; font-size: 20px;"></i>
      </div>
    </div>
  </div>
</div>



<div class="modal fade show d-block" *ngIf="showEmailModal">
  <div class="modal-dialog modal-lg">
    <div class="modal-content p-3">

      <div class="modal-header">
        <h3 class="modal-title">Send FNF Statement Email</h3>
        <button type="button" class="btn-close" (click)="closeEmailModal()"></button>
      </div>

      <form (ngSubmit)="sendFnfEmail()" enctype="multipart/form-data">
        <div class="modal-body">
          <div class="form-group mb-2">
            <label for="to">To:</label>
            <input type="email" id="to" class="form-control"[(ngModel)]="emailForm.to" name="to" required />
          </div>

          <div class="form-group mb-2">
            <label for="subject">Subject:</label>
            <input type="text" id="subject" class="form-control" [(ngModel)]="emailForm.subject" name="subject"  />
          </div>

          <div class="form-group mb-2">
            <label for="pdf">Upload PDF:</label>
            <input type="file" (change)="onFileSelected($event)" class="form-control" accept="application/pdf"  />
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="closeEmailModal()">Close</button>
          <button type="submit" class="btn btn-primary">Send Email</button>
        </div>
      </form>

    </div>
  </div>
</div>
