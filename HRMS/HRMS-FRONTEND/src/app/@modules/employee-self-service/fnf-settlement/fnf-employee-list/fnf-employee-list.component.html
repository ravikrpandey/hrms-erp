<div class="right_data_all">
    <div class="employ_sube py-2 d-flex justify-content-between align-items-center flex-wrap">
        <div class="page-size-dropdown">
            <select (change)="onPageSizeChanged()" id="page-size" class="form-select w-auto">
                <option value="10" selected>10</option>
                <option value="100">100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
        </div>

        <!-- Right side filter group -->
        <div class="d-flex gap-2 align-items-center">
            <div class="status-filter">
                <select class="form-select w-auto" (change)="onStatusFilterChanged($event)">
                    <option value="">All Status</option>
                    <option value="PAID">Paid</option>
                    <option value="PENDING">Pending</option>
                    <option value="APPROVED">Approved</option>
                </select>
            </div>

            <div class="search-box">
                <input type="text" class="form-control w-auto" id="filter-text-box" placeholder="Search"
                    (input)="onFilterTextBoxChanged()">
            </div>
        </div>
    </div>

    <div class="ag_grid">
        <ag-grid-angular class="ag-theme-alpine" style="width:100%; height:400px;" [rowData]="rowData"
            [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="10" (gridReady)="onGridReady($event)">
        </ag-grid-angular>
    </div>
</div>
