<div class="edd-del">
    <mat-icon matTooltip="View"  (click)="view($event)">visibility</mat-icon>
    <mat-icon matTooltip="Edit" *ngIf="statusCheck?.approval_status !== 'APPROVED'" (click)="edit($event)">edit</mat-icon>
    <mat-icon matTooltip="Delete" *ngIf="statusCheck?.approval_status !== 'APPROVED'"  (click)="delete($event)">delete</mat-icon>
</div>
