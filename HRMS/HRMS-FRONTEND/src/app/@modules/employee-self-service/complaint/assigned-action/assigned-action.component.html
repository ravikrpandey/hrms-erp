<div class="edd-del">
  <mat-icon
    *ngIf="assignAction?.Write && (cellValue?.complain_status !== 'COMPLETED' && cellValue?.complain_status !== 'REJECTED')"
    (click)="edit($event)">
    edit
  </mat-icon>

  <mat-icon
    *ngIf="assignAction?.Read && (cellValue?.complain_status === 'COMPLETED' || cellValue?.complain_status === 'REJECTED')"
    (click)="openDialog()">
    visibility
  </mat-icon>
</div>
