<div class="dialog">
    <h3 mat-dialog-title class="popHead" style="padding-left: 5px">Ticket List</h3>
    <form class="form ticket_allocate" [formGroup]="TicketManagement">
        <fieldset>
            <div class="row">
                <div class="col-md-12">
                    <div class="row align-items-center">
                        <mat-form-field appearance="outline">
                            <mat-label>Status</mat-label>
                            <mat-select formControlName="status_type" (selectionChange)="selectStatus($event)">
                                <mat-option *ngFor="let item of Status" [value]="item">
                                    {{ item }}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>
                <div class="col-md-12" *ngIf="TicketManagement.get('status_type')?.value != 'CLOSE'">
                    <div class="row align-items-center">
                        <mat-form-field appearance="outline">
                            <mat-label>Allocate To</mat-label>
                            <mat-select formControlName="allocate_id">
                                <mat-option *ngFor="let data of employeList; let i = index" [value]="data?.employee_id">
                                    {{data.first_name+data?.last_name}}
                                </mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>
            </div>
            <div class="mt-3" *ngIf="TicketManagement.get('status_type')?.value == 'CLOSE'">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Remark</mat-label>
                    <textarea matInput rows="4" formControlName="remark" placeholder="Enter Remark"></textarea>
                    <mat-error *ngIf="TicketManagement.get('remark')?.invalid">
                        *Required!
                    </mat-error>
                </mat-form-field>
            </div>
            <mat-dialog-actions align="end">
                <button type="button" mat-raised-button color="primary" class="mx-2" (click)="handleSubmit()">Submit</button>
                <button mat-raised-button color="danger" class="mx-2" (click)="onNoClick()">Close</button>
            </mat-dialog-actions>

        </fieldset>
    </form>
</div>
