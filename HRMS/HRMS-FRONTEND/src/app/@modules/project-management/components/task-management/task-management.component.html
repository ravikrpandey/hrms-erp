<div class="heading_top">
  <div class="page-title">
    <h1>Tasks</h1>
    <p>
      Project Management
      <i class="fa fa-angle-right" aria-hidden="true" style="color:#5d6c7c"></i>
      <span>Tasks</span>
    </p>
  </div>
  <div class="add_button">
    <button type="button" class="btn_add" (click)="openCreateTask()">
      <i class="fa fa-plus"></i> Add Task
    </button>
  </div>
</div>

<div class="right_data_all">
  <!-- Status Filter Tabs / Chips -->
  <div class="zoho-status-tabs">
    <button
      type="button"
      class="tab-chip"
      [class.active]="selectedStatus === 'All'"
      (click)="setStatusFilter('All')"
    >
      All Tasks <span class="chip-count">{{ allCount }}</span>
    </button>
    <button
      type="button"
      class="tab-chip"
      [class.active]="selectedStatus === 'To Do'"
      (click)="setStatusFilter('To Do')"
    >
      To Do <span class="chip-count">{{ todoCount }}</span>
    </button>
    <button
      type="button"
      class="tab-chip"
      [class.active]="selectedStatus === 'In Progress'"
      (click)="setStatusFilter('In Progress')"
    >
      In Progress <span class="chip-count">{{ inProgressCount }}</span>
    </button>
    <button
      type="button"
      class="tab-chip"
      [class.active]="selectedStatus === 'In Review'"
      (click)="setStatusFilter('In Review')"
    >
      In Review <span class="chip-count">{{ inReviewCount }}</span>
    </button>
    <button
      type="button"
      class="tab-chip"
      [class.active]="selectedStatus === 'Waiting for Information'"
      (click)="setStatusFilter('Waiting for Information')"
    >
      Waiting for Info <span class="chip-count">{{ waitingForInfoCount }}</span>
    </button>
    <button
      type="button"
      class="tab-chip"
      [class.active]="selectedStatus === 'Completed'"
      (click)="setStatusFilter('Completed')"
    >
      Completed <span class="chip-count">{{ completedCount }}</span>
    </button>
    <button
      type="button"
      class="tab-chip tab-chip-overdue"
      [class.active]="selectedStatus === 'Overdue'"
      (click)="setStatusFilter('Overdue')"
      *ngIf="overdueCount > 0"
    >
      <i class="fa fa-exclamation-triangle mr-1 text-danger"></i> Overdue <span class="chip-count chip-count-danger">{{ overdueCount }}</span>
    </button>
  </div>

  <!-- Filter Toolbar -->
  <div class="filter-toolbar">
    <div class="toolbar-left">
      <div class="search-box">
        <i class="fa fa-search"></i>
        <input
          type="text"
          class="form-control"
          placeholder="Search task or assignee..."
          [(ngModel)]="searchTerm"
          (input)="onFilterTextBoxChanged()"
        />
      </div>

      <div class="dept-select-box">
        <mat-select
          class="form-select py-0 d-flex align-items-center"
          style="min-width: 170px; height: 38px; font-size: 13px; background: #fff;"
          [(ngModel)]="selectedProjectId"
          [compareWith]="compareIds"
          (selectionChange)="onProjectChange()"
        >
          <app-search-filter
            *ngIf="projects.length >= 8"
            [array]="projects"
            [searchFields]="['project_name', 'project_code']"
            placeholder="Search project..."
            (filteredReturn)="filteredToolbarProjects = $event.data"
          ></app-search-filter>
          <mat-option value="">All Projects</mat-option>
          <mat-option *ngFor="let p of filteredToolbarProjects" [value]="p.project_id">
            {{ p.project_name }}
          </mat-option>
        </mat-select>
      </div>

      <div class="dept-select-box">
        <select class="form-select" [(ngModel)]="selectedPriority" (change)="onPriorityChange()">
          <option value="All">All Priorities</option>
          <option value="Urgent">Urgent</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>
    </div>

    <div class="toolbar-right">
      <span class="page-size-label">Show</span>
      <select class="form-select page-size-select" [(ngModel)]="pageSize" (change)="onPageSizeChange()">
        <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
      </select>
      <span class="page-size-label">entries</span>
    </div>
  </div>

  <!-- AG Grid Table -->
  <div class="table-container ag-grid-wrapper">
    <ag-grid-angular
      #agGrid
      style="width: 100%; height: 560px;"
      class="ag-theme-alpine"
      [rowData]="filteredTasks"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [pagination]="true"
      [paginationPageSize]="pageSize"
      [suppressRowClickSelection]="true"
      [rowHeight]="56"
      [headerHeight]="42"
      (gridReady)="onGridReady($event)"
      (gridSizeChanged)="onGridSizeChanged($event)"
    ></ag-grid-angular>
  </div>
</div>

<app-task-dialog
  *ngIf="showTaskDialog"
  [task]="editingTask"
  [projects]="projects"
  [employees]="employees"
  [currentUser]="currentUser"
  [canEdit]="canEditTask(editingTask)"
  [isProjectHeadOrAdmin]="canReopenTask(editingTask)"
  [initialView]="initialTaskDialogView"
  (close)="closeTaskDialog()"
  (saved)="onTaskSaved()"
  (reviewed)="onTaskSaved()"
></app-task-dialog>

<app-task-review-dialog
  *ngIf="showReviewDialog"
  [task]="taskToReview"
  [currentUser]="currentUser"
  (close)="closeReviewDialog()"
  (reviewed)="onTaskReviewed($event)"
></app-task-review-dialog>

<app-task-activity-dialog
  *ngIf="showActivityDialog"
  [task]="taskForActivity"
  [currentUser]="currentUser"
  (close)="closeActivityDialog()"
  (activityUpdated)="loadTasks()"
></app-task-activity-dialog>
