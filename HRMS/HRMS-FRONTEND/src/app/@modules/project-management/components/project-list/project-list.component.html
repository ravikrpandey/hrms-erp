<div class="heading_top">
  <div class="page-title">
    <h1>Projects</h1>
    <p>
      Project Management
      <i class="fa fa-angle-right" aria-hidden="true" style="color:#5d6c7c"></i>
      <span>Projects</span>
    </p>
  </div>
  <div class="add_button" *ngIf="canCreateProject">
    <button type="button" class="btn_add" (click)="goToCreate()">
      <i class="fa fa-plus"></i> Add Project
    </button>
  </div>
</div>

<div class="right_data_all">
  <!-- Status Filter Tabs / Chips -->
  <div class="zoho-status-tabs">
    <button
      type="button"
      class="tab-chip"
      [class.active]="selectedStatus === 'All'"
      (click)="setStatusFilter('All')"
    >
      All Projects <span class="chip-count">{{ allCount }}</span>
    </button>
    <button
      type="button"
      class="tab-chip"
      [class.active]="selectedStatus === 'Active'"
      (click)="setStatusFilter('Active')"
    >
      Active / In Progress <span class="chip-count">{{ activeCount }}</span>
    </button>
    <button
      type="button"
      class="tab-chip"
      [class.active]="selectedStatus === 'Completed'"
      (click)="setStatusFilter('Completed')"
    >
      Completed <span class="chip-count">{{ completedCount }}</span>
    </button>
    <button
      type="button"
      class="tab-chip"
      [class.active]="selectedStatus === 'On Hold'"
      (click)="setStatusFilter('On Hold')"
    >
      On Hold <span class="chip-count">{{ onHoldCount }}</span>
    </button>
    <button
      type="button"
      class="tab-chip chip-overdue"
      [class.active]="selectedStatus === 'Overdue'"
      (click)="setStatusFilter('Overdue')"
      *ngIf="overdueCount > 0"
    >
      <i class="fa fa-exclamation-circle mr-1"></i> Overdue <span class="chip-count">{{ overdueCount }}</span>
    </button>
  </div>

  <!-- Filter Toolbar -->
  <div class="filter-toolbar">
    <div class="toolbar-left">
      <div class="search-box">
        <i class="fa fa-search"></i>
        <input
          type="text"
          class="form-control"
          placeholder="Search by name, client, code, manager..."
          [(ngModel)]="searchTerm"
          (input)="onFilterTextBoxChanged()"
        />
      </div>

      <div class="dept-select-box" *ngIf="departments.length > 0">
        <mat-select
          class="form-select py-0 d-flex align-items-center"
          style="min-width: 170px; height: 38px; font-size: 13px; background: #fff;"
          [(ngModel)]="selectedDepartment"
          (selectionChange)="onDepartmentChange()"
        >
          <app-search-filter
            *ngIf="departments.length >= 8"
            [array]="departmentsListObjects"
            [searchFields]="['name']"
            placeholder="Search department..."
            (filteredReturn)="filteredDepartmentsList = $event.data"
          ></app-search-filter>
          <mat-option value="All">All Departments</mat-option>
          <mat-option *ngFor="let dept of filteredDepartmentsList" [value]="dept.name">
            {{ dept.name }}
          </mat-option>
        </mat-select>
      </div>
    </div>

    <div class="toolbar-right">
      <span class="page-size-label">Show</span>
      <select class="form-select page-size-select" [(ngModel)]="pageSize" (change)="onPageSizeChange()">
        <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
      </select>
      <span class="page-size-label">entries</span>
    </div>
  </div>

  <!-- AG Grid Table -->
  <div class="table-container ag-grid-wrapper">
    <ag-grid-angular
      #agGrid
      style="width: 100%; height: 560px;"
      class="ag-theme-alpine"
      [rowData]="filteredProjects"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [pagination]="true"
      [paginationPageSize]="pageSize"
      [suppressRowClickSelection]="true"
      [rowHeight]="52"
      [headerHeight]="42"
      (gridReady)="onGridReady($event)"
      (gridSizeChanged)="onGridSizeChanged($event)"
    ></ag-grid-angular>
  </div>
</div>
