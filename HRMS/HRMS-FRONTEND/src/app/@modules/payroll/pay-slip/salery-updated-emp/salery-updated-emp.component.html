        Back</button> -->
    </div>
  </div>
  <div class="right_data_all">

                <div class="row mt-3">
                  <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-12 mt-3" [ngClass]="{'disable-pointer-events': action_type == 'view' }">
                    <div class="row">
                      <div class="col-md-3">
                        <label for="bonusPercentage" class="custom-label mandatory">Annual CTC</label>
                      </div>
                      <div class="col-md-6">
                        <div class="mb-2 custom-input-group">
                          <div class="custom-input-container">
                            <input matInput formControlName="annualCTC" type="number" class="custom-input-field"
                              id="bonusPercentage" aria-label="Bonus Percentage" (input)="enterSalary('fromAnnualCtc')">
                            <div class="custom-addon">₹</div>
                          </div>
                        </div>
                      </div>
                      <div class="col-md-3">
                        <p style="margin-top: 10px;">per year</p>
                      </div>
                    </div>
                  </div>
                  <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-12 mt-3" [ngClass]="{'disable-pointer-events': action_type == 'view' }">
                    <div class="row">
                      <div class="col-md-3">
                        <label for="bonusPercentage" class="custom-label mandatory">Monthly CTC</label>
                      </div>
                      <div class="col-md-6">
                        <div class="mb-2 custom-input-group">
                          <div class="custom-input-container">
                            <input matInput formControlName="monthlyCTC" type="number" class="custom-input-field"
                              aria-label="Bonus Percentage">
                            <div class="custom-addon">₹</div>
                          </div>
                        </div>
                      </div>
                      
                    </div>
                  </div>
                </div>
  
                <div class="row mt-3">
                  <div class="col-12">
                    <table class="table">
                      <thead>
                        <tr> 
                          <th>Salary Components</th>
                          <th>Calculation Type</th>
                          <th>Monthly Amount</th>
                          <th>Annual Amount</th>
                          <th></th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td colspan="4">
                            <h3 class="text-primary">Earnings</h3>
                          </td>
                        </tr>
  
                        <ng-container formArrayName="earningComponentList">
                          <tr *ngFor="let earning of earningComponentList.controls; let i = index" [formGroupName]="i">
                            <td>
                              {{ earning.get('componentName')?.value }}
                              <ng-container *ngIf="earning.get('componentName')?.value == 'Fixed Allowance'">
                                <mat-icon
                                  matTooltip="Fixed Allowance is a residual component of salary that is left after allocations are made for all other components.">info</mat-icon>
                                <p class="text-muted">Monthly CTC - Sum of all other components</p>
                              </ng-container>
                            </td>
                            <ng-container *ngIf="earning.get('basicPercentage')">
                              <td>
                                <div class="input-group w-75">
                                  <input type="number" class="form-control" (keyup)="updateEarningsPercent(earning)" (input)="updateEarningsPercent(earning)" formControlName="basicPercentage"  />
                                  <span class="input-group-text">% of {{ earning.get('calculationType')?.value }}</span>
                                </div>
  
                              </td>
                              <td>
                                <input type="text" class="form-control" formControlName="monthlyBasic" readonly />
                              </td>
                              <td>
                                <input type="text" class="form-control" formControlName="annualBasic" readonly />
                              </td>
                            </ng-container>
  
                            <ng-container *ngIf="earning.get('fixedAllowanceMonthly')">
                              <td>Fixed amount</td>
                              <td>
                                <input type="number" class="form-control" formControlName="fixedAllowanceMonthly"
                                  (keyup)="updateFixedEarningAmount(i)" (input)="totalCountCreate()" />
                              </td>
                              <td>
                                <input type="text" class="form-control" formControlName="fixedAllowanceAnnual" readonly />
                              </td>
                            </ng-container>
  
                            <td>
                              <button mat-icon-button color="warn" (click)="removeEarningComponent(i)"
                                *ngIf="earning.get('earningTypeCode')?.value !== 'BASIC1'">
                                <mat-icon>delete</mat-icon>
                              </button>
                            </td>
                          </tr>
                        </ng-container>
  
                        <ng-container formArrayName="deductionComponentList">
                          <tr *ngIf="deductionComponentList.length>0">
                            <td colspan="4">
                              <h3 class="text-primary">Deductions</h3>
                            </td>
                          </tr>
  
                          <tr *ngFor="let deduction of deductionComponentList.controls; let i = index"
                            [formGroupName]="i">
                            <td>
                              {{ deduction.get('componentName')?.value }}
                              <ng-container
                                *ngIf="deduction.get('componentName')?.value == 'EPF' || deduction.get('componentName')?.value == 'ESI'">
                                <span class="text-muted"> - Employer Contribution</span>
                              </ng-container>
                            </td>
                            <ng-container *ngIf="deduction.get('basicPercentage')">
                              <td>
                                <div class="input-group w-75">
                                  <input type="text" class="form-control" formControlName="basicPercentage"
                                    (keyup)="updateDeduction()" />
                                  <span class="input-group-text">% of {{ deduction.get('calculationType')?.value }}</span>
                                </div>
  
                              </td>
                              <td>
                                <input type="text" class="form-control" formControlName="monthlyBasic" readonly />
                              </td>
                              <td>
                                <input type="text" class="form-control" formControlName="annualBasic" readonly />
                              </td>
                            </ng-container>
  
                            <ng-container *ngIf="deduction.get('fixedAllowanceMonthly')">
                              <td>Fixed amount</td>
                              <td>
                                <input type="number" class="form-control" formControlName="fixedAllowanceMonthly"
                                  (keyup)="onMonthlyDeductionAmountKeyup(i)" />
                              </td>
                              <td>
                                <input type="text" class="form-control" formControlName="fixedAllowanceAnnual" readonly />
                              </td>
                            </ng-container>
  
                            <td>
                              <button mat-icon-button color="warn" (click)="removeDeductionComponent(i)">
                                <mat-icon>delete</mat-icon>
                              </button>
                            </td>
                          </tr>
                        </ng-container>
  
                        <ng-container formArrayName="reiembursementComponentList">
                          <tr *ngIf="reiembursementComponentList.length > 0">
                            <td colspan="4">
                              <h3 class="text-primary">Allowance</h3>
                            </td>
                          </tr>
  
                          <tr *ngFor="let reiembursement of reiembursementComponentList.controls; let i = index"
                            [formGroupName]="i">
                            <td>
                              {{ reiembursement.get('componentName')?.value }} <br>
                              <span class="text-muted">Amount :
                                &nbsp;{{reiembursement.get('fixedAmountLimit')?.value}}</span>
                            </td>
                            <ng-container *ngIf="reiembursement.get('fixedAllowanceMonthly')">
                              <td>Fixed amount</td>
                              <td>
                                <input type="number" class="form-control" formControlName="fixedAllowanceMonthly"
                                  (keyup)="onMonthlyAmountKeyup(i)" />
                              </td>
                              <td>
                                <input type="text" class="form-control" formControlName="fixedAllowanceAnnual" readonly />
                              </td>
                            </ng-container>
  
                            <td>
                              <button mat-icon-button color="warn" (click)="removeRiembursementComponent(i)">
                                <mat-icon>delete</mat-icon>
                              </button>
                            </td>
                          </tr>
                        </ng-container>
                      </tbody>
                    </table>
  
                  </div>
                </div>
                <div *ngIf="negativeAlert" class="mt-2 alert alert-danger fw-bold" role="alert">
                  <div class="d-flex justify-content-between">
                    <div>
                      System Calculated Components' Total <br>
                      Amount must be greater than zero. Adjust the CTC or any of the component's amount. -
                    </div>
                    <div class="me-5">
                      {{negativeMonthly}}
                    </div>
                    <div class="me-5">
                      {{negativeAnualy}}
                    </div>
                  </div>
  
                </div>
             
                <div class=" mt-3 alert alert-primary fs-6" role="alert">
                  <div class="row">
                    <div class="col-6">
                      Cost to Company
                    </div>
                    <div class="col-3 text-center">
                      ₹ {{ totalMonthlyCTC }}
                    </div>
                    <div class="col-3 text-center">
                      ₹ {{ totalAnnualCTC }}
                    </div>
                  </div>
                </div>
              </div>
            </div>
  
          </div>
  
      
  
  
  
  
        <div class="col-xxl-12 col-lg-12 col-md-12 col-sm-12 col-12">
  
          <div class="common_button_sub fotter_u">
            <button (click)="onSubmitForm()">
              Save
            </button>
            <button class="cancel_button_y" (click)="Skip()">
              Cancel
            </button>
          </div>
        </div>
      </form> -->

    <mat-card [formGroup]="salaryForm">
      <div class="heading_neo">
        <h3>Attendance detail</h3>
      </div>
      <div class="basic_details mb-0">
        <div style="max-height: 400px; overflow-y: auto; overflow-x: auto;">
          <table class="table table-bordered mt-4 p-4">
            <thead>
              <tr>
                <th>P</th>
                <th>DP</th>
                <th>A</th>
                <th>DA</th>
                <th>PFD</th>
                <th>PHD</th>
                <th>HPFD</th>
                <th>HPHD</th>
                <th>NPFD</th>
                <th>NPHD</th>
                <th>UL</th>
                <th>UHL</th>
                <th>CO</th>
                <th>WFO</th>
                <th>WHO</th>
                <th>H</th>
           
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><mat-form-field appearance="outline"><input matInput type="number"
                      formControlName="total_P" /></mat-form-field></td>
                <td><mat-form-field appearance="outline"><input matInput type="number"
                      formControlName="total_DP" /></mat-form-field></td>
                <td><mat-form-field appearance="outline"><input matInput type="number"
                      formControlName="total_A" /></mat-form-field></td>
                <td><mat-form-field appearance="outline"><input matInput type="number"
                      formControlName="total_DA" /></mat-form-field></td>
                <td><mat-form-field appearance="outline"><input matInput type="number"
                      formControlName="total_PFD" /></mat-form-field></td>
                <td><mat-form-field appearance="outline"><input matInput type="number"
                      formControlName="total_PHD" /></mat-form-field></td>
                <td><mat-form-field appearance="outline"><input matInput type="number"
                      formControlName="total_HPFD" /></mat-form-field></td>
                <td><mat-form-field appearance="outline"><input matInput type="number"
                      formControlName="total_HPHD" /></mat-form-field></td>
                <td><mat-form-field appearance="outline"><input matInput type="number"
                      formControlName="total_NPFD" /></mat-form-field></td>
                <td><mat-form-field appearance="outline"><input matInput type="number"
                      formControlName="total_NPHD" /></mat-form-field></td>
                <td><mat-form-field appearance="outline"><input matInput type="number"
                      formControlName="total_UL" /></mat-form-field></td>
                <td><mat-form-field appearance="outline"><input matInput type="number"
                      formControlName="total_UHL" /></mat-form-field></td>
                <td><mat-form-field appearance="outline"><input matInput type="number"
                      formControlName="total_CO" /></mat-form-field></td>
                <td><mat-form-field appearance="outline"><input matInput type="number"
                      formControlName="total_WFO" /></mat-form-field></td>
                <td><mat-form-field appearance="outline"><input matInput type="number"
                      formControlName="total_WHO" /></mat-form-field></td>
                <td><mat-form-field appearance="outline"><input matInput type="number"
                      formControlName="total_H" /></mat-form-field></td>
              
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="col-12">
        <div class="common_button_sub fotter_u">
          <button (click)="onSubmitForm()">Save</button>
          <button class="cancel_button_y" (click)="Skip()">Cancel</button>
        </div>
      </div>
    </mat-card>

  </div>
</section>
