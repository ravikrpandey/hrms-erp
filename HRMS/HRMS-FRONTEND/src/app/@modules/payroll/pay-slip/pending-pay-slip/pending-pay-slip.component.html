      <mat-card-content>

          <div class="col-12 col-sm-4 col-md-4 col-12">
            <div class="form-group">
              <mat-form-field appearance="outline" style="width: 100%;">
                <mat-label>Select Month</mat-label>
                <mat-select [(ngModel)]="selectedMonth" (ngModelChange)="registrationall()">
                  <!-- <mat-select-filter [array]="months" (filteredReturn)="monthSearch($event)"></mat-select-filter> -->
                
                <app-search-filter [array]="monthList" [placeholder]="'Search by month name'" [searchFields]="['label']"
                  (filteredReturn)="filtermonths = $event.data">
                </app-search-filter>
                
                  <mat-option *ngFor="let data of filtermonths" [value]="data?.value">
                    {{ data?.label }}
                  </mat-option>
                </mat-select>
                <mat-error *ngIf="!selectedMonth">
                  *Required!
                </mat-error>
              </mat-form-field>
            </div>
          </div>
       
          <div class="col-4 col-sm-4 col-md-4 col-12">
            <mat-form-field appearance="outline" style="width: 100%;" class="readonly-wrapper">
              <mat-label>Select Year</mat-label>
              <mat-select [(ngModel)]="selectedYear" (ngModelChange)="registrationall()">
                <mat-option *ngFor="let year of financialYearList" [value]="year?.financial_year">
                  {{ year?.financial_year }}
                </mat-option>
              </mat-select>
              <mat-error *ngIf="!selectedYear">
                *Required!
              </mat-error>
            </mat-form-field>
          </div>

          <div class="col-12 col-sm-4 col-md-4 col-12">

                <mat-label>Select Branch</mat-label>
                <mat-select  [(ngModel)]="branch" (ngModelChange)="registrationall()">
                  <mat-option *ngFor="let branch of branchList" [value]="branch.id"> {{branch?.branch_name}} </mat-option>
                </mat-select>
                </mat-form-field>
            </div>
          </div> -->
          <!-- <div class="col-md-8" *ngIf="selectedMonth == currentMonth && paySlipDate == '1'"> -->
          <div>
            <div class="common_button_sub">
              <button type="button" (click)="handleSubmit()">
                Process
              </button>
            </div>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
    
    <div fxflex="100%">
      <div class="row">
        <div class="tab_menu">
          <div class="tab-item">
            <button class="main-button active_button">Pending</button>
  
            <button class="main-button" routerLink="/master/payroll/process-salary/hold-slip-detail">HOLD</button>
            <button class="main-button" routerLink="/master/payroll/process-salary/processed">PROCESSED</button>
          </div>
        </div>
      </div>
    </div>
  
    <div>
      <div class="mt-4">
        <div class="employ_sube py-2">
          <div class="example-header">
            <select (change)="onPageSizeChanged()" id="page-size">
              <option value="10" selected="">10</option>
              <option value="100">100</option>
              <option value="500">500</option>
              <option value="1000">1000</option>
            </select>
            <!-- <span class="pag_size">Per Page</span> -->
          </div>
          <div class="employee_2" align="end">
            <input type="text" class="form-control" id="filter-text-box" placeholder="Search"
              (input)="onFilterTextBoxChanged()">
          </div>
        </div>
      </div>
      <div class="ag_grid ">
        <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width: 100%; height: 426px"
          [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]=10 [rowData]="rowData"
          (gridReady)="onGridReady($event)" [gridOptions]="gridOptions" (selectionChanged)="onSelectionChanged($event)">
        </ag-grid-angular>
      </div>
    </div>
  
  </div>
