<div class="edd-del">
  <mat-icon matTooltip="View" (click)="view()">visibility</mat-icon>
  <a *ngIf="singleData?.pay_slip_status == 'PROCESSED'"
  href="{{baseUrl}}/api/v1/download_SalarySlip?pay_slip_month={{singleData?.pay_slip_month}}&employee_id={{singleData?.employee_id}}&financial_year_id={{this.financial_id}}&domain={{this.domain}}"
  download target="_blank">
  <mat-icon matTooltip="Download" style="color: black;">download</mat-icon>
</a>
  <!-- <span *ngIf="!singleData?.pay_slip_status">Pending</span> -->
  <mat-icon *ngIf="singleData?.pay_slip_status == 'INACTIVE'" matTooltip="Edit" (click)="edit($event)">edit</mat-icon>

</div>
