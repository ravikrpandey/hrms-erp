<div class="edd-del">
  <!-- <mat-icon matTooltip="Download">download</mat-icon> -->
  <mat-icon matTooltip="View" *ngIf="paramsVal?.bgv_status == 'COMPLETED'"
    (click)="viewBgvMailDetail()">visibility</mat-icon>
  <mat-icon matTooltip="email" *ngIf="paramsVal?.bgv_status == 'PENDING'" (click)="bgvSendOnMailOpen()">email</mat-icon>
  <mat-icon matTooltip="View Company Reviews"
    *ngIf="(paramsVal?.bgv_status != 'PENDING' && paramsVal?.bgv_status != 'COMPLETED')"
    (click)="companyReviewsView()">refresh</mat-icon>
    <mat-icon matTooltip="Candidate Document Verification"
    (click)="sendLink()" *ngIf="(paramsVal?.bgv_status != 'COMPLETED')">send</mat-icon>
</div>
