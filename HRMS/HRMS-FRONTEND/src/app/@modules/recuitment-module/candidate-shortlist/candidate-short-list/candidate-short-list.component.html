<div class="section">
  <div class="row head">
    <p>HRMS</p>
  </div>

  <div class="employ_sube">
    <div class="employee_top">
      Recruitment Module
      <span class="employee_2"
        ><i class="fa fa-angle-right" aria-hidden="true" style="color: #858586">
        </i
        >Candidate Shortlist</span
      >
    </div>
    <div class="employee_2" align="end">
      <input
        type="text"
        placeholder="Search"
        class="form-control"
        id="filter-text-box"
        (input)="onFilterTextBoxChanged()"
      />
    </div>
  </div>

  <div class="profile-count">
    <p style="margin: 20px 5px">
       Shortlisted Candidate &nbsp;<span
        class="text"
        style="padding: 5px 15px"
        >{{ rowData?.length > 0 ? rowData?.length : 2 }}</span
      >
    </p>
  </div>

  <mat-card>
    <div class="form_head">
      <h3>Candidate Shortlisted</h3>
      <button class="backBtn" routerLink="../../"><i class="fa fa-arrow-circle-left"></i> Back</button>
    </div>
    <div class="ag_grid">
      <ag-grid-angular
        [rowClass]="rowClass"
        class="ag-theme-alpine"
        style="width: 100%; height: 400px"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [pagination]="true"
        [paginationPageSize]="10"
        (gridReady)="onGridReady($event)"
      >
      </ag-grid-angular>
    </div>
  </mat-card>
</div>
