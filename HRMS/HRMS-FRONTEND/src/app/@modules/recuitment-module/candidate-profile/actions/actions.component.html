<div class="edd-del">
    <mat-icon (click)="edit($event)" matTooltip="Download" *ngIf="assignAction?.Write">download</mat-icon>
    <mat-icon matTooltip="Approve" *ngIf="assignAction?.Write || assignAction?.Read"
        (click)="requestApprove($event)">check_circle</mat-icon>
    <mat-icon disabled (click)="emailSend($event)" matTooltip="Reject"
        *ngIf="assignAction?.Write || assignAction?.Read">close</mat-icon>
</div>
