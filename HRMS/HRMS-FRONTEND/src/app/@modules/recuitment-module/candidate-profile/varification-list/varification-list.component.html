<div class="section">
    <div class="row head">
        <p>Recruitment</p>
    </div>

    <div class="employ_sube">
        <div class="employee_top">Recruitment Module
            <span class="employee_2"><i class="fa fa-angle-right" aria-hidden="true" style="color:#858586">
                </i>
                Backgroung Varification List</span>
        </div>
        <div class="employee_2" align="end">
            <label>Search: </label>
            <input type="text" id="filter-text-box" (input)="onFilterTextBoxChanged()">
        </div>
    </div>

    <div class="employ_sube">
        <div class="add_btn">
            <button routerLink="../bvg-list" type="button" class="btn_add">Add BVG</button>
        </div>
        <div class="example-header">
            <span class="pag_size">Total No of Vendors</span>
            <select (change)="onPageSizeChanged()" id="page-size">
                <option value="10" selected="">10</option>
                <option value="100">10</option>
                <option value="500">100</option>
                <option value="1000">500</option>
            </select>
        </div>
    </div>

    <mat-card>
        <div class="row form_head">
            <h3>Candidate Profile</h3>
        </div>
        <div class="ag_grid p-4">
            <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style=" width:100%; height:400px;"
                [rowData]="rowData" [columnDefs]="columnDefs" [pagination]=true [paginationPageSize]=10
                (gridReady)="onGridReady($event)">
            </ag-grid-angular>
        </div>
    </mat-card>

</div>
