<div class="section">

  <div class="heading_top">
    <div class="page-title">
      <h1>Recruitment</h1>
      <p> Shortlisted Candidate List <i class="fa fa-angle-right" aria-hidden="true" style="color:#063178">
        </i><span>Shortlisted Candidate List </span></p>
    </div>
  </div>

  <div class="right_data_all pt-3">
        <div class="employ_sube py-2">
            <div class="example-header">
              <select (change)="onPageSizeChanged()" id="page-size">
                <option value="10" selected="">10</option> 
                <option value="100">100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
              </select>
              <!-- <span class="pag_size">Per Page</span> -->
            </div>
          <div class="employee_2" align="end">
            <input type="text" class="form-control" id="filter-text-box" placeholder="Search"
              (input)="onFilterTextBoxChanged()">
          </div>
        </div>
      <div class="ag_grid">
        <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style=" width:100%; height:426px;"
          [rowData]="rowDataJob" [columnDefs]="columnDefs" [pagination]="true" [paginationPageSize]="9"
          (gridReady)="onGridReady($event)">
        </ag-grid-angular>
      </div>
    </div>
