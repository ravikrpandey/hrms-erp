          <div class="row">
            <div
              class="col-xxl-4 col-lg-4 col-md-6 col-sm-6 col-xm-12"
              *ngFor="let data of employeeData | hrDashboardPipe : nameSearch"
            >
              <div class="card">
                <img
                  class="hr-profile"
                  src="assets//icons/icon_zyno/employee.png"
                  alt=""
                />
                <div class="card-body table_modal">

                  <table width="100%" border="1">
                    <tr>
                      <th scope="row">Candidate</th>
                      <td> {{ data?.condidate_name }}</td>
                    </tr>
                    <tr>
                      <th scope="row">Job Title</th>
                      <td> {{ data?.job_title || "-" }}</td>
                    </tr>
                    <tr>
                      <th scope="row">Status</th>
                      <td> {{ data?.status }}</td>
                    </tr>
                      <tr>
                      <th scope="row">Appear Date</th>
                      <td> {{ data?.application_date| date:'dd/MM/yyyy' || "-" }}</td>
                    </tr>
                  </table>
                  <div class="col-lg-12 col-md-12 text-center">
                    <div class="round_cir">
                      <button
                      class="round-info"
                      (click)="openDialog(data.candidate_id)"
                    >
                      Round Info
                    </button>
                    </div>
                   
                  </div>
                  </div>

                 
                </div>
              </div>
            </div>
          </div>
