<div class="section">

    <div class="heading_top">
        <div class="page-title">
        <h1>HRMS</h1>
        <p>Recruitment Module <i class="fa fa-angle-right" aria-hidden="true" style="color:#858586">
        </i><span>  Final Interview Status</span></p>
      </div>
        <div class="add_button a_at_bg">
            <button routerLink="../interview-status" type="button" *ngIf="assignAction?.Write">Add final Interview Status</button>
            <button routerLink="../candidate-short-create" type="button" *ngIf="assignAction?.Write">View & Update Status Remarks</button>
            <button  routerLink="../../"><i class="fa fa-arrow-circle-left"></i> Back</button>
        </div>
      </div>


      <div class="right_white_bg">
        <div class="page_heading">
         <h3>Final Interview Status</h3>
        </div>
        <div class="right_data_bg_white">
        <div class="employ_sube py-2">
            <div class="set_total_user">
              <div class="example-header">
                <p class="total_posting">Total Candidates &nbsp;<span class="text" style="padding:5px 15px;">{{rowData?.length>0?rowData.length:2}}</span></p>
              </div>
            </div>
        
          
        
            <div>
              <input
              type="text"
              placeholder="Search"
              class="form-control"
              id="filter-text-box" (input)="onFilterTextBoxChanged()"
            />
            </div>
        
          </div>
    


          <div class="ag_grid ag_grid_cus">
            <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style=" width:100%; height:400px;"
                [rowData]="rowData" [columnDefs]="columnDefs" [pagination]=true [paginationPageSize]=10
                (gridReady)="onGridReady($event)" (cellClicked)='onCellClicked($event)'>
            </ag-grid-angular>
        </div>
</div>

</div>
</div>
