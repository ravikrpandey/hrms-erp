<div class="section">

  <div class="heading_top">
    <div class="page-title">
      <h1>Manpower List</h1>
      <p>Recruitment <i class="fa fa-angle-right" aria-hidden="true" style="color:#858586">
        </i><span>Manpower List </span></p>
    </div>
    <div class="add_button">
      <button type="button" (click)="downloadCSV()">Download CSV </button>
    </div>
  </div>


<div>
  <div class="ag_grid">
    <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width: 100%; height: 426px"
      [columnDefs]="columnDefsJob" [pagination]="true" [paginationPageSize]="9" [rowData]="approvedJdList"
      [gridOptions]="gridOptions" (gridReady)="onGridReady($event)">
    </ag-grid-angular>
  </div>
</div>
