<div class="edd-del ">
  <ng-container  *ngIf="currentStatus.data.status!=='STOP'">
    <mat-icon matTooltip="Stop" (click)="stop($event)" *ngIf="currentStatus.data.status!=='STOP'">stop</mat-icon>
    <mat-icon matTooltip="Pause" (click)="pause($event)" *ngIf="currentStatus.data.status!=='HOLD'">pause</mat-icon>
    <mat-icon matTooltip="Start" (click)="start($event)" *ngIf="currentStatus.data.status!=='START'">play_arrow</mat-icon>
  </ng-container>
    <mat-icon matTooltip="view"  (click)="viewScheduledProduction()"  >visibility</mat-icon>
</div>
