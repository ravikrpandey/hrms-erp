<div class="action-buttons">
  <mat-icon *ngIf="IsStatus === 'REJECTED' || IsStatus === 'APPROVED'" matTooltip="View" class="action-icon"
    (click)="viewDetails()">visibility</mat-icon>
  <mat-icon *ngIf="IsStatus !== 'REJECTED' && IsStatus !== 'APPROVED'" matTooltip="View" class="action-icon"
    (click)="viewDetails()">visibility</mat-icon>
  <mat-icon *ngIf="IsStatus !== 'REJECTED' && IsStatus !== 'APPROVED'" matTooltip="Edit" class="action-icon"
    (click)="editItem()">edit</mat-icon>
  <mat-icon *ngIf="IsStatus !== 'REJECTED' && IsStatus !== 'APPROVED'" matTooltip="Delete" class="action-icon"
    (click)="deleteItem()">delete</mat-icon>
</div>
