<div>
    <!-- Show the Pending button only when IsStatus is not 'REJECTED' or 'APPROVED' -->
    <button *ngIf="IsStatus !== 'REJECTED' && IsStatus !== 'APPROVED'" class="btn btn-danger" (click)="EmployeeTransfer()">
        Pending
    </button>
</div>
<div class="action-buttons">
    <mat-icon matTooltip="View" class="action-icon" (click)="viewDetails()">visibility</mat-icon>
</div>
