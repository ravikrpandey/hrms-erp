<div class="container">
  <div class="row">
    <div class="col-md-6">
      <h1>Employee Transfer</h1>
      <span>HRMS <i class="fa fa-angle-right" aria-hidden="true"></i> &nbsp;<span>Employee Transfer</span></span>
    </div>
    <div class="col-md-6 text-end">
      <button class="btn btn-primary" (click)="addEmployeetranfser()" style="background-color: #0c85c0; height: 40px;">
        New Request
      </button>
    </div>
  </div>
</div>

<div class="right_data_all">
  <section class="tab-bar">
    <div class="row">
      <div class="tab_menu">
        <div class="tab-item">
          <button class="main-button" color="primary" routerLinkActive="active" routerLink="my-Request"
            (click)="onTabSelect('myRequest')">My Request</button>
          <button class="main-button" color="primary" routerLinkActive="active" routerLink="pending-for-approval"
            (click)="onTabSelect('pendingForApproval')">Pending For Approval</button>
          <button class="main-button" color="primary" routerLinkActive="active" routerLink="approval"
            (click)="onTabSelect('approved')">Approved</button>
          <button class="main-button" color="primary" routerLinkActive="active" routerLink="reject"
            (click)="onTabSelect('rejected')">Rejected</button>
        </div>
      </div>
    </div>
  </section>
</div>
