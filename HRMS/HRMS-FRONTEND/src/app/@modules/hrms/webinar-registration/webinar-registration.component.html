<div class="wr-page">
  <div class="wr-card">
    <header class="wr-header">
      <h1>Webinar / Seminar Registration</h1>
      <p class="subtitle">Fill the form below to register</p>
    </header>

    <form class="wr-form" (ngSubmit)="onSubmit()" #regForm="ngForm">
      <div class="row">
        <div class="field">
          <label>First Name</label>
          <input type="text" [(ngModel)]="formData.firstName" name="firstName" required />
        </div>
        <div class="field">
          <label>Last Name</label>
          <input type="text" [(ngModel)]="formData.lastName" name="lastName" />
        </div>
      </div>

      <div class="row">
        <div class="field full">
          <label>Email</label>
          <input type="email" [(ngModel)]="formData.email" name="email" required />
        </div>
      </div>

      <div class="row">
        <div class="field full">
          <label>Phone Number</label>
          <input type="tel" [(ngModel)]="formData.phone" name="phone" />
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary" [disabled]="!regForm.valid || loading">
          {{ loading ? 'Registering...' : 'Register' }}
        </button>
        <button type="button" class="btn-ghost" (click)="onReset()">Reset</button>
      </div>
    </form>
  </div>
</div>
