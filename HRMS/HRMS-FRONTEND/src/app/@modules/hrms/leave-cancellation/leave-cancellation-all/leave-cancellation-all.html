<div class="heading_top">
    <div class="page-title">
        <h1>HRMS</h1>
        <p>Leave<i class="fa fa-angle-right" aria-hidden="true" style="color:#5d6c7c">
            </i><span>Cancelled List</span></p>
    </div>
    <div class="add_button">
        <button type="button" class="btn_add" (click)="cancelRequest()">+ Cancel Leave</button>
    </div>
</div>

<div class="right_data_all" >
    <div class="ag_grid">
        <ag-grid-angular  class="ag-theme-alpine" style="width:100%; height:426px;"
            [rowData]="rowData" [columnDefs]="columnDefs" [pagination]=true [paginationPageSize]=10
            (gridReady)="onGridReady($event)" [rowClass]="rowClass">
        </ag-grid-angular>
    </div>
</div>
