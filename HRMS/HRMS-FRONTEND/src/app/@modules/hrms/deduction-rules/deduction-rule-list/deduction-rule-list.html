<div class="heading_top">
    <div class="page-title">
        <h1>HRMS</h1>
        <p>Deduction Rules <i class="fa fa-angle-right" aria-hidden="true" style="color:#5d6c7c">
            </i><span>Deduction Rule List</span></p>
    </div>
</div>



<div class="row">
    <div style="text-align: right ; margin-top:10px ;">
        <button class="btn" style="background-color: #0c85c0" (click)="onAdd()">
            Add
        </button>
    </div>
</div>


<div class="right_data_all">
    <div class="employ_sube py-2">
        <div class="example-header">
            <select (change)="onPageSizeChanged()" id="page-size">
                <option value="10" selected>10</option>
                <option value="100">100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
        </div>
        <div>
            <input type="text" class="form-control" id="filter-text-box" #input placeholder="Search" (input)="onFilterTextBoxChanged()">
        </div>
    </div>
    <div class="ag_grid">
        <ag-grid-angular [rowClass]="rowClass" class="ag-theme-alpine" style="width:100%; height:400px;"
            [rowData]="rowData" [columnDefs]="columnDefs" 
            (gridReady)="onGridReady($event)">
        </ag-grid-angular>
    </div>
</div>
