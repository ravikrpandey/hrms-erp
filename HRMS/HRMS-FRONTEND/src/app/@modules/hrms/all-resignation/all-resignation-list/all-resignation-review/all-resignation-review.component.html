<div class="heading_top">
    <div class="page-title">
        <h1>HRMS</h1>
        <p>All Resignation<i class="fa fa-angle-right" aria-hidden="true" style="color:#858586">
      </i><span>All Resignation</span></p>
    </div>
    <div class="add_button">
      <button class="backBtn" (click)="goBack()"><i class="fa fa-arrow-circle-left"></i> Back</button>
    </div>
  </div>
  
  <section class="right_data_all pt-4 pb-5">
    <div class="heading_neo">
      <h3>Add Review</h3>
    </div>
      <mat-card>
          <form class="form_set" [formGroup]="roleMasterForm">
            <div class="row" *ngFor="let item of roleData; let i = index">
              <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-12 mb-2">
                <div class="form-group">
                  <mat-form-field appearance="outline">
                    <input matInput type="text" [formControlName]="'review' + i" [readonly]="disable"/>
                  </mat-form-field>
                </div>
              </div>
          
              <div class="col-xxl-6 col-lg-6 col-md-6 col-sm-6 col-12 mb-4">
                <mat-radio-group [formControlName]="'comments' + i"  class="custom-radio">
                  <mat-radio-button value="yes">
                    <label class="abc">Yes</label>
                  </mat-radio-button>
                  <mat-radio-button value="no">
                    <label class="abc">No</label>
                  </mat-radio-button>
                  <mat-radio-button value="na">
                    <label class="abc">NA</label>
                  </mat-radio-button>
                </mat-radio-group>
              </div>
              
            </div>
              <div class="mt-3 common_button_sub">
                <button  (click)="submit()">
                  Submit
                </button>
                <!-- <button class="cancel_button_y" (click)="back()">
                  Cancel
                </button> -->
              </div>
          </form>
      </mat-card>
  </section>
