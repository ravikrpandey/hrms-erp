<div class="heading_top">
  <div class="page-title">
    <h1>Leave Management</h1>
    <p>Leave Policy <i class="fa fa-angle-right" aria-hidden="true" style="color:#858586"></i>
      <span> {{activeButton}} </span>
    </p>
  </div>
  <div class="add_button">
    <button class="backBtn" (click)="goBack()"><i class="fa fa-arrow-circle-left"></i> Back</button>
  </div>
</div>





<div class="form_basic1 main_form">
  <div class="right_data_all">
    <div class="m-4" fxflex="100%">
      <div class="row">
        <div class="tab_menu">
          <div class="tab-item">

            <button class="main-button" [disabled]="!active" [class.active_button]="activeButton === 'Policy Detail'"
              routerLinkActive="active_button" [routerLink]="['Policy-Detail']"
              (click)="goToPolicyDetails('Policy Detail')">
              Policy Details
            </button>

            <button class="main-button" [disabled]="!active"
              [class.active_button]="activeButton === 'Policy Entitlement'" routerLinkActive="active_button"
              (click)="goToPolicyEntitlement('Policy Entitlement')">
              Policy Entitlement
            </button>

            <button class="main-button" [disabled]="!active"
              [class.active_button]="activeButton === 'Policy Applicability'" routerLinkActive="active_button"
              (click)="goToPolicyApplicability('Policy Applicability')">
              Policy Applicability
            </button>

            <button class="main-button" [disabled]="!active"
              [class.active_button]="activeButton === 'Policy Restrictions'" routerLinkActive="active_button"
              (click)="goToPolicyRestrictions('Policy Restrictions')">
              Policy Restrictions
            </button>
          </div>
        </div>
      </div>
    </div>
    <router-outlet></router-outlet>
  </div>
</div>
