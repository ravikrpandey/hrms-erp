<div class="heading_top">
    <div class="page-title">
        <h1>HRMS</h1>
        <p>Attendance Working Hours <i class="fa fa-angle-right" aria-hidden="true" style="color:#5d6c7c">
            </i><span>Attendance Working Hours List</span></p>
    </div>
</div>



<div class="right_data_all">
  <div class="employ_sube py-2 d-flex gap-2 align-items-center">
    <!-- Page Size -->
    <div class="example-header">
      <select (change)="onPageSizeChanged()" id="page-size">
        <option value="10" selected>10</option>
        <option value="100">100</option>
        <option value="500">500</option>
        <option value="1000">1000</option>
      </select>
    </div>

    <!-- Month picker -->
    <div>
      <input
        id="month-picker"
        type="month"
        class="form-control"
        (change)="onMonthPicked($event)"
        placeholder="Select month"/>
    </div>

   

    <!-- Shift filter -->
    <div>
     
      <select class="form-control" (change)="onShiftChanged($event)">
        <option value="ALL">All Shifts</option>
        <option *ngFor="let s of listData" [value]="s.id">{{ s?.shift_name }}</option>
      </select>
    </div>

    <!-- Quick Search -->
    <div>
      <input type="text" class="form-control" id="filter-text-box" #input placeholder="Search" (input)="onFilterTextBoxChanged()">
    </div>
  </div>

  <div class="ag_grid">
    <ag-grid-angular
      class="ag-theme-alpine"
      style="width:100%; height:400px;"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [pagination]="true"
      [paginationPageSize]="paginationPageSize"
      (gridReady)="onGridReady($event)">
    </ag-grid-angular>
  </div>
</div>
