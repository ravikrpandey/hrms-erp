<h3 mat-dialog-title class="popHead">Digital Signature Details</h3>

<mat-dialog-content class="mat-typography mt-4">
  <div class="emp_key"></div>

  <mat-card class="custom-bordered-card">
    <h5 class="fw-bold mb-2">Approver Remark:</h5>
    <p class="mb-0">{{ cellData?.remark || "N/A" }}</p>
  </mat-card>
</mat-dialog-content>

<mat-dialog-actions align="end" class="common_button_sub mb-3">
  <button mat-dialog-close class="cancel_button_y">Close</button>
</mat-dialog-actions>
