  <h3 class="popHead">Approve</h3>
  <mat-dialog-content class="mat-typography">
    <form [formGroup]="designationForm">

        <div class="form-group mt-3">
          <mat-form-field appearance="outline">
            <mat-label>Employee Number </mat-label>
            <input matInput type="text" formControlName="employee_code" placeholder="Enter Employee Number " />
            <mat-error *ngIf="designationForm.controls['employee_code'].hasError('required')">
              *Required!
            </mat-error>
            <mat-error *ngIf="designationForm.controls['employee_code'].hasError('leadingSpaces')">
              *No leading spaces!
            </mat-error>
          </mat-form-field>
        </div>
      </div> -->
      <div class="col-md-12">
        <p class="onboard_message">Do you really want to On-Board this Employee?</p>
        <div class="form-group mt-3">
          <mat-form-field appearance="outline">
            <mat-label>Official Email Id </mat-label>
            <input matInput type="text" formControlName="employee_official_email"
              placeholder="Enter Employee Official Email Id " />
            <mat-error *ngIf="designationForm.controls['employee_official_email'].hasError('required')">
              *Required!
            </mat-error>
            <mat-error *ngIf="designationForm.controls['employee_official_email'].hasError('leadingSpaces')">
              *No leading spaces!
            </mat-error>

  </mat-dialog-content>
  <mat-dialog-actions align="end" class="common_button_sub mb-3" style="padding-right: 20px;">
    <button (click)="ngSubmitDesignation()">Submit</button>
    <button mat-dialog-close class="cancel_button_y">Close</button>
