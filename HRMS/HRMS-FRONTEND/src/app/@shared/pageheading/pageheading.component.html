<div class="row">
  <div class="col-xxl-6 col-xl-6 col-lg-6 col-sm-12 col-12">
    <div class="pageTitle">{{ pagename }}</div>
  </div>

  <div class="col-xxl-6 col-xl-6 col-lg-6 col-sm-12 col-12 text-end">
    <app-button
      *ngIf="backbuttonShow"
      type="back"
      text="Back"
      (buttonClick)="backHistory()"
      btnClass="fillBlue">
    </app-button>
  </div>
</div>
