<div class="dialog-backdrop" *ngIf="visible" (click)="closeOnBackdropClick && close()">
  <div
    class="dialog-container"
    [ngStyle]="style"
    (click)="$event.stopPropagation()"
    [@dialogAnimation]
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialog-title"
    aria-describedby="dialog-desc"
  >
    <div class="dialog-header" *ngIf="headerTemplate">
      <ng-container *ngTemplateOutlet="headerTemplate"></ng-container>
      <button *ngIf="closable" class="dialog-close" (click)="close()">×</button>
    </div>

    <div class="dialog-body">
      <ng-container *ngTemplateOutlet="bodyTemplate"></ng-container>
    </div>

    <div class="dialog-footer" *ngIf="footerTemplate">
      <ng-container *ngTemplateOutlet="footerTemplate"></ng-container>
    </div>
  </div>
</div>
