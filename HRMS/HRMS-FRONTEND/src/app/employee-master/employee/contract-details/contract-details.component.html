<section>
  <div class="conatiner">
    <mat-card>
      <div class="form_head">
        <h3>CONTRACT DETAILS</h3>
        <button class="backBtn" (click)="prevTab()"><i class="fa fa-arrow-circle-left"></i> Back</button>
      </div>

      <div class="form_basic">
        <form class="form_set" [formGroup]="contractForm">
          <div class="row">
            <!-- <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
              <div class="form-group">
                <mat-form-field appearance="outline" disabled="true">
                  <mat-label>Type Of Contract</mat-label>
                  <mat-select formControlName="contract_types_id">
                    <mat-option *ngFor="let contract of contractList" [value]="contract.id">{{ contract.contract_type
                      }}</mat-option>
                  </mat-select>
                  <mat-error *ngIf="contractForm.controls['contract_types_id'].hasError('required')">
                    This field is required!
                  </mat-error>
                </mat-form-field>
              </div>
            </div> -->
            <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
              <div class="form-group">
                <mat-form-field appearance="outline" readonly>
                  <mat-label>Start working date</mat-label>
                  <input matInput [matDatepicker]="dp" (click)="dp.open()" (dateChange)="startDate($event)" formControlName="start_working_date"
                    readonly />
                  <mat-datepicker-toggle matSuffix [for]="dp"></mat-datepicker-toggle>
                  <mat-datepicker #dp></mat-datepicker>
                  <mat-error *ngIf="
                        contractForm.controls['start_working_date'].hasError('required')
                      ">
                    This field is required!
                  </mat-error>
                </mat-form-field>
              </div>
            </div>
            <div class="col-xxl-4 col-lg-4 col-md-4 col-sm-4 col-12">
              <div class="form-group">
                <mat-form-field appearance="outline" readonly>
                  <mat-label>Probation End date</mat-label>
                  <input matInput [matDatepicker]="dpEX" (click)="dpEX.open()" [min]="calculateMinToDate()"  formControlName="end_date_probation"
                    readonly />
                  <mat-datepicker-toggle matSuffix [for]="dpEX"></mat-datepicker-toggle>
                  <mat-datepicker #dpEX></mat-datepicker>
                  <mat-error *ngIf="
                        contractForm.controls['end_date_probation'].hasError('required')
                      ">
                    This field is required!
                  </mat-error>
                </mat-form-field>
              </div>
            </div>

          </div>



          <div class="mt-3" *ngIf="!action_type">
            <button mat-raised-button color="primary" class="mx-3" (click)="onSubmitForm()">
              Submit
            </button>
          </div>
        </form>
      </div>
    </mat-card>

    <!-- <div align="start"  class="btn_employ">
            <button mat-raised-button class="btn1" color="primary" (click)="onSubmitForm()">Save</button>
            <button mat-raised-button class="btn2 mx-2" color="warn">Cancel</button>
        </div> -->
  </div>
</section>
