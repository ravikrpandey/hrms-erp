# ==============================================================================
# KIRAN AUTOMATION HRMS - Secure Lightsail HTTPS API Bridge (Nginx Virtual Host)
# Purpose: Terminates HTTPS (DuckDNS + Let's Encrypt) and forwards ONLY
#          authenticated Cloudflare Worker traffic to 127.0.0.1:3000.
# Note:    Co-exists safely alongside existing sites (e.g. mytaxfinder).
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name __BRIDGE_DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __BRIDGE_DOMAIN__;

    # Certbot populates/manages SSL directives when `certbot --nginx` runs
    ssl_certificate /etc/letsencrypt/live/__BRIDGE_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__BRIDGE_DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Reject any request that does not come through the authenticated Cloudflare Worker
    if ($http_x_bridge_secret != "__BRIDGE_SECRET__") {
        return 403;
    }

    location ~ ^/(health$|api/|uploaded_files/|digital_signature/|leadfile/|masterDocument/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Bridge-Secret $http_x_bridge_secret;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location / {
        return 404;
    }
}
