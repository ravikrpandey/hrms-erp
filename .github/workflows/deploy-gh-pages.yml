name: Deploy HRMS & ERP Frontends to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'HRMS/HRMS-FRONTEND/**'
      - 'ERP/elan_frontend/**'
      - '.github/workflows/deploy-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HRMS dependencies
        working-directory: HRMS/HRMS-FRONTEND
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install ERP dependencies
        working-directory: ERP/elan_frontend
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Inject Cloudflare Worker API URL
        env:
          WORKER_API_URL: ${{ vars.WORKER_API_URL }}
        run: |
          if [ -z "${WORKER_API_URL}" ]; then
            echo "::error::Repository variable WORKER_API_URL is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables (e.g. https://hrms-api.<subdomain>.workers.dev)."
            exit 1
          fi
          CLEAN_URL="${WORKER_API_URL%/}"
          sed -i "s|__WORKER_API_URL__|${CLEAN_URL}|g" HRMS/HRMS-FRONTEND/src/app/environments/environment.prod.ts
          sed -i "s|__WORKER_API_URL__|${CLEAN_URL}|g" ERP/elan_frontend/src/app/environments/environment.prod.ts

      - name: Build HRMS Frontend
        working-directory: HRMS/HRMS-FRONTEND
        run: |
          NODE_OPTIONS="--max-old-space-size=4096" npx ng build --configuration production --base-href /hrms-erp/

      - name: Build ERP Frontend
        working-directory: ERP/elan_frontend
        run: |
          NODE_OPTIONS="--max-old-space-size=5120" npx ng build --configuration production --base-href /hrms-erp/erp/

      - name: Combine HRMS and ERP Frontends and Setup Multi-SPA Redirects
        run: |
          mkdir -p HRMS/HRMS-FRONTEND/dist/kiran-automation-web/erp
          cp -r ERP/elan_frontend/dist/erp-web/. HRMS/HRMS-FRONTEND/dist/kiran-automation-web/erp/
          touch HRMS/HRMS-FRONTEND/dist/kiran-automation-web/.nojekyll

          cat > HRMS/HRMS-FRONTEND/dist/kiran-automation-web/404.html <<'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Redirecting to Kiran Automation...</title>
              <script>
                (function() {
                  var path = window.location.pathname;
                  var query = window.location.search || '';
                  var hash = window.location.hash || '';
                  var full = path + query + hash;

                  if (path.indexOf('/hrms-erp/erp') === 0) {
                    sessionStorage.redirect = full;
                    window.location.replace('/hrms-erp/erp/');
                  } else {
                    sessionStorage.redirect = full;
                    window.location.replace('/hrms-erp/');
                  }
                })();
              </script>
            </head>
            <body>
              <p>Redirecting to Kiran Automation...</p>
            </body>
          </html>
          EOF

          cp HRMS/HRMS-FRONTEND/dist/kiran-automation-web/404.html HRMS/HRMS-FRONTEND/dist/kiran-automation-web/erp/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: HRMS/HRMS-FRONTEND/dist/kiran-automation-web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
