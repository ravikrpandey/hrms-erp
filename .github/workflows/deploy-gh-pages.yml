name: Deploy HRMS Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'HRMS/HRMS-FRONTEND/**'
      - '.github/workflows/deploy-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HRMS/HRMS-FRONTEND

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: HRMS/HRMS-FRONTEND/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Inject Cloudflare Worker API URL
        env:
          WORKER_API_URL: ${{ vars.WORKER_API_URL }}
        run: |
          if [ -z "${WORKER_API_URL}" ]; then
            echo "::error::Repository variable WORKER_API_URL is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables (e.g. https://hrms-api.<subdomain>.workers.dev)."
            exit 1
          fi
          CLEAN_URL="${WORKER_API_URL%/}"
          sed -i "s|__WORKER_API_URL__|${CLEAN_URL}|g" src/app/environments/environment.prod.ts

      - name: Build Angular production bundle for GitHub Pages
        run: |
          NODE_OPTIONS="--max-old-space-size=4096" npx ng build --configuration production --base-href /hrms-erp/
          cp dist/kiran-automation-web/index.html dist/kiran-automation-web/404.html
          touch dist/kiran-automation-web/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: HRMS/HRMS-FRONTEND/dist/kiran-automation-web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
